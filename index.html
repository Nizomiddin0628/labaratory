<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Elektron laboratoriya</title>
<meta name="description" content="Maktab o‘quvchilari uchun virtual fizika va kimyo laboratoriya ishlari, o‘zbek tilida.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: sticky top bar · one centered column (max 1240px) · lab pages = stage + instrument rail, then notebook (steps, graphs, data table) */
:root {
  --bg: #f2f5f9;
  --surface: #ffffff;
  --surface-2: #e9eef5;
  --line: #d3dce8;
  --ink: #101c2e;
  --ink-2: #46566e;
  --ink-3: #7a889e;
  --phys: #2545d3;
  --phys-soft: #e2e8ff;
  --chem: #0b8a74;
  --chem-soft: #d9f2ec;
  --hist: #a06a12;
  --hist-soft: #f7ecd6;
  --lapis: #142a63;
  --lapis-ink: #f3e7c8;
  --gold: #d9a441;
  --good: #1d8549;
  --warn: #b26f12;
  --bad: #c0352d;
  --grid: rgba(37, 69, 211, 0.075);
  --lcd-bg: #e7edf4;
  --lcd-ink: #0f1b2d;
  --copper: #b8642f;
  --metal: #59616d;
  --glass: rgba(120, 150, 190, 0.45);
  --shadow: 0 1px 2px rgba(16, 28, 46, 0.06), 0 8px 24px rgba(16, 28, 46, 0.06);

  --accent: var(--phys);
  --accent-soft: var(--phys-soft);

  --font-display: "Unbounded", "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-body: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a101a;
    --surface: #111a28;
    --surface-2: #172234;
    --line: #25324a;
    --ink: #e5ebf4;
    --ink-2: #a6b2c6;
    --ink-3: #74829a;
    --phys: #8399ff;
    --phys-soft: #1a2448;
    --chem: #3cc9ae;
    --chem-soft: #0f2f2a;
    --hist: #e2b65e;
    --hist-soft: #2d2412;
    --lapis: #0e1d45;
    --lapis-ink: #f3e7c8;
    --gold: #e2b65e;
    --good: #4cc27f;
    --warn: #e5a94a;
    --bad: #f07067;
    --grid: rgba(131, 153, 255, 0.08);
    --lcd-bg: #08111d;
    --lcd-ink: #a9ecdc;
    --copper: #d9874f;
    --metal: #8a94a3;
    --glass: rgba(150, 180, 220, 0.4);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a101a;
  --surface: #111a28;
  --surface-2: #172234;
  --line: #25324a;
  --ink: #e5ebf4;
  --ink-2: #a6b2c6;
  --ink-3: #74829a;
  --phys: #8399ff;
  --phys-soft: #1a2448;
  --chem: #3cc9ae;
  --chem-soft: #0f2f2a;
  --hist: #e2b65e;
  --hist-soft: #2d2412;
  --lapis: #0e1d45;
  --lapis-ink: #f3e7c8;
  --gold: #e2b65e;
  --good: #4cc27f;
  --warn: #e5a94a;
  --bad: #f07067;
  --grid: rgba(131, 153, 255, 0.08);
  --lcd-bg: #08111d;
  --lcd-ink: #a9ecdc;
  --copper: #d9874f;
  --metal: #8a94a3;
  --glass: rgba(150, 180, 220, 0.4);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}

[data-subject="chem"] { --accent: var(--chem); --accent-soft: var(--chem-soft); }
[data-subject="phys"] { --accent: var(--phys); --accent-soft: var(--phys-soft); }
[data-subject="hist"] { --accent: var(--hist); --accent-soft: var(--hist-soft); }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { margin: 0; line-height: 1.2; text-wrap: balance; }
h1 { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.01em; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 22px; letter-spacing: -0.005em; }
h3 { font-size: 16px; font-weight: 650; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
sub, sup { line-height: 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.small { font-size: 13.5px; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: 0.09em; font-weight: 600; color: var(--ink-3); }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.wrap { width: 100%; max-width: 1240px; margin-inline: auto; padding-inline: 16px; }
@media (min-width: 720px) { .wrap { padding-inline: 28px; } }

/* ---------- Top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar .wrap { display: flex; align-items: center; gap: 12px; min-height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); margin-right: auto; min-width: 0; }
.brand svg { flex: none; }
.brand-name { font-family: var(--font-display); font-weight: 600; font-size: 15px; white-space: nowrap; }
.nav { display: flex; gap: 2px; }
.nav a {
  text-decoration: none; color: var(--ink-2); font-weight: 550; font-size: 15px;
  padding: 7px 12px; border-radius: 999px; white-space: nowrap;
}
.nav a:hover { color: var(--ink); background: var(--surface-2); }
.nav a.active { color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.nav a[data-nav="fizika"].active { color: var(--phys); }
.nav a[data-nav="kimyo"].active { color: var(--chem); }
.nav a[data-nav="allomalar"].active { color: var(--hist); }
.icon-btn { display: inline-grid; place-items: center; width: 36px; height: 36px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; cursor: pointer; color: var(--ink-2); }
.icon-btn:hover { color: var(--ink); }
.icon-btn .ic-off { display: none; }
.icon-btn[data-on="false"] .ic-on { display: none; }
.icon-btn[data-on="false"] .ic-off { display: block; }
.theme-btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 6px 12px 6px 9px; cursor: pointer; font-size: 14px; color: var(--ink-2);
}
.theme-btn:hover { color: var(--ink); }
.theme-btn .ic-sun { display: none; }
.theme-btn[data-mode="dark"] .ic-sun { display: block; }
.theme-btn[data-mode="dark"] .ic-moon { display: none; }
@media (max-width: 620px) {
  .tabs button { padding: 10px 10px 12px; font-size: 14.5px; }
  .nav .nav-home { display: none; }
  .topbar .wrap { gap: 8px; }
  .brand-name { display: none; }
  .theme-btn .tlabel { display: none; }
  .theme-btn { padding: 7px; }
  .nav a { padding: 7px 10px; }
}

main { padding-block: 28px 56px; min-height: 70vh; }

/* ---------- Buttons & controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid transparent; background: var(--accent); color: #fff;
  font-weight: 600; font-size: 15px; padding: 9px 16px; border-radius: 10px; cursor: pointer;
  text-decoration: none; line-height: 1.2; transition: filter .15s, transform .05s;
}
:root[data-theme="dark"] .btn { color: #0a101a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn { color: #0a101a; } }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn-ghost {
  text-decoration: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font-weight: 550; font-size: 14.5px; padding: 8px 13px; border-radius: 10px; cursor: pointer; line-height: 1.2;
}
.btn-ghost:hover { border-color: var(--ink-3); }
.btn-ghost:disabled { opacity: .45; cursor: not-allowed; }
.btn-ghost.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn-sm { padding: 6px 10px; font-size: 13.5px; border-radius: 8px; }
.btn-danger { color: var(--bad); }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button {
  border: 0; background: transparent; padding: 6px 11px; border-radius: 8px; cursor: pointer;
  font-size: 14px; font-weight: 550; color: var(--ink-2);
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

.field { display: grid; gap: 6px; }
.field + .field { margin-top: 14px; }
.field-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 14.5px; font-weight: 550; }
.field-head output { font-family: var(--font-mono); font-size: 14px; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
.field small { color: var(--ink-3); font-size: 12.5px; }
input[type="range"] { width: 100%; accent-color: var(--accent); margin: 2px 0; height: 22px; }
select, input[type="number"], input[type="text"] {
  border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 10px; font-size: 15px; width: 100%;
  min-width: 0;
}
input[type="number"] { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ---------- Cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); min-width: 0; }
.pad { padding: 18px; }
@media (min-width: 720px) { .pad { padding: 20px 22px; } }
.card-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.card-title h3 { font-size: 15px; letter-spacing: .01em; }

.graph-paper {
  background-color: var(--surface);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}

/* ---------- Home ---------- */
.hero { position: relative; padding-block: 24px 36px; }
.hero h1 { font-size: clamp(34px, 6.4vw, 68px); line-height: 1.02; letter-spacing: -0.025em; }
.hero h1 .tld { color: var(--phys); }
.thesis { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 6px 18px; font-family: var(--font-display); font-weight: 500; font-size: clamp(16px, 2.1vw, 22px); color: var(--ink-2); }
.thesis b { color: var(--ink); font-weight: 600; }
.hero .lede { margin-top: 18px; max-width: 62ch; font-size: 17.5px; color: var(--ink-2); }
.hero .btn-row { margin-top: 26px; }
.hero .btn-row .btn-phys { --accent: var(--phys); }
.hero .btn-row .btn-chem { --accent: var(--chem); }

.subjects { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 18px; margin-top: 8px; }
.subject-card { display: grid; grid-template-rows: auto 1fr; overflow: hidden; text-decoration: none; color: var(--ink); transition: border-color .15s, transform .15s; }
.subject-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.subject-card canvas { width: 100%; height: 190px; display: block; border-bottom: 1px solid var(--line); }
.subject-card .body { padding: 18px 20px 20px; display: grid; gap: 8px; align-content: start; }
.subject-card h2 { font-size: 24px; color: var(--accent); }
.subject-card .lab-title { font-weight: 600; font-size: 16px; }
.subject-card .go { margin-top: 6px; font-weight: 600; color: var(--accent); font-size: 15px; }

.section { margin-top: 52px; }
.section > h2 { margin-bottom: 18px; }
.flow { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 0; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); overflow: hidden; }
.flow > div { padding: 18px 20px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; }
.flow .k { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }
.flow h3 { margin: 6px 0 6px; font-size: 16.5px; }
.flow p { color: var(--ink-2); font-size: 14.5px; }

.why-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 24px; }
.why-grid h3 { font-size: 17px; margin-bottom: 6px; }
.why-grid p { color: var(--ink-2); font-size: 15px; }
.why-grid .figure { font-family: var(--font-display); font-weight: 600; font-size: 30px; color: var(--ink); margin-bottom: 4px; }

/* ---------- Subject page ---------- */
.page-head { display: grid; gap: 10px; margin-bottom: 26px; }
.page-head h1 { font-size: clamp(30px, 5vw, 46px); color: var(--accent); }
.page-head p { max-width: 64ch; color: var(--ink-2); font-size: 16.5px; }
.lab-list { display: grid; gap: 14px; }
.lab-card { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: center; padding: 22px; text-decoration: none; color: var(--ink); transition: border-color .15s; }
.lab-card:hover { border-color: var(--accent); }
.lab-card h2 { font-family: var(--font-body); font-weight: 650; font-size: 20px; margin-top: 8px; }
.lab-card p { color: var(--ink-2); margin-top: 6px; font-size: 15px; max-width: 70ch; }
@media (max-width: 640px) { .lab-card { grid-template-columns: 1fr; } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.acc { background: var(--accent-soft); color: var(--accent); }
.soon { margin-top: 22px; color: var(--ink-3); font-size: 14.5px; }
.soon ul { margin: 8px 0 0; padding-left: 18px; }

/* ---------- Lab page ---------- */
.crumbs { font-size: 14px; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.crumbs a { color: var(--ink-2); text-decoration: none; }
.crumbs a:hover { color: var(--accent); }
.lab-head { margin: 10px 0 18px; display: grid; gap: 10px; }
.lab-head h1 { font-family: var(--font-body); font-weight: 700; font-size: clamp(23px, 3.2vw, 32px); letter-spacing: -0.01em; max-width: 34ch; }
.lab-head .goal { color: var(--ink-2); max-width: 75ch; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 20px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button {
  border: 0; background: none; padding: 10px 14px 12px; font-size: 15px; font-weight: 600; color: var(--ink-2);
  cursor: pointer; border-bottom: 2.5px solid transparent; margin-bottom: -1px; white-space: nowrap;
}
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tabs button:hover { color: var(--ink); }

.next-step {
  display: flex; gap: 12px; align-items: center; padding: 11px 14px; border-radius: 12px;
  background: var(--accent-soft); color: var(--ink); margin-bottom: 16px; font-size: 15px;
}
.next-step .n { font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; color: var(--accent); white-space: nowrap; }
.next-step.done { background: color-mix(in srgb, var(--good) 14%, var(--surface)); }
.next-step.done .n { color: var(--good); }

.workspace { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1000px) { .workspace { grid-template-columns: minmax(0, 1fr) 340px; } }
.stage { overflow: hidden; display: flex; flex-direction: column; }
.main-col { display: grid; gap: 16px; align-content: start; min-width: 0; }
.canvas-box { position: relative; height: 500px; }
.canvas-box > canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
@media (max-width: 720px) { .canvas-box { height: 380px; } }
.stage-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.stage-bar .btn-row { gap: 6px; }
.sim-canvas { display: block; width: 100%; height: 460px; touch-action: none; }
@media (max-width: 720px) { .sim-canvas { height: 380px; } }
.stage-foot { padding: 9px 14px; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: space-between; }
.side { display: grid; gap: 16px; align-content: start; }
.side h3 { margin-bottom: 12px; font-size: 15px; }
.inline-label { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink-2); }
.inline-label select { width: auto; padding: 6px 8px; font-size: 14px; }

.lcd {
  font-family: var(--font-mono); font-variant-numeric: tabular-nums; background: var(--lcd-bg); color: var(--lcd-ink);
  border-radius: 10px; padding: 10px 12px; border: 1px solid var(--line); box-shadow: inset 0 1px 3px rgba(0,0,0,.08);
}
.lcd.big { font-size: 34px; font-weight: 600; text-align: right; letter-spacing: .02em; line-height: 1.1; }
.lcd-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.lcd-cell { display: grid; gap: 2px; }
.lcd-cell .lbl { font-family: var(--font-body); font-size: 12px; opacity: .75; }
.lcd-cell .val { font-size: 17px; font-weight: 600; }
.counter-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 14.5px; color: var(--ink-2); gap: 8px; }
.counter-row b { font-family: var(--font-mono); font-size: 18px; color: var(--ink); }
.record { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; align-items: end; }
.record label { display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); font-weight: 550; }
.record .btn { grid-column: 1 / -1; }
.msg { font-size: 13.5px; margin-top: 8px; min-height: 1.2em; }
.msg.ok { color: var(--good); }
.msg.err { color: var(--bad); }
.divider { height: 1px; background: var(--line); margin: 16px 0; }

.notebook { display: grid; gap: 16px; margin-top: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1000px) { .notebook { grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.25fr); } }
.full { grid-column: 1 / -1; }

.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; counter-reset: st; }
.steps li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; padding: 8px 6px; border-radius: 10px; font-size: 14.5px; color: var(--ink-2); counter-increment: st; }
.steps li::before {
  content: counter(st); width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line);
  display: grid; place-items: center; font-size: 12px; font-weight: 700; font-family: var(--font-mono); color: var(--ink-3); background: var(--surface);
}
.steps li.current { background: var(--accent-soft); color: var(--ink); }
.steps li.current::before { border-color: var(--accent); color: var(--accent); }
.steps li.done { color: var(--ink-3); }
.steps li.done::before { content: "✓"; background: var(--good); border-color: var(--good); color: #fff; }
.steps li.bonus::before { content: "★"; }
.steps li.bonus.done::before { content: "✓"; }
button.linkish { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }

.chart-canvas { width: 100%; height: 280px; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--ink-2); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }

.table-wrap { overflow-x: auto; margin-inline: -4px; }
table.data { width: 100%; border-collapse: collapse; font-size: 14.5px; font-variant-numeric: tabular-nums; min-width: 640px; }
table.data th { text-align: right; font-weight: 600; font-size: 12.5px; color: var(--ink-3); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.data td { text-align: right; padding: 9px 10px; border-bottom: 1px solid var(--line); font-family: var(--font-mono); font-size: 14px; white-space: nowrap; }
table.data th:first-child, table.data td:first-child, table.data th.txt { text-align: left; }
table.data td.empty { font-family: var(--font-body); text-align: center; white-space: normal; }
table.data td.txt { font-family: var(--font-body); text-align: left; }
table.data tr:last-child td { border-bottom: 0; }
table.data .del { border: 0; background: none; color: var(--ink-3); cursor: pointer; font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 6px; }
table.data .del:hover { color: var(--bad); background: var(--surface-2); }
.empty { padding: 26px 10px; text-align: center; color: var(--ink-3); font-size: 14.5px; }
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 10px; margin-top: 16px; }
.stat { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; }
.stat .lbl { font-size: 12.5px; color: var(--ink-2); font-weight: 550; }
.stat .val { font-family: var(--font-mono); font-size: 21px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat .sub { font-size: 12.5px; color: var(--ink-3); }
.stat.good .val { color: var(--good); }
.stat.warn .val { color: var(--warn); }
.stat.bad .val { color: var(--bad); }

/* ---------- Theory ---------- */
.prose { max-width: 78ch; display: grid; gap: 16px; font-size: 16.5px; }
.prose h2 { font-size: 20px; margin-top: 18px; }
.prose ul, .prose ol { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.prose .note { background: var(--surface-2); border-radius: 12px; padding: 14px 16px; font-size: 15px; color: var(--ink-2); }
.prose .warnbox { background: color-mix(in srgb, var(--warn) 13%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); border-radius: 12px; padding: 14px 16px; font-size: 15px; }
.theory-grid { display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1000px) { .theory-grid { grid-template-columns: minmax(0, 1fr) 360px; } }
.formulas { display: grid; gap: 10px; align-content: start; }
.formula {
  font-family: "Cambria Math", "STIX Two Math", "Times New Roman", serif; font-size: 22px; padding: 14px 16px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; display: flex; align-items: center; gap: 14px; justify-content: space-between; flex-wrap: wrap;
}
.formula .cap { font-family: var(--font-body); font-size: 13px; color: var(--ink-2); max-width: 22ch; }
.frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 3px; font-size: .92em; }
.frac > span:first-child { padding: 0 3px 1px; border-bottom: 1.5px solid currentColor; }
.frac > span:last-child { padding: 1px 3px 0; }
.sqrt { white-space: nowrap; }
.sqrt .rad { border-top: 1.5px solid currentColor; padding: 0 2px; display: inline-flex; align-items: center; }
.eq { font-family: var(--font-mono); font-size: 15px; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; overflow-x: auto; white-space: nowrap; }
.kv-table { width: 100%; border-collapse: collapse; font-size: 15px; }
.kv-table th, .kv-table td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.kv-table th { font-size: 13px; color: var(--ink-3); font-weight: 600; }
.kv-table td.num { font-family: var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- Quiz ---------- */
.quiz { display: grid; gap: 14px; max-width: 820px; }
.q { padding: 18px 20px; }
.q h3 { font-size: 16.5px; font-weight: 600; line-height: 1.45; }
.q .opts { display: grid; gap: 8px; margin-top: 12px; }
.q .opt {
  text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 14px; cursor: pointer; font-size: 15px;
  display: flex; gap: 10px; align-items: baseline;
}
.q .opt .l { font-family: var(--font-mono); font-size: 13px; color: var(--ink-3); font-weight: 600; }
.q .opt:hover:not(:disabled) { border-color: var(--accent); }
.q .opt:disabled { cursor: default; }
.q .opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--surface)); }
.q .opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--surface)); }
.q .why { margin-top: 10px; font-size: 14.5px; color: var(--ink-2); }
.q .why b.ok { color: var(--good); }
.q .why b.no { color: var(--bad); }
.quiz-score { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.quiz-score .val { font-family: var(--font-display); font-size: 26px; font-weight: 600; }

/* ---------- Teacher ---------- */
.plan { width: 100%; border-collapse: collapse; font-size: 15px; min-width: 620px; }
.plan th, .plan td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.plan th { font-size: 12.5px; color: var(--ink-3); font-weight: 600; }
.plan td:first-child { font-family: var(--font-mono); white-space: nowrap; color: var(--accent); font-weight: 600; font-size: 14px; }
.two-col { display: grid; gap: 22px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }

/* ---------- Chem specific ---------- */
.eq-panel { display: grid; gap: 8px; }
.eq-row { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; align-items: center; font-size: 14px; }
.eq-row .who { font-weight: 600; font-size: 13.5px; }
.eq-row .who.k { color: var(--phys); }
.eq-row .who.a { color: var(--bad); }
.predict { display: grid; gap: 10px; }
.predict label { display: grid; gap: 4px; font-size: 13.5px; font-weight: 550; color: var(--ink-2); }
.warn-chip { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 600; color: var(--warn); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.toggle {
  position: relative; width: 58px; height: 32px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; flex: none;
}
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--ink-3); transition: left .15s, background .15s; }
.toggle[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.toggle[aria-pressed="true"]::after { left: 29px; background: var(--accent); }
.micro-canvas { width: 100%; height: 210px; display: block; }

footer.site { border-top: 1px solid var(--line); padding-block: 22px 32px; color: var(--ink-3); font-size: 13.5px; }
footer.site .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 20px; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}

.log { list-style: none; margin: 0; padding: 0; display: grid; max-height: 320px; overflow-y: auto; }
.log li { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; padding: 8px 2px; border-bottom: 1px solid var(--line); font-size: 14.5px; color: var(--ink-2); }
.log li:first-child { color: var(--ink); }
.log li:last-child { border-bottom: 0; }
.log .mono { color: var(--accent); font-size: 13px; padding-top: 2px; }
.btn[aria-pressed="true"] { background: var(--bad); }

/* ---------- Allomalar bo'limi ---------- */
.btn-hist { --accent: var(--hist); }
.al-band {
  margin-top: 40px; border-radius: 22px; padding: 28px 22px; color: var(--lapis-ink);
  background-color: var(--lapis);
  background-image:
    radial-gradient(circle at 18px 18px, color-mix(in srgb, var(--gold) 22%, transparent) 1.4px, transparent 1.6px),
    linear-gradient(45deg, transparent 47%, color-mix(in srgb, var(--gold) 9%, transparent) 48% 52%, transparent 53%),
    linear-gradient(-45deg, transparent 47%, color-mix(in srgb, var(--gold) 9%, transparent) 48% 52%, transparent 53%);
  background-size: 36px 36px, 36px 36px, 36px 36px;
}
@media (min-width: 720px) { .al-band { padding: 40px 36px; } }
.al-band-page { margin-top: 0; }
.al-head { max-width: 70ch; display: grid; gap: 10px; margin-bottom: 26px; }
.al-eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; color: var(--gold); }
.al-head h2 { font-size: clamp(26px, 4vw, 40px); color: #fff8e6; }
.al-head p { font-size: 16.5px; color: color-mix(in srgb, var(--lapis-ink) 88%, transparent); }
.al-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); }
.al-card {
  display: grid; grid-template-rows: auto 1fr; text-decoration: none; color: var(--lapis-ink); border-radius: 16px; overflow: hidden;
  border: 1px solid color-mix(in srgb, var(--gold) 40%, transparent); background: color-mix(in srgb, #000 22%, var(--lapis));
  transition: transform .15s, border-color .15s;
}
a.al-card:hover { transform: translateY(-2px); border-color: var(--gold); }
.al-mini { display: block; width: 100%; height: 150px; border-bottom: 1px solid color-mix(in srgb, var(--gold) 25%, transparent); }
.al-soon-art { color: color-mix(in srgb, var(--gold) 70%, transparent); padding: 14px 20px; }
.al-body { padding: 16px 18px 18px; display: grid; gap: 8px; align-content: start; }
.al-who { font-size: 12.5px; font-weight: 700; color: var(--gold); letter-spacing: .02em; }
.al-who span { font-weight: 500; opacity: .8; margin-left: 4px; }
.al-card h3 { font-size: 17px; color: #fff8e6; line-height: 1.3; }
.al-card p { font-size: 14px; color: color-mix(in srgb, var(--lapis-ink) 80%, transparent); }
.al-go { margin-top: 4px; font-weight: 650; font-size: 14.5px; color: var(--gold); }
.al-soon { opacity: .72; }
.al-soon .al-go { color: color-mix(in srgb, var(--lapis-ink) 70%, transparent); font-weight: 550; }
.subject-card .lab-title + .lab-title { margin-top: -2px; }
.subjects { margin-top: 40px; }

/* ---------- Beruniy usuli (beruniy-radius) ---------- */
.br-phase { display: inline-flex; gap: 2px; background: var(--surface-2); border-radius: 10px; padding: 3px; }
.br-phase span { padding: 5px 10px; border-radius: 8px; font-size: 13.5px; font-weight: 600; color: var(--ink-3); white-space: nowrap; }
.br-phase span[aria-current="step"] { background: var(--surface); color: var(--hist); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
.br-phase span.done { color: var(--good); }
.br-aimhead { margin-bottom: 6px; }
.br-scope { position: relative; margin: 12px 0 2px; display: grid; gap: 4px; justify-items: center; }
.br-scope canvas { display: block; width: 100%; height: 236px; touch-action: none; }
.br-scope-cap { font-size: 12px; color: var(--ink-3); text-align: center; }
.br-scope-note { font-size: 12px; line-height: 1.4; color: var(--ink-3); text-align: center; max-width: 34ch; }
.br-fine { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
.br-fine button { justify-content: center; font-family: var(--font-mono); font-size: 13.5px; padding: 7px 0; }
.br-rec { width: 100%; margin-top: 12px; }
.br-calc { display: grid; gap: 16px; }
.br-calc .blk { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; align-items: start; }
.br-calc .blk > div { display: grid; gap: 6px; min-width: 0; }
.br-calc .num {
  width: 26px; height: 26px; border-radius: 50%; background: var(--hist-soft); color: var(--hist);
  font: 600 13px var(--font-mono); display: grid; place-items: center;
}
.br-calc h4 { font-size: 14.5px; font-weight: 650; margin: 2px 0 0; }
.br-calc .eq b { color: var(--hist); }
.br-good { color: var(--good); }
.br-warn { color: var(--warn); }
.br-bad { color: var(--bad); }
.br-warnline { color: var(--ink-2); border-left: 3px solid var(--phys); padding-left: 10px; }
.br-fig { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 12px 10px; }
.br-fig svg { display: block; width: 100%; height: auto; max-width: 560px; margin-inline: auto; }
.br-fig figcaption { font-size: 13.5px; color: var(--ink-2); margin-top: 6px; text-align: center; }
@media (max-width: 620px) { .br-calc .eq { white-space: normal; overflow-wrap: break-word; } }
/* umumiy .why (bosh sahifa) qoidasi test izohini ikki ustunga bo‘lib yubormasligi uchun */
.br-lab .q .why { display: block; }

/* ---------- Beruniy idishi (zichlik) — modulga xos uslublar ---------- */
.bz-paper {
  background-color: color-mix(in srgb, var(--hist-soft) 42%, var(--surface));
  background-image:
    linear-gradient(color-mix(in srgb, var(--hist) 7%, transparent) 1px, transparent 1px),
    linear-gradient(90deg, color-mix(in srgb, var(--hist) 7%, transparent) 1px, transparent 1px);
  background-size: 24px 24px;
}
.bz-chart-box { position: relative; }
.bz-chart { height: 340px; }
@media (max-width: 720px) { .bz-chart { height: 360px; } }
.bz-tip {
  position: absolute; pointer-events: none; z-index: 2; background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 9px; font-size: 13px; line-height: 1.35; box-shadow: var(--shadow); white-space: nowrap; color: var(--ink);
}
.bz-tip b { font-weight: 650; }
.bz-tip .mono { color: var(--ink-2); }
.legend i.bz-ring { background: transparent; border: 2px solid var(--bad); width: 10px; height: 10px; box-sizing: border-box; }
.legend i.bz-tick { width: 3px; height: 12px; border-radius: 1px; background: var(--ink-2); vertical-align: -2px; }

.bz-sample { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 12px; align-items: center; }
.bz-swatch { width: 46px; height: 46px; border-radius: 12px; border: 1px solid var(--line); box-shadow: inset 0 1px 2px rgba(255, 255, 255, .35); }
.bz-sample b { font-size: 15.5px; }
.bz-sample p { margin-top: 2px; }
.bz-ref { margin-top: 12px; display: flex; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--ink-2); padding: 8px 12px; border-radius: 10px; background: var(--surface-2); }
.bz-ref b { font-family: var(--font-mono); color: var(--ink); font-weight: 600; white-space: nowrap; }

.bz-reads { margin: 12px 0 0; display: grid; }
.bz-reads > div { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 7px 2px; border-bottom: 1px solid var(--line); font-size: 14px; }
.bz-reads > div:last-child { border-bottom: 0; }
.bz-reads dt { color: var(--ink-2); }
.bz-reads dd { margin: 0; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.bz-reads .calc dt { color: var(--ink-3); }
.bz-reads .calc dd { color: var(--ink-2); font-weight: 500; }
.bz-reads .res dt { color: var(--ink); font-weight: 600; }
.bz-reads .res dd { color: var(--accent); font-size: 15.5px; }

.bz-crown { border-color: color-mix(in srgb, var(--hist) 38%, var(--line)); background: linear-gradient(180deg, color-mix(in srgb, var(--hist-soft) 55%, var(--surface)), var(--surface) 140px); }
.bz-fx { font-family: "Cambria Math", "STIX Two Math", "Times New Roman", serif; font-size: 19px; margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.bz-answer { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; margin-top: 12px; }
.bz-answer label { display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); font-weight: 550; }
.bz-warn { color: var(--bad); }
.bz-ok { color: var(--good); }
table.data.bz-table { min-width: 940px; }

/* Nazariya: idish sxemasi */
.bz-fig { margin: 0; display: grid; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; }
.bz-fig svg { width: 100%; height: auto; display: block; max-width: 560px; margin-inline: auto; }
.bz-fig .tbl { stroke: var(--line); stroke-width: 2; }
.bz-fig .brass { fill: var(--gold); stroke: var(--hist); stroke-width: 1.2; stroke-linejoin: round; }
.bz-fig .brass-d { fill: color-mix(in srgb, var(--gold) 62%, var(--ink-2)); }
.bz-fig .cav { fill: color-mix(in srgb, var(--gold) 15%, var(--surface)); }
.bz-fig .water { fill: color-mix(in srgb, color-mix(in srgb, var(--phys) 60%, var(--chem)) 30%, transparent); }
.bz-fig .wline { stroke: color-mix(in srgb, var(--phys) 60%, var(--chem)); stroke-width: 1.4; fill: none; }
.bz-fig .spout { stroke: var(--gold); stroke-width: 7; stroke-linecap: round; fill: none; }
.bz-fig .spout-in { stroke: color-mix(in srgb, color-mix(in srgb, var(--phys) 60%, var(--chem)) 70%, transparent); stroke-width: 2.4; stroke-linecap: round; fill: none; }
.bz-fig .stream { stroke: color-mix(in srgb, color-mix(in srgb, var(--phys) 60%, var(--chem)) 70%, transparent); stroke-width: 3; fill: none; stroke-linecap: round; }
.bz-fig .glass { fill: color-mix(in srgb, var(--glass) 30%, transparent); stroke: var(--ink-3); stroke-width: 1.4; stroke-linejoin: round; }
.bz-fig .spec { fill: var(--metal); stroke: var(--ink-2); stroke-width: 1; }
.bz-fig .lvl { stroke: var(--hist); stroke-dasharray: 5 4; stroke-width: 1.4; fill: none; }
.bz-fig .arrow { stroke: var(--hist); stroke-width: 2; fill: none; stroke-linecap: round; }
.bz-fig .arrowhead { fill: var(--hist); }
.bz-fig .lead { stroke: var(--ink-3); stroke-width: 1; }
.bz-fig .mk circle { fill: var(--surface); stroke: var(--hist); stroke-width: 1.6; }
.bz-fig .mk text { fill: var(--hist); font: 700 12px var(--font-mono); text-anchor: middle; dominant-baseline: central; }
.bz-fig ol { margin: 0; padding-left: 22px; columns: 2 230px; column-gap: 28px; font-size: 14.5px; color: var(--ink-2); display: block; }
.bz-fig ol li { margin-bottom: 4px; break-inside: avoid; }
.bz-fig figcaption { font-size: 13px; color: var(--ink-3); }
.bz-answer input { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.bz-part { color: var(--warn); }
.bz-empty { position: sticky; left: 0; width: min(100%, calc(100vw - 92px)); margin: 0; text-align: center; }
/* styles.css dagi bosh sahifa .why (grid) qoidasi test izohiga tegmasligi uchun */
.bz-lab .q .why { display: block; }

/* ---------- Kislota-asos titrlash (titrlash.js) ---------- */
.tt-lab [hidden] { display: none !important; }
.tt-foot { display: block; padding: 12px; }
.tt-lcd { grid-template-columns: repeat(auto-fit, minmax(116px, 1fr)); }
.tt-lcd .val { font-size: 16px; }
.tt-lcd .tt-colval { font-family: var(--font-body); font-size: 14.5px; display: flex; align-items: center; gap: 6px; line-height: 1.25; }
.tt-colval i, .tt-sw {
  display: inline-block; width: 13px; height: 13px; border-radius: 50%; flex: none;
  border: 1px solid var(--line); background-color: var(--surface);
}
.tt-sw { vertical-align: -2px; margin-right: 6px; }
.tt-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
.tt-actions .btn { flex: 1 1 250px; }
.tt-actions .btn-ghost { flex: 0 1 auto; }
.tt-obs { margin-top: 4px; font-size: 13.5px; color: var(--ink-2); min-height: 1.3em; }
.tt-obs b { color: var(--ink); font-weight: 600; }
.tt-foot .msg:empty { display: none; }

.tt-inds { display: grid; gap: 6px; }
.tt-inds button {
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; text-align: left;
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; cursor: pointer;
  font-size: 14.5px; font-weight: 550; color: var(--ink);
}
.tt-inds button:hover { border-color: var(--ink-3); }
.tt-inds button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.tt-inds .rg { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); font-weight: 500; white-space: nowrap; }
.tt-inds .pill { display: inline-flex; border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.tt-inds .pill i { width: 14px; height: 14px; background-color: var(--surface); }

.tt-ramp { position: relative; height: 24px; border-radius: 8px; border: 1px solid var(--line); margin-top: 16px; background-color: var(--surface); }
.tt-ramp .band { position: absolute; top: -4px; bottom: -4px; border-left: 1.5px dashed var(--ink-2); border-right: 1.5px dashed var(--ink-2); }
.tt-ramp .mk { position: absolute; top: -7px; bottom: -7px; width: 3px; margin-left: -1.5px; background: var(--ink); border-radius: 2px; box-shadow: 0 0 0 2px var(--surface); }
.tt-ticks { position: relative; height: 18px; margin-top: 5px; font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); }
.tt-ticks span { position: absolute; top: 0; transform: translateX(-50%); }

<script>
'use strict';
/* ============ Yordamchi funksiyalar ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const TAU = Math.PI * 2;
const REDUCED = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;

function fmt(x, d = 2) {
  if (x === null || x === undefined || !Number.isFinite(x)) return '—';
  let s = x.toFixed(d);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('.', ',').replace('-', '−');
}
function fmtGroup(x, d = 0) {
  if (!Number.isFinite(x)) return '—';
  const [i, f] = Math.abs(x).toFixed(d).split('.');
  const g = i.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (x < 0 ? '−' : '') + g + (f ? ',' + f : '');
}
function parseNum(v) {
  if (typeof v === 'number') return v;
  const n = parseFloat(String(v).replace(',', '.').replace('−', '-'));
  return Number.isFinite(n) ? n : NaN;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

const store = {
  get(k, def) { try { const v = localStorage.getItem(k); return v === null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* saqlab bo'lmadi */ } }
};

/* ============ Ranglar (canvas uchun CSS tokenlardan) ============ */
const Palette = {
  c: {},
  refresh() {
    const cs = getComputedStyle(document.documentElement);
    ['bg', 'surface', 'surface-2', 'line', 'ink', 'ink-2', 'ink-3', 'phys', 'phys-soft', 'chem', 'chem-soft', 'good', 'warn', 'bad', 'grid',
      'lcd-bg', 'lcd-ink', 'copper', 'metal', 'glass', 'hist', 'hist-soft', 'gold', 'lapis', 'lapis-ink'].forEach(k => { this.c[k] = cs.getPropertyValue('--' + k).trim(); });
    this.dark = Theme.effective() === 'dark';
    this.c.dark = this.dark;
  }
};

/* ============ Kunduzgi / tungi rejim ============ */
const Theme = {
  mq: typeof matchMedia === 'function' ? matchMedia('(prefers-color-scheme: dark)') : null,
  effective() {
    const a = document.documentElement.getAttribute('data-theme');
    if (a === 'dark' || a === 'light') return a;
    return this.mq && this.mq.matches ? 'dark' : 'light';
  },
  init() {
    const s = store.get('el-theme', null);
    if (s === 'dark' || s === 'light') document.documentElement.setAttribute('data-theme', s);
    if (this.mq) {
      const fn = () => this.changed();
      if (this.mq.addEventListener) this.mq.addEventListener('change', fn); else if (this.mq.addListener) this.mq.addListener(fn);
    }
    $('#themeBtn').addEventListener('click', () => this.toggle());
    this.changed();
  },
  toggle() {
    const n = this.effective() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', n);
    store.set('el-theme', n);
    this.changed();
  },
  changed() {
    const d = this.effective() === 'dark';
    const b = $('#themeBtn');
    b.dataset.mode = d ? 'dark' : 'light';
    b.setAttribute('aria-label', d ? 'Kunduzgi rejimga o‘tish' : 'Tungi rejimga o‘tish');
    $('.tlabel', b).textContent = d ? 'Kunduzgi' : 'Tungi';
    Palette.refresh();
    window.dispatchEvent(new Event('el-theme'));
  }
};

/* ============ Canvas ============ */
function setupCanvas(canvas, draw) {
  const ctx = canvas.getContext('2d');
  const o = { ctx, w: 0, h: 0, canvas };
  o.resize = (doDraw = true) => {
    const r = canvas.getBoundingClientRect();
    if (r.width < 2 || r.height < 2) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    o.w = r.width; o.h = r.height;
    canvas.width = Math.round(o.w * dpr); canvas.height = Math.round(o.h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (draw && doDraw) draw();
  };
  let ro = null;
  if (typeof ResizeObserver === 'function') { ro = new ResizeObserver(() => o.resize()); ro.observe(canvas); }
  else window.addEventListener('resize', () => o.resize());
  o.resize(false); // birinchi chizish ResizeObserver orqali (o'zgaruvchilar tayyor bo'lgach)
  o.destroy = () => { if (ro) ro.disconnect(); };
  return o;
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function niceStep(range, target) {
  const raw = range / Math.max(1, target);
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const m = raw / p;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p;
}
function decimalsFor(step) { let d = 0; while (d < 6 && Math.abs(Math.round(step * 10 ** d) - step * 10 ** d) > 1e-6) d++; return d; }

/* Nuqtali grafik + koordinata boshidan o'tuvchi to'g'ri chiziq.
   opt: {xLabel, yLabel, points:[{x,y}], fitK, refK, xMax, yMax, empty, color, fitLabel} */
function drawPlot(cv, opt) {
  const { ctx, w, h } = cv; const P = Palette.c;
  if (!w || !h) return;
  ctx.clearRect(0, 0, w, h);
  const m = { l: 58, r: 18, t: 18, b: 46 };
  const pw = w - m.l - m.r, ph = h - m.t - m.b;
  const pts = opt.points || [];
  let xMax = opt.xMax || Math.max(0, ...pts.map(p => p.x)) * 1.15 || 1;
  let yMax = opt.yMax || Math.max(0, ...pts.map(p => p.y)) * 1.15 || 1;
  const xs = niceStep(xMax, 5), ys = niceStep(yMax, 5);
  xMax = Math.ceil(xMax / xs) * xs; yMax = Math.ceil(yMax / ys) * ys;
  const X = v => m.l + v / xMax * pw, Y = v => m.t + ph - v / yMax * ph;
  ctx.font = '12px ' + getComputedStyle(document.body).fontFamily;
  ctx.lineWidth = 1;
  // to'r
  ctx.strokeStyle = P.line; ctx.fillStyle = P['ink-3'];
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const xd = decimalsFor(xs), yd = decimalsFor(ys);
  for (let v = 0; v <= xMax + 1e-9; v += xs) {
    ctx.globalAlpha = v === 0 ? 1 : 0.55; ctx.beginPath(); ctx.moveTo(X(v), m.t); ctx.lineTo(X(v), m.t + ph); ctx.stroke(); ctx.globalAlpha = 1;
    ctx.fillText(fmt(v, xd), X(v), m.t + ph + 6);
  }
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let v = 0; v <= yMax + 1e-9; v += ys) {
    ctx.globalAlpha = v === 0 ? 1 : 0.55; ctx.beginPath(); ctx.moveTo(m.l, Y(v)); ctx.lineTo(m.l + pw, Y(v)); ctx.stroke(); ctx.globalAlpha = 1;
    ctx.fillText(fmt(v, yd), m.l - 8, Y(v));
  }
  // o'q nomlari
  ctx.fillStyle = P['ink-2']; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
  ctx.fillText(opt.xLabel, m.l + pw, h - 4);
  ctx.save(); ctx.translate(14, m.t); ctx.rotate(-Math.PI / 2); ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.fillText(opt.yLabel, 0, 0); ctx.restore();
  const col = opt.color || P.phys;
  // nazariy chiziq
  if (opt.refK) {
    ctx.save(); ctx.setLineDash([5, 5]); ctx.strokeStyle = P['ink-3']; ctx.lineWidth = 1.3;
    const xe = Math.min(xMax, yMax / opt.refK);
    ctx.beginPath(); ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(xe), Y(opt.refK * xe)); ctx.stroke(); ctx.restore();
  }
  // tajriba chizig'i
  if (opt.fitK) {
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    const xe = Math.min(xMax, yMax / opt.fitK);
    ctx.beginPath(); ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(xe), Y(opt.fitK * xe)); ctx.stroke();
    if (opt.fitLabel) {
      ctx.font = '600 13px ' + getComputedStyle(document.body).fontFamily;
      ctx.fillStyle = col; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText(opt.fitLabel, m.l + 10, m.t + 6);
    }
  }
  // nuqtalar
  for (const p of pts) {
    ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), 5, 0, TAU);
    ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = P.surface; ctx.stroke();
  }
  if (!pts.length && opt.empty) {
    ctx.fillStyle = P['ink-3']; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '14px ' + getComputedStyle(document.body).fontFamily;
    const lines = opt.empty.split('\n');
    lines.forEach((ln, i) => ctx.fillText(ln, m.l + pw / 2, m.t + ph / 2 + (i - (lines.length - 1) / 2) * 20));
  }
}

/* ============ Komponentlar ============ */
function initTabs(root, onChange) {
  const tabs = $$('[role="tab"]', root);
  const show = id => {
    tabs.forEach(t => { const on = t.dataset.tab === id; t.setAttribute('aria-selected', on ? 'true' : 'false'); t.tabIndex = on ? 0 : -1; });
    $$('[role="tabpanel"]', root).forEach(p => { p.hidden = p.dataset.panel !== id; });
    if (onChange) onChange(id);
  };
  tabs.forEach((t, i) => {
    t.addEventListener('click', () => show(t.dataset.tab));
    t.addEventListener('keydown', e => {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      const n = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
      n.focus(); show(n.dataset.tab);
    });
  });
  return show;
}

/* Bosqichlar ro'yxati — avtomatik belgilanadi */
function makeStepper(listEl, bannerEl, steps) {
  const done = new Set();
  const render = () => {
    const firstOpen = steps.find(s => !s.bonus && !done.has(s.id)) || steps.find(s => !done.has(s.id));
    listEl.innerHTML = steps.map(s => {
      const cls = [done.has(s.id) ? 'done' : '', firstOpen && firstOpen.id === s.id ? 'current' : '', s.bonus ? 'bonus' : ''].join(' ');
      return `<li class="${cls}" data-step="${s.id}"><span>${s.html}</span></li>`;
    }).join('');
    const main = steps.filter(s => !s.bonus);
    const n = main.filter(s => done.has(s.id)).length;
    if (firstOpen) {
      const idx = steps.indexOf(firstOpen) + 1;
      bannerEl.classList.remove('done');
      bannerEl.innerHTML = `<span class="n">${firstOpen.bonus ? 'Qo‘shimcha' : 'Qadam ' + idx + '/' + main.length}</span><span>${firstOpen.html}</span>`;
    } else {
      bannerEl.classList.add('done');
      bannerEl.innerHTML = `<span class="n">${n}/${main.length} ✓</span><span>Barcha bosqichlar bajarildi. Natijalarni pastdagi jadvaldan ko‘ring va testni ishlang.</span>`;
    }
  };
  render();
  return {
    mark(id) { if (!done.has(id)) { done.add(id); render(); } },
    has(id) { return done.has(id); },
    render
  };
}

/* Test */
function renderQuiz(el, questions) {
  const L = ['A', 'B', 'C', 'D', 'E'];
  const state = questions.map(() => null);
  const draw = () => {
    const answered = state.filter(v => v !== null).length;
    const right = state.filter((v, i) => v === questions[i].a).length;
    el.innerHTML = `<div class="quiz"><h2>Nazorat savollari</h2>
      ${questions.map((q, i) => `<div class="card q" data-q="${i}">
        <h3>${i + 1}. ${q.q}</h3>
        <div class="opts">${q.o.map((o, j) => {
          let cls = '';
          if (state[i] !== null) { if (j === q.a) cls = 'right'; else if (j === state[i]) cls = 'wrong'; }
          return `<button class="opt ${cls}" data-j="${j}" ${state[i] !== null ? 'disabled' : ''}><span class="l">${L[j]}</span><span>${o}</span></button>`;
        }).join('')}</div>
        ${state[i] !== null ? `<p class="why">${state[i] === q.a ? '<b class="ok">To‘g‘ri.</b> ' : '<b class="no">Noto‘g‘ri.</b> '}${q.why}</p>` : ''}
      </div>`).join('')}
      <div class="card pad quiz-score">
        <span class="val">${right} / ${questions.length}</span>
        <span class="muted">${answered < questions.length ? `Javob berilgan: ${answered} ta savol` : right === questions.length ? 'A’lo! Hammasi to‘g‘ri.' : 'Xato javoblar izohini o‘qing va qayta urinib ko‘ring.'}</span>
        <button class="btn-ghost btn-sm" data-reset style="margin-left:auto">Qaytadan boshlash</button>
      </div>
    </div>`;
  };
  el.addEventListener('click', e => {
    const b = e.target.closest('.opt');
    if (b) { const i = +b.closest('[data-q]').dataset.q; if (state[i] === null) { state[i] = +b.dataset.j; draw(); } return; }
    if (e.target.closest('[data-reset]')) { state.fill(null); draw(); }
  });
  draw();
}

/* Ikki bosqichli tasdiqlash tugmasi (confirm() ishlamaydi) */
function confirmButton(btn, label, confirmLabel, action) {
  let armed = false, timer = 0;
  btn.addEventListener('click', () => {
    if (!armed) { armed = true; btn.textContent = confirmLabel; btn.classList.add('btn-danger'); timer = setTimeout(() => { armed = false; btn.textContent = label; btn.classList.remove('btn-danger'); }, 3000); return; }
    clearTimeout(timer); armed = false; btn.textContent = label; btn.classList.remove('btn-danger'); action();
  });
}

/* ============ Laboratoriya sahifasi karkasi ============ */
function labShell(app, meta) {
  app.innerHTML = `<article class="lab" data-subject="${meta.subject}">
    <nav class="crumbs" aria-label="Yo‘l"><a href="#${meta.subjectId}">${meta.subjectName}</a><span>/</span><span>${meta.grade}</span><span>/</span><span>Laboratoriya ishi</span></nav>
    <header class="lab-head">
      <div class="chips">${meta.chips.map((c, i) => `<span class="chip ${i === 0 ? 'acc' : ''}">${c}</span>`).join('')}</div>
      <h1>${meta.title}</h1>
      <p class="goal"><b>Maqsad:</b> ${meta.goal}</p>
    </header>
    <div class="tabs" role="tablist" aria-label="Laboratoriya bo‘limlari">

/* ============ Tovushlar (WebAudio, fayl kerak emas) ============
   Sound.play(name, {vol, pitch})  — qisqa tovush: click, tick, beep, chime, drop, bubble, pop, pour, whoosh, error, clack, spark
   Sound.tone(id, {freq, type, gain}) — uzluksiz tovush (masalan, tok manbai g'uvillashi); qayta chaqirilsa yangilanadi
   Sound.stop(id) / Sound.stopAll()                                                                                    */
const Sound = {
  enabled: true, ctx: null, master: null, tones: {}, noiseBuf: null,
  init() {
    this.enabled = store.get('el-sound', true) !== false;
    const b = document.getElementById('soundBtn');
    if (b) { b.addEventListener('click', () => this.toggle()); this.sync(); }
    const unlock = () => { this.ensure(); };
    window.addEventListener('pointerdown', unlock, { once: true });
    window.addEventListener('keydown', unlock, { once: true });
  },
  sync() {
    const b = document.getElementById('soundBtn'); if (!b) return;
    b.dataset.on = this.enabled ? 'true' : 'false';
    b.setAttribute('aria-pressed', this.enabled ? 'true' : 'false');
    b.setAttribute('aria-label', this.enabled ? 'Tovushni o‘chirish' : 'Tovushni yoqish');
  },
  toggle() {
    this.enabled = !this.enabled; store.set('el-sound', this.enabled); this.sync();
    if (!this.enabled) this.stopAll(); else { this.ensure(); this.play('click'); }
  },
  ensure() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
        this.ctx = new AC();
        this.master = this.ctx.createGain(); this.master.gain.value = 0.55; this.master.connect(this.ctx.destination);
        const n = this.ctx.sampleRate; const buf = this.ctx.createBuffer(1, n, n); const d = buf.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
        this.noiseBuf = buf;
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return this.ctx;
    } catch (e) { return null; }
  },
  env(g, t, a, peak, d) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); },
  osc(type, f0, f1, dur, peak, delay = 0) {
    const c = this.ctx, t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    this.env(g, t, 0.004, peak, dur); o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.05);
  },
  noise(dur, peak, filterType, f0, f1, q = 1, delay = 0) {
    const c = this.ctx, t = c.currentTime + delay, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noiseBuf; s.loop = true; f.type = filterType; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t); if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + Math.min(0.08, dur / 3)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  },
  play(name, o = {}) {
    if (!this.enabled || !this.ensure()) return;
    const v = o.vol === undefined ? 1 : o.vol, p = o.pitch || 1;
    try {
      switch (name) {
        case 'click': this.noise(0.03, 0.18 * v, 'highpass', 2500, 2500, 0.7); break;
        case 'tick': this.osc('triangle', 1800 * p, 900 * p, 0.035, 0.12 * v); this.noise(0.02, 0.06 * v, 'bandpass', 3000, 3000, 2); break;
        case 'clack': this.noise(0.05, 0.25 * v, 'bandpass', 1200 * p, 700 * p, 3); break;
        case 'beep': this.osc('sine', 1320 * p, 1320 * p, 0.09, 0.14 * v); break;
        case 'chime': this.osc('sine', 880 * p, 880 * p, 0.35, 0.12 * v); this.osc('sine', 1318.5 * p, 1318.5 * p, 0.5, 0.1 * v, 0.11); break;
        case 'error': this.osc('square', 220, 180, 0.16, 0.05 * v); break;
        case 'drop': this.osc('sine', 1400 * p, 380 * p, 0.09, 0.16 * v); break;
        case 'bubble': this.osc('sine', 260 * p, 900 * p, 0.05, 0.05 * v); break;
        case 'pop': this.osc('sine', 500 * p, 1500 * p, 0.03, 0.07 * v); break;
        case 'pour': this.noise(o.dur || 0.9, 0.12 * v, 'bandpass', 900, 600, 1.4); break;
        case 'whoosh': this.noise(o.dur || 0.5, 0.14 * v, 'bandpass', 400, 1600, 0.8); break;
        case 'spark': this.noise(0.08, 0.2 * v, 'highpass', 4000, 4000, 1); break;
      }
    } catch (e) { /* tovushsiz davom etamiz */ }
  },
  tone(id, o = {}) {
    if (!this.enabled || !this.ensure()) { this.stop(id); return; }
    const c = this.ctx, t = c.currentTime;
    let s = this.tones[id];
    if (!s) {
      const osc = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
      osc.type = o.type || 'sawtooth'; f.type = 'lowpass'; f.frequency.value = o.lowpass || 600; g.gain.value = 0.0001;
      osc.connect(f); f.connect(g); g.connect(this.master); osc.start();
      s = this.tones[id] = { osc, f, g };
    }
    s.osc.frequency.setTargetAtTime(o.freq || 100, t, 0.05);
    s.g.gain.setTargetAtTime(Math.max(0.0001, o.gain === undefined ? 0.03 : o.gain), t, 0.08);
  },
  stop(id) {
    const s = this.tones[id]; if (!s) return;
    try { const t = this.ctx.currentTime; s.g.gain.setTargetAtTime(0.0001, t, 0.05); s.osc.stop(t + 0.3); } catch (e) { /* */ }
    delete this.tones[id];
  },
  stopAll() { Object.keys(this.tones).forEach(k => this.stop(k)); }
};

    C = Object.assign({}, Palette.c);
    ['hist', 'hist-soft', 'gold', 'lapis', 'lapis-ink', 'bg', 'surface', 'ink', 'ink-2', 'ink-3', 'line', 'metal', 'copper', 'phys', 'chem', 'good', 'warn', 'bad', 'surface-2']
      .forEach(k => { if (!C[k]) C[k] = css(k); });
    C.dark = !!Palette.dark;
  }
  function scenePal() {
    const dk = C.dark, surf = C.surface, ink = C.ink, bg = C.bg, night = dk ? bg : ink;
    let p;
    if (S.planet === 'yer') {
      p = dk ? { skyTop: mix(C.lapis, bg, 0.3), skyBot: mix(C.lapis, C.hist, 0.3), ground: mix(C['hist-soft'], C.hist, 0.14), hill: mix(C['hist-soft'], C.hist, 0.32), edge: mix(C.hist, surf, 0.3), stars: true, crescent: true }
        : { skyTop: mix(mix(C.lapis, C.phys, 0.45), surf, 0.66), skyBot: mix(C['hist-soft'], surf, 0.25), ground: mix(C.hist, surf, 0.74), hill: mix(C.hist, surf, 0.52), edge: mix(C.hist, ink, 0.22), sun: true };
    } else if (S.planet === 'oy') {
      p = { skyTop: mix(night, C.lapis, 0.12), skyBot: mix(night, C.lapis, 0.32), ground: mix(C.metal, surf, dk ? 0.55 : 0.5), hill: mix(C.metal, surf, dk ? 0.35 : 0.3), edge: dk ? mix(C.metal, ink, 0.25) : mix(C.metal, ink, 0.4), stars: true, earth: true };
    } else {
      p = dk ? { skyTop: mix(C.copper, bg, 0.8), skyBot: mix(C.copper, bg, 0.52), ground: mix(C.copper, surf, 0.66), hill: mix(C.copper, surf, 0.46), edge: mix(C.copper, ink, 0.2), stars: true }
        : { skyTop: mix(C.copper, surf, 0.6), skyBot: mix(C.copper, C['hist-soft'], 0.72), ground: mix(C.copper, surf, 0.45), hill: mix(C.copper, ink, 0.08), edge: mix(C.copper, ink, 0.45), sun: true, paleSun: true };
    }
    p.ridge = mix(p.skyBot, p.hill, 0.32);
    p.hillTop = mix(p.hill, dk ? C.hist : surf, 0.16);
    p.groundDeep = mix(p.ground, dk ? bg : p.edge, 0.25);
    p.fort = mix(p.edge, p.hill, 0.35);
    p.fortDark = mix(p.edge, dk ? bg : ink, 0.2);
    p.robe = dk ? mix(C.lapis, C['lapis-ink'], 0.32) : C.lapis;
    p.turban = C['lapis-ink'];
    p.skin = mix(C.copper, C['lapis-ink'], 0.4);
    p.night = night;
    return p;
  }

  /* ---------- Bosqichlar ---------- */
  const steps = makeStepper(el('bSteps'), el('bNext'), [
    { id: 'theory', html: '<button class="linkish" data-goto="tarix">Tarix va nazariya</button> bilan tanishing: Beruniy usulining ikki qadami.' },
    { id: 'alpha', html: 'A nuqtada alidadani cho‘qqiga to‘g‘rilang (trubkadagi xoch yashil bo‘lsin) va α ni yozing.' },
    { id: 'beta', html: 'd masofani tanlang, B nuqtaga o‘ting va β ni yozing: tepalik balandligi h hisoblanadi.' },
    { id: 'climb', html: 'Cho‘qqiga chiqing: endi ufq gorizontal yo‘nalishdan pastda ko‘rinadi.' },
    { id: 'delta', html: 'Alidadani ufq chizig‘iga to‘g‘rilab, og‘ish burchagi δ ni yozing: Yer radiusi R hisoblanadi.' },
    { id: 'refr', html: '“Atmosfera nur sinishi”ni yoqib, δ ni qayta o‘lchang. R qanday o‘zgardi va nega?' },
    { id: 'concl', html: 'Yerda kamida 3 ta natija oling va o‘rtacha R ni 6 371 km hamda Beruniy natijasi bilan solishtiring.' },
    { id: 'planet', bonus: true, html: 'Qo‘shimcha topshiriq: Oy yoki Marsda o‘lchab, uning radiusini 5% aniqlikda toping.' }
  ]);
  root.addEventListener('click', e => { const b = e.target.closest('[data-goto]'); if (b) { showTab(b.dataset.goto); window.scrollTo({ top: 0, behavior: REDUCED ? 'auto' : 'smooth' }); } });

  /* ---------- Animatsiya sikli (faqat kerak bo‘lganda) ---------- */
  let raf = 0;
  function kick() { if (!raf) raf = requestAnimationFrame(loop); }
  function loop(now) {
    raf = 0;
    const a = S.anim;
    if (a) {
      if (a.t0 === null) a.t0 = now;
      const t = a.dur > 0 ? clamp((now - a.t0) / a.dur, 0, 1) : 1;
      a.step(t);
      if (t >= 1) { S.anim = null; if (a.done) a.done(); }
    }
    if (!panels.tajriba.hidden) { drawScene(); drawScope(); }
    if (S.anim) raf = requestAnimationFrame(loop);
  }
  function startAnim(dur, step, done) { S.anim = { dur: REDUCED ? 0 : dur, step, done, t0: null }; kick(); }

  /* ---------- Harakatlar ---------- */
  function newAttempt(msg) {
    S.LA = Math.round(1400 + Math.random() * 800);
    Object.assign(S, { stage: 'plain', pos: 'A', obsX: -S.LA, walkPh: 0, anim: null, fade: 1, aimP: 300, aimD: 0,
      alpha: null, beta: null, alphaOff: null, betaOff: null, h: null, dUsed: null, lastDelta: null, lastR: null });
    setMsg(ui.recMsg, msg || '', '');
    syncAll();
  }
  function setMsg(node, text, cls) { node.className = 'msg' + (cls ? ' ' + cls : ''); node.textContent = text; }
  function setAim(v, sound) {
    if (busy()) return;
    const q = Math.round(v * 2) / 2;
    if (S.stage === 'plain') S.aimP = clamp(q, 0, 1500); else S.aimD = clamp(q, 0, 180);
    if (sound) Sound.play('click', { vol: 0.8 });
    syncAim();
  }
  const curAim = () => S.stage === 'plain' ? S.aimP : S.aimD;
  // ↑ — alidadani yuqoriga: tekislikda burchak ortadi, cho‘qqida pastga og‘ish kamayadi
  const nudge = (st, sound) => setAim(S.stage === 'plain' ? S.aimP + st : S.aimD - st, sound);

  ui.fine.addEventListener('click', e => { const b = e.target.closest('[data-step]'); if (b) nudge(+b.dataset.step, true); });
  ui.aim.addEventListener('input', () => setAim(+ui.aim.value, false));
  ui.d.addEventListener('input', () => { if (S.pos !== 'A' || S.stage !== 'plain' || busy()) return; S.d = +ui.d.value; syncAll(); });

  ui.rec.addEventListener('click', () => {
    if (busy()) return;
    const off = aimOffset();
    if (Math.abs(off) > TOL) {
      Sound.play('error');
      const obj = S.stage === 'plain' ? 'Cho‘qqi' : 'Ufq chizig‘i';
      setMsg(ui.recMsg, `${obj} xoch markazida emas, shuning uchun yozilmadi. Ko‘rish trubkasida uni gorizontal ipga keltiring: xoch yashil bo‘lishi kerak (aniqlik ±0,5′).`, 'err');
      return;
    }
    if (S.stage === 'plain') {
      if (S.pos === 'A') {
        S.alpha = S.aimP; S.alphaOff = off; steps.mark('alpha');
        setMsg(ui.recMsg, `α = ${dms(S.alpha)} yozildi. Nishon aniq. Endi d ni tanlab, B nuqtaga o‘ting.`, 'ok');
      } else if (S.pos === 'B') {
        const b = S.aimP;
        const h = b > 0 && b < S.alpha ? calcH(S.d, S.alpha, b) : NaN;
        if (!(h > 0 && h < 20000)) {
          Sound.play('error');
          setMsg(ui.recMsg, `β = ${dms(b)} bilan h ni hisoblab bo‘lmaydi: B nuqta tepalikdan uzoqroq, shuning uchun β < α = ${dms(S.alpha)} bo‘lishi kerak. α ni qayta o‘lchash uchun “Yangi urinish”ni bosing.`, 'err');
          return;
        }
        S.beta = b; S.betaOff = off; S.h = h; S.dUsed = S.d; steps.mark('beta');
        setMsg(ui.recMsg, `β = ${dms(b)} yozildi. Tepalik balandligi h = ${fmt(h, 1)} m. Endi cho‘qqiga chiqing.`, 'ok');
      }
    } else {
      const dl = S.aimD;
      if (!(dl > 0)) { Sound.play('error'); setMsg(ui.recMsg, 'Alidada gorizontal holatda (0′). Ufq pastda: alidadani pastga buring.', 'err'); return; }
      const R = calcR(S.h, dl) / 1000, R0 = P().R, err = Math.abs(R - R0) / R0 * 100;
      S.lastDelta = dl; S.lastR = R;
      S.rows.push({ id: Date.now() + Math.random(), planet: S.planet, d: S.dUsed, a: S.alpha, b: S.beta, h: S.h, dl, R, err, refr: refrOn() });
      store.set(KEY, S.rows);
      renderRows();
      setMsg(ui.recMsg, `δ = ${dms(dl)} yozildi. R = ${fmtGroup(R, 0)} km, xatolik ${fmt(err, 1)}%. Jadvalga qo‘shildi.` + (refrOn() ? ' Nur sinishi yoqilgan: ufq ko‘tarilib ko‘ringani uchun R katta chiqdi.' : ''), err < 5 ? 'ok' : '');
    }
    Sound.play('chime');
    syncAll();
  });

  ui.goB.addEventListener('click', () => {
    if (busy() || S.pos !== 'A' || S.alpha === null || S.stage !== 'plain') return;
    const x0 = S.obsX, x1 = -(S.LA + S.d);
    S.pos = 'walk';
    startAnim(700 + S.d * 1.3, t => { const e = ease(t); S.obsX = x0 + (x1 - x0) * e; S.walkPh = Math.abs(x1 - x0) * e / 16; },
      () => { S.pos = 'B'; S.obsX = x1; S.walkPh = 0; setMsg(ui.recMsg, `Siz B nuqtadasiz: A dan ${fmtGroup(S.d, 0)} m uzoqda. Cho‘qqini qayta nishonga olib, β ni yozing.`, ''); syncAll(); });
    syncAll();
  });
  ui.climb.addEventListener('click', () => {
    if (busy() || S.stage !== 'plain' || S.h === null) return;
    Sound.play('whoosh', { dur: 1.1 });
    const x0 = S.obsX; S.pos = 'climb';
    startAnim(2600, t => { const e = ease(t); S.obsX = x0 * (1 - e); S.walkPh = -x0 * e / 16; }, () => {
      S.stage = 'summit'; S.pos = 'S'; S.obsX = 0; S.walkPh = 0; S.fade = 0; steps.mark('climb');
      setMsg(ui.recMsg, 'Siz cho‘qqidasiz. Ufq gorizontaldan biroz pastda: alidadani pastga burib, ufq chizig‘ini xochga keltiring.', '');
      startAnim(650, t => { S.fade = t; }, () => { S.fade = 1; syncAll(); });
      syncAll();

    syncAll();
  });
  ui.newBtn.addEventListener('click', () => { if (S.anim) S.anim = null; newAttempt('Yangi urinish: kuzatuvchi yangi A nuqtada, cho‘qqigacha masofa o‘zgardi.'); });
  ui.exag.addEventListener('click', () => { S.exag = !S.exag; ui.exag.setAttribute('aria-pressed', S.exag ? 'true' : 'false'); syncFoot(); kick(); });
  ui.refr.addEventListener('click', () => {
    if (!P().atm) return;
    S.refr = !S.refr; syncAll();
  });
  ui.planet.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.dataset.v === S.planet || busy()) return;
    S.planet = b.dataset.v;
    newAttempt(`${P().name}: yangi urinish. Tepalik o‘zgarmadi (${H_TRUE} m), lekin osmon jismining radiusi boshqa.`);

  });

  // Trubkani tortib burish
  let drag = null;
  ui.scope.addEventListener('pointerdown', e => {
    if (busy()) return;

  ui.scope.addEventListener('pointermove', e => {

  /* ---------- Sinxronlash ---------- */
  function syncAim() {
    const v = curAim();
    ui.aimVal.textContent = dms(v);
    ui.aimOut.textContent = dms(v);
    if (+ui.aim.value !== v) ui.aim.value = v;
    syncScopeMsg(); renderCalc(); kick();
  }
  function syncScopeMsg() {
    if (busy()) { setMsg(ui.scopeMsg, S.pos === 'climb' ? 'Kuzatuvchi cho‘qqiga chiqmoqda…' : 'Kuzatuvchi B nuqtaga yurmoqda…', ''); return; }
    const off = aimOffset(), obj = S.stage === 'plain' ? 'Cho‘qqi' : 'Ufq chizig‘i';
    if (Math.abs(off) <= TOL) setMsg(ui.scopeMsg, `${obj} xoch markazida: nishon aniq.`, 'ok');
    else if (off > FOV - 0.5) setMsg(ui.scopeMsg, `${obj} ko‘rinmayapti: alidadani yuqoriga buring.`, '');
    else if (off < -(FOV - 0.5)) setMsg(ui.scopeMsg, `${obj} ko‘rinmayapti: alidadani pastga buring.`, '');
    else setMsg(ui.scopeMsg, `${obj} ko‘rinmoqda: uni gorizontal ipga keltiring (${off > 0 ? 'yuqoriga' : 'pastga'}).`, '');
  }
  function syncAll() {
    const top = S.stage === 'summit', b = busy();
    $$('span', ui.phase).forEach(s => {
      const cur = (s.dataset.v === 'summit') === top;
      if (cur) s.setAttribute('aria-current', 'step'); else s.removeAttribute('aria-current');
      s.classList.toggle('done', s.dataset.v === 'plain' && top);
    });
    ui.exagWrap.hidden = !top;
    ui.aimLbl.textContent = top ? 'Ufqning pastga og‘ishi' : 'Balandlik burchagi';
    ui.aimSlLbl.textContent = top ? 'Pastga og‘ish (dag‘al)' : 'Alidadani burish (dag‘al)';
    ui.aim.max = top ? 180 : 1500;
    ui.aim.disabled = b;
    $$('button', ui.fine).forEach(x => { x.disabled = b; });
    ui.rec.disabled = b || (S.stage === 'plain' && S.pos !== 'A' && S.pos !== 'B');
    ui.rec.textContent = top ? 'δ ni yozish va R ni hisoblash' : S.pos === 'B' ? (S.beta === null ? 'β ni yozish (B nuqtada)' : 'β ni qayta yozish') : S.pos === 'A' ? (S.alpha === null ? 'α ni yozish (A nuqtada)' : 'α ni qayta yozish') : 'Kuting…';
    ui.d.value = S.d; ui.d.disabled = b || S.pos !== 'A' || top;
    ui.dv.textContent = fmtGroup(S.d, 0) + ' m';
    ui.goB.disabled = b || S.pos !== 'A' || S.alpha === null || top;
    ui.climb.disabled = b || top || S.h === null;
    $$('button', ui.planet).forEach(x => x.setAttribute('aria-pressed', x.dataset.v === S.planet ? 'true' : 'false'));

    ui.refr.setAttribute('aria-pressed', refrOn() ? 'true' : 'false');
    ui.planetNote.textContent = `${P().name}: o‘rtacha radius ${fmtGroup(P().R, 0)} km. ${P().note}`;
    const cells = [
      ['α (A nuqta)', S.alpha === null ? '—' : dms(S.alpha)], ['β (B nuqta)', S.beta === null ? '—' : dms(S.beta)],
      ['d', fmtGroup(S.dUsed === null ? S.d : S.dUsed, 0) + ' m'], ['h', S.h === null ? '—' : fmt(S.h, 1) + ' m'],
      ['δ (oxirgi)', S.lastDelta === null ? '—' : dms(S.lastDelta)], ['R (oxirgi)', S.lastR === null ? '—' : fmtGroup(S.lastR, 0) + ' km']
    ];
    ui.vals.innerHTML = cells.map(([l, v]) => `<div class="lcd-cell"><span class="lbl">${l}</span><span class="val">${v}</span></div>`).join('');
    syncFoot(); syncAim();
  }
  function syncFoot() {
    if (S.stage === 'plain') {
      ui.foot.textContent = S.pos === 'A' ? 'A nuqta: alidadani cho‘qqiga qarating va α ni yozing.' : S.pos === 'B' ? 'B nuqta: cho‘qqini qayta nishonga oling va β ni yozing.' : 'Kuzatuvchi yo‘lda…';
      ui.foot2.textContent = `Simulyatsiyada tepalik ${H_TRUE} m · rasmda bo‘yiga cho‘zilgan`;
    } else {
      ui.foot.textContent = 'Ko‘rish trubkasida ufq chizig‘ini gorizontal ipga keltiring va δ ni yozing.';
      ui.foot2.textContent = S.exag ? 'Egrilik bo‘rttirilgan: burchaklar rasmda kattaroq' : 'Haqiqiy nisbatlar: egrilik deyarli ko‘rinmaydi';
    }
  }

  /* ---------- Hisob-kitob kartasi ---------- */
  function renderCalc() {
    const a = S.alpha, b = S.beta, d = S.dUsed === null ? S.d : S.dUsed;
    let b1 = `<div class="eq">h = d · tg α · tg β / (tg α − tg β)</div>`;
    if (a !== null && b !== null && S.h !== null) {
      const ta = Math.tan(a * AM), tb = Math.tan(b * AM), x = S.h / ta, eh = Math.abs(S.h - H_TRUE) / H_TRUE * 100;
      b1 += `<div class="eq">h = ${fmtGroup(d, 0)} · tg ${dms(a)} · tg ${dms(b)} / (tg ${dms(a)} − tg ${dms(b)})</div>
        <div class="eq">h = ${fmtGroup(d, 0)} · ${fmt(ta, 5)} · ${fmt(tb, 5)} / ${fmt(ta - tb, 5)} = <b>${fmt(S.h, 1)} m</b></div>
        <p class="small muted">A dan cho‘qqigacha gorizontal masofa x = h / tg α ≈ ${fmtGroup(x, 0)} m (haqiqiysi ${fmtGroup(S.LA, 0)} m). Simulyatsiyada tepalik balandligi ${H_TRUE} m olingan: h dagi xatolik ${fmt(eh, 1)}%.</p>`;
    } else {
      b1 += `<p class="small muted">O‘lchanganlar: α = ${a === null ? '—' : dms(a)}, β = ${b === null ? '—' : dms(b)}, d = ${fmtGroup(d, 0)} m. Ikkala burchak yozilgach, h shu yerda hisoblanadi.</p>`;
    }
    let b2 = `<div class="eq">R = h · cos δ / (1 − cos δ) ≈ 2h / δ²</div>`;
    if (S.lastDelta !== null && S.h !== null) {
      const dl = S.lastDelta, c = Math.cos(dl * AM), o = omc(dl * AM), rad = dl * AM, R0 = P().R, e = (S.lastR - R0) / R0 * 100;
      const cls = Math.abs(e) < 2 ? 'good' : Math.abs(e) < 5 ? 'warn' : 'bad';
      b2 += `<div class="eq">R = ${fmt(S.h, 1)} · cos ${dms(dl)} / (1 − cos ${dms(dl)})</div>
        <div class="eq">R = ${fmt(S.h, 1)} m · ${fmt(c, 8)} / ${fmt(o, 8)} = <b>${fmtGroup(S.lastR, 0)} km</b></div>
        <div class="eq">δ = ${fmin(dl)}′ = ${fmt(rad, 6)} rad;  2h / δ² = 2 · ${fmt(S.h, 1)} / ${fmt(rad, 6)}² ≈ ${fmtGroup(2 * S.h / rad / rad / 1000, 0)} km</div>
        <p class="small">Haqiqiy o‘rtacha radius ${fmtGroup(R0, 0)} km: nisbiy xatolik <b class="br-${cls}">${fmt(Math.abs(e), 1)}%</b> (${e >= 0 ? 'katta' : 'kichik'} chiqdi).${S.planet === 'yer' ? ` Beruniy natijasi: ${BER_CUBITS} tirsak, ya’ni taxminan 6 300–6 400 km.` : ''}</p>`;
    } else {
      b2 += `<p class="small muted">${S.stage === 'summit' ? 'Ufqni nishonga olib, δ ni yozing: R sizning h va δ qiymatlaringiz bilan hisoblanadi.' : 'Avval h ni toping va cho‘qqiga chiqing.'}</p>`;
    }
    const ds = S.stage === 'summit' && S.aimD > 0 ? S.aimD : S.lastDelta;
    let b3;
    if (ds && S.h !== null) {
      b3 = `<p class="small">δ = ${fmin(ds)}′ bo‘lganda 1′ xato R ni taxminan 2 · 1′ / δ = 2 / ${fmin(ds)} ≈ <b>${fmt(200 / ds, 1)}%</b> ga o‘zgartiradi.`;
      if (ds >= 3) b3 += ` Sizning h bilan: δ = ${fmin(ds - 1)}′ bo‘lsa R ≈ ${fmtGroup(calcR(S.h, ds - 1) / 1000, 0)} km, δ = ${fmin(ds + 1)}′ bo‘lsa R ≈ ${fmtGroup(calcR(S.h, ds + 1) / 1000, 0)} km.`;
      b3 += '</p>';
    } else b3 = '<p class="small muted">Cho‘qqida alidadani burganingizda shu yerda baho ko‘rinadi: R ~ 1/δ², shuning uchun δ dagi kichik xato R da ikki baravar katta nisbiy xatoga aylanadi.</p>';
    if (refrOn()) b3 += `<p class="small br-warnline">Nur sinishi yoqilgan: ko‘rinma og‘ish √(1 − 0,13) ≈ ${fmt(Math.sqrt(1 - K_REFR), 3)} ga ko‘payadi (≈ ${fmt((1 - Math.sqrt(1 - K_REFR)) * 100, 0)}% kichik), shuning uchun R taxminan 1 / (1 − k) ≈ ${fmt(1 / (1 - K_REFR), 2)} marta katta chiqadi.</p>`;
    ui.calc.innerHTML = `
      <div class="blk"><span class="num">1</span><div><h4>Tepalik balandligi (tekislikda)</h4>${b1}</div></div>
      <div class="blk"><span class="num">2</span><div><h4>Osmon jismi radiusi (cho‘qqida)</h4>${b2}</div></div>
      <div class="blk"><span class="num">≈</span><div><h4>Sezgirlik</h4>${b3}</div></div>`;
  }

  /* ---------- Sahna: chizish yordamchilari ---------- */
  const cv = setupCanvas(el('bCanvas'), () => drawScene());
  const cvS = setupCanvas(ui.scope, () => drawScope());
  const cvC = setupCanvas(el('bChart'), () => drawChart());
  function fonts() { FONT = getComputedStyle(document.body).fontFamily; MONO = css('font-mono') || 'monospace'; }
  function pill(ctx, W, text, x, y, o = {}) {
    const size = o.size || 12;
    ctx.font = (o.bold ? '600 ' : '') + size + 'px ' + (o.mono ? MONO : FONT);
    const tw = ctx.measureText(text).width, pw = tw + 12, ph = size + 9;
    let x0 = o.align === 'right' ? x - pw : o.align === 'center' ? x - pw / 2 : x;
    x0 = clamp(x0, 4, Math.max(4, W - pw - 4));
    ctx.fillStyle = alpha(C.surface, o.bgA === undefined ? 0.88 : o.bgA);
    roundRect(ctx, x0, y - ph / 2, pw, ph, 6); ctx.fill();
    if (o.border) { ctx.strokeStyle = o.border; ctx.lineWidth = 1; ctx.stroke(); }
    ctx.fillStyle = o.color || C.ink; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(text, x0 + 6, y + 0.5);
    return { x0, w: pw, h: ph };
  }
  // Uzun yozuvni bir necha qatorga bo‘lib chizadi; keyingi bo‘sh y ni qaytaradi
  function pillWrap(ctx, W, text, x, y, o = {}) {
    const size = o.size || 12, maxW = W - x - 20;
    ctx.font = (o.bold ? '600 ' : '') + size + 'px ' + FONT;
    const out = []; let cur = '';
    text.split(' ').forEach(wd => { const t = cur ? cur + ' ' + wd : wd; if (cur && ctx.measureText(t).width > maxW) { out.push(cur); cur = wd; } else cur = t; });
    if (cur) out.push(cur);
    out.forEach((t, i) => pill(ctx, W, t, x, y + i * (size + 10), o));
    return y + out.length * (size + 10);

    const plain = rows.filter(r => !r.refr), ref = rows.filter(r => r.refr);
    const avg = a => a.length ? a.reduce((s, r) => s + r.R, 0) / a.length : NaN;
    const A = avg(plain), eps = Number.isFinite(A) ? Math.abs(A - R0) / R0 * 100 : NaN;
    const cls = !Number.isFinite(eps) ? '' : eps < 2 ? 'good' : eps < 5 ? 'warn' : 'bad';
    let html = `
      <div class="stat"><div class="lbl">O‘rtacha R · ${pl.name}</div><div class="val">${Number.isFinite(A) ? fmtGroup(A, 0) : '—'}</div><div class="sub">${plain.length} ta urinish, km${pl.atm ? ', nur sinishisiz' : ''}</div></div>
      <div class="stat ${cls}"><div class="lbl">Nisbiy xatolik, ε</div><div class="val">${Number.isFinite(eps) ? fmt(eps, 1) + '%' : '—'}</div><div class="sub">ε = |R<sub>o‘rt</sub> − R| / R</div></div>
      <div class="stat"><div class="lbl">Haqiqiy o‘rtacha radius</div><div class="val">${fmtGroup(R0, 0)}</div><div class="sub">km</div></div>`;
    if (S.planet === 'yer') html += `<div class="stat"><div class="lbl">Beruniy natijasi</div><div class="val">≈ 6 323</div><div class="sub">km, bir qayta hisob bo‘yicha (${BER_CUBITS} tirsak; tirsak uzunligiga qarab ≈ 6 300–6 400 km)</div></div>`;
    else html += `<div class="stat"><div class="lbl">Kutilgan og‘ish (${H_TRUE} m dan)</div><div class="val">${dms(dipOf(R0, H_TRUE))}</div><div class="sub">aniqroq ${fmt(dipOf(R0, H_TRUE), 1)}′; Yerda ${fmt(dipOf(6371, H_TRUE), 1)}′</div></div>`;
    if (ref.length) {
      const B = avg(ref), df = (B - R0) / R0 * 100;
      html += `<div class="stat warn"><div class="lbl">Nur sinishi bilan o‘rtacha R</div><div class="val">${fmtGroup(B, 0)}</div><div class="sub">${ref.length} ta urinish · haqiqiydan ${df >= 0 ? '+' : '−'}${fmt(Math.abs(df), 0)}%</div></div>`;
    }
    ui.summary.innerHTML = html;
  }

  function svgDip() {
