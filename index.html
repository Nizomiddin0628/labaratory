  }

  /* ---------- Chizish: qurilma ---------- */
  const cv = setupCanvas(el('tCanvas'), () => draw());
  const cvG = setupCanvas(el('tChart'), () => drawChart());
  function geo() {
    const { w, h } = cv; const narrow = w < 560;
    const fx = Math.round(w * (narrow ? 0.42 : 0.46)), bx = fx - 7;
    const tw = narrow ? 6.5 : 8;
    const stH = narrow ? 26 : 32, stW = narrow ? 124 : 188, stY = h - 12 - stH;
    const fBodyH = clamp(h * 0.22, 72, 116), fRb = fBodyH * 0.64, fRn = narrow ? 15 : 17, fNeckH = fBodyH * 0.36;
    const fBot = stY, fSh = fBot - fBodyH, fTop = fSh - fNeckH;
    const tipY = fTop + 14, cockY = tipY - (narrow ? 26 : 32), tubeBot = cockY - 13, tubeTop = 26;
    const g0 = tubeTop + 26, g50 = tubeBot - 10;
    const rx = fx + (narrow ? 66 : 102);
    return { w, h, narrow, fx, bx, tw, stH, stW, stY, fBodyH, fRb, fRn, fNeckH, fBot, fSh, fTop, tipY, cockY, tubeBot, tubeTop, g0, g50, rx, yOf: v => g0 + v / CAP * (g50 - g0) };
  }
  // ko'rinadigan sath: kichik hajmlar ham ko'rinsin (250 ml li kolba)
  const levelY = (g, vol) => g.fBot - clamp(0.16 + 0.84 * Math.pow(vol / 250, 0.75), 0.1, 0.92) * g.fBodyH;
  const rAt = (g, y) => g.fRb - (g.fRb - g.fRn) * clamp((g.fBot - y) / g.fBodyH, 0, 1);
  const dipOf = (g, yL) => (S.stir ? Math.min(7, (g.fBot - yL) * 0.22) : 0);
  function surfY(g) { const yL = levelY(g, S.Va + vIn()); return yL + dipOf(g, yL); }
  function flaskPath(ctx, g, close) {
    const { fx, fRn, fRb, fTop, fSh, fBot } = g, rr = 9;
    ctx.beginPath();
    ctx.moveTo(fx - fRn - 3, fTop - 2); ctx.lineTo(fx - fRn, fTop + 3); ctx.lineTo(fx - fRn, fSh);
    ctx.lineTo(fx - fRb + rr * 0.45, fBot - rr); ctx.quadraticCurveTo(fx - fRb, fBot, fx - fRb + rr, fBot);
    ctx.lineTo(fx + fRb - rr, fBot); ctx.quadraticCurveTo(fx + fRb, fBot, fx + fRb - rr * 0.45, fBot - rr);
    ctx.lineTo(fx + fRn, fSh); ctx.lineTo(fx + fRn, fTop + 3); ctx.lineTo(fx + fRn + 3, fTop - 2);
    if (close) ctx.closePath();
  }
  function draw() {
    const { ctx, w, h } = cv; const P = Palette.c; if (!w) return;
    const g = geo(), dark = Palette.dark, ak = alphaK();
    const font = getComputedStyle(document.body).fontFamily;
    const mono = getComputedStyle(document.documentElement).getPropertyValue('--font-mono');
    const tint = dark ? 'rgba(130,175,230,0.30)' : 'rgba(120,165,220,0.28)';
    const glassFill = dark ? 'rgba(160,190,230,0.06)' : 'rgba(150,180,215,0.10)';
    const shine = dark ? 'rgba(255,255,255,0.13)' : 'rgba(255,255,255,0.8)';
    ctx.clearRect(0, 0, w, h);
    const { fx, bx, tw } = g;
    const vol = S.Va + vIn();

    // shtativ
    ctx.fillStyle = P.metal;
    ctx.fillRect(g.rx - 3, g.tubeTop + 4, 6, h - 18 - g.tubeTop - 4);
    roundRect(ctx, g.rx - (g.narrow ? 2 : 4), h - 18, g.narrow ? 40 : 70, 9, 3); ctx.fill();

    // pH-metr kabeli
    const ex = fx + (g.narrow ? 8 : 9), eTop = g.fTop - 10, eBot = g.fBot - (g.narrow ? 16 : 20);
    const pb = { x: g.rx + (g.narrow ? 12 : 34), y: g.narrow ? 8 : 30 };
    pb.w = g.narrow ? Math.max(84, w - pb.x - 6) : 172; pb.h = g.narrow ? 62 : 92;
    ctx.strokeStyle = P['ink-2']; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ex, eTop + 2);
    ctx.bezierCurveTo(ex + 34, eTop - 6, pb.x + 4, pb.y + pb.h + 80, pb.x + 24, pb.y + pb.h);
    ctx.stroke(); ctx.lineCap = 'butt';

    // kolba: shisha fon
    ctx.fillStyle = glassFill; flaskPath(ctx, g, true); ctx.fill();
    // suyuqlik
    const yL = levelY(g, vol), dip = dipOf(g, yL), rL = rAt(g, yL);
    const fB = indFrac(S.ind, S.phMix);
    ctx.save(); flaskPath(ctx, g, true); ctx.clip();
    ctx.beginPath(); ctx.moveTo(fx - rL - 4, yL); ctx.quadraticCurveTo(fx, yL + 2 * dip, fx + rL + 4, yL);
    ctx.lineTo(fx + g.fRb + 4, g.fBot + 2); ctx.lineTo(fx - g.fRb - 4, g.fBot + 2); ctx.closePath();
    ctx.fillStyle = dark ? 'rgba(140,175,220,0.14)' : 'rgba(150,185,225,0.18)'; ctx.fill();
    ctx.fillStyle = rgba(indRGBA(S.ind, fB), ak); ctx.fill();
    ctx.save(); ctx.clip();
    // aralashtirish oqimlari
    if (S.stir && g.fBot - yL > 14) {
      ctx.strokeStyle = dark ? 'rgba(220,235,255,0.20)' : 'rgba(40,60,90,0.16)'; ctx.lineWidth = 1.3;
      for (let i = 0; i < 3; i++) {
        const yy = yL + dip + (g.fBot - yL - dip) * (0.3 + 0.2 * i), rr = rAt(g, yy) * (0.62 - i * 0.08), ph0 = S.stirA * (0.9 - i * 0.15) + i * 2.1;
        ctx.beginPath(); ctx.ellipse(fx, yy, rr, 3 + i, 0, ph0, ph0 + 1.4); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(fx, yy, rr, 3 + i, 0, ph0 + Math.PI, ph0 + Math.PI + 1.1); ctx.stroke();
      }
    }
    // tomchi tushgan joydagi rang dog'i
    for (const s of S.spots) {
      const age = S.t - s.t0, a = s.s * Math.exp(-age / s.tau); if (a < 0.02) continue;
      const sp = 1 - Math.exp(-age / (S.stir ? 0.45 : 1.4));
      const r = 7 + (S.stir ? 34 : 16) * sp;
      const x = s.x + (S.stir && !REDUCED ? Math.sin(age * 7 + 1) * 24 * sp : 0);
      const y = s.y + (S.stir ? 8 : 4 + 14 * sp);
      const c = s.col.slice(); c[3] = Math.max(c[3], 0.55) * Math.min(1, a * 1.25);
      const gr = ctx.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, rgba(c, ak)); gr.addColorStop(0.55, rgba([c[0], c[1], c[2], c[3] * 0.6], ak)); gr.addColorStop(1, rgba([c[0], c[1], c[2], 0]));
      ctx.fillStyle = gr; ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.75, 0, 0, TAU); ctx.fill();
    }
    ctx.restore();
    // to'lqinchalar
    for (const rp of S.ripples) {
      const age = S.t - rp.t0; if (age > 0.45) continue;
      const rr = 2 + 30 * age;
      ctx.strokeStyle = dark ? `rgba(220,235,255,${(0.5 * (1 - age / 0.45)).toFixed(3)})` : `rgba(40,70,110,${(0.45 * (1 - age / 0.45)).toFixed(3)})`;
      ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(rp.x, yL + dip * (1 - Math.pow((rp.x - fx) / (rL + 4), 2)) * 1, rr, rr * 0.28, 0, 0, TAU); ctx.stroke();
    }
    // magnit tayoqcha
    const L = g.narrow ? 22 : 30, app = REDUCED ? L : Math.max(6, L * Math.abs(Math.cos(S.stirA)));
    ctx.fillStyle = '#f1f1ec'; ctx.strokeStyle = 'rgba(0,0,0,0.38)'; ctx.lineWidth = 1;
    roundRect(ctx, fx - app / 2, g.fBot - 8, app, 6, 3); ctx.fill(); ctx.stroke();
    ctx.restore();
    // sirt chizig'i
    ctx.strokeStyle = P['ink-3']; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(fx - rL, yL); ctx.quadraticCurveTo(fx, yL + 2 * dip, fx + rL, yL); ctx.stroke();

    // pH elektrod
    ctx.fillStyle = dark ? 'rgba(190,210,235,0.20)' : 'rgba(160,185,215,0.40)';
    ctx.strokeStyle = P['ink-3']; ctx.lineWidth = 1;

    S.y = y; S.m = m; S.d = d; S.obs = null; S.anim = null;
    setMsg(ui.recMsg, '', '');
    syncAll();
  }
  function shiftDay(n) {
    const c = calOf(jdOf(S.y, S.m, S.d) + n + 0.5);
    if (c.y < Y0 || c.y > Y1) return;
    setDate(c.y, c.m, c.d);
  }
  ui.year.addEventListener('change', () => setDate(+ui.year.value, S.m, Math.min(S.d, dim(+ui.year.value, S.m))));
  ui.month.addEventListener('change', () => setDate(S.y, +ui.month.value, Math.min(S.d, dim(S.y, +ui.month.value))));
  ui.day.addEventListener('change', () => setDate(S.y, S.m, +ui.day.value));
  ui.prev.addEventListener('click', () => shiftDay(-1));
  ui.next.addEventListener('click', () => shiftDay(1));
  $$('[data-jump]', panels.tajriba).forEach(b => b.addEventListener('click', () => { const [m, d] = b.dataset.jump.split(',').map(Number); setDate(S.y, m, d); }));
  ui.jumpY.addEventListener('click', () => setDate(S.bY, 3, 19));
  ui.jumpYk.addEventListener('click', () => { if (S.bY + S.k <= Y1) setDate(S.bY + S.k, 3, 19); });
  const kMax = () => Math.max(1, Y1 - S.bY);
  ui.bY.addEventListener('change', () => { S.bY = clamp(+ui.bY.value, Y0, Y1 - 1); S.k = clamp(S.k, 1, kMax()); syncB(); });
  ui.bk.addEventListener('input', () => { S.k = clamp(Math.round(+ui.bk.value), 1, kMax()); syncB(); });
  function syncB() {
    S.bY = clamp(S.bY, Y0, Y1 - 1); S.k = clamp(S.k, 1, kMax());
    ui.bk.max = kMax(); ui.bY.value = S.bY; ui.bk.value = S.k; ui.bkv.textContent = `${S.k} yil → ${S.bY + S.k}-yil`;
    ui.jumpY.textContent = `${S.bY}-yil, 19-mart`; ui.jumpYk.textContent = `${S.bY + S.k}-yil, 19-mart`;
    renderCalcB(); drawChart();
  }

  /* ---------- Kuzatish ---------- */
  function setMsg(n, t, c) { n.className = 'msg' + (c ? ' ' + c : ''); n.textContent = t; }
  ui.observe.addEventListener('click', () => {
    if (busy()) return;
    const o = noonAlt(S.y, S.m, S.d, S.refr);
    S.obs = Object.assign({ phase: 'transit', x: -1 }, o);
    setMsg(ui.recMsg, '', '');
    Sound.play('whoosh', { vol: 0.45, dur: 1.4 });
    startAnim(2400, t => { S.obs.x = -1 + t; }, () => {
      S.obs.phase = 'noon'; S.obs.x = 0;
      setMsg(ui.recMsg, 'Tush payti: Quyosh tasviri meridianda. Ko‘rsatkichni tasvir markaziga keltiring.', '');
      syncAll();
    });
    syncAll();
  });
  function setPtr(v, sound) {
    S.ptr = clamp(Math.round(v * 2) / 2, 1200, 4800);
    if (sound) Sound.play('click', { vol: 0.8 });
    syncPtr();
  }
  ui.fine.addEventListener('click', e => { const b = e.target.closest('[data-step]'); if (b) setPtr(S.ptr + parseFloat(b.dataset.step), true); });
  ui.ptr.addEventListener('input', () => setPtr(+ui.ptr.value, false));
  ui.center.addEventListener('click', () => {
    if (!atNoon()) { setMsg(ui.recMsg, 'Avval “Tushni kuzatish”ni bosing: tasvir meridianga kelsin.', 'err'); return; }
    setPtr(S.obs.h * 60, true);
    setMsg(ui.recMsg, 'Ko‘rsatkich eng yaqin 0,5′ bo‘linmaga qo‘yildi (qoldiq xato 0,25′ dan kichik).', '');
  });
  ui.rec.addEventListener('click', () => {
    if (busy()) return;
    if (!atNoon()) { Sound.play('error'); setMsg(ui.recMsg, 'Hali kuzatish yo‘q: “Tushni kuzatish”ni bosing.', 'err'); return; }
    const off = offMin();
    if (Math.abs(off) > TOL) {
      Sound.play('error');
      setMsg(ui.recMsg, `Ko‘rsatkich tasvir markazida emas, shuning uchun yozilmadi. Ramka chiziqlari tasvir chetlariga teng masofada bo‘lsin (aniqlik ±0,5′).`, 'err');
      return;
    }
    const row = { id: Date.now() + Math.random(), y: S.y, m: S.m, d: S.d, jd: S.obs.jd, h: S.ptr / 60, refr: S.refr };
    const i = S.rows.findIndex(r => r.y === row.y && r.m === row.m && r.d === row.d);
    if (i >= 0) S.rows[i] = row; else S.rows.push(row);
    S.rows.sort((a, b) => a.jd - b.jd);
    store.set(KEY, S.rows);
    Sound.play('chime');
    setMsg(ui.recMsg, `${fmtDate(S.y, S.m, S.d)}: h = ${fmtRead(row.h)} jurnalga yozildi.` + (i >= 0 ? ' (Shu kungi oldingi yozuv yangilandi.)' : ''), 'ok');
    startAnim(1500, t => { if (S.obs) S.obs.x = t; }, () => { S.obs = null; syncAll(); });
    renderAll();
  });
  ui.refr.addEventListener('click', () => {
    S.refr = !S.refr; ui.refr.setAttribute('aria-pressed', S.refr ? 'true' : 'false');
    if (S.obs) { const o = noonAlt(S.y, S.m, S.d, S.refr); S.obs.h = o.h; }
    syncAll();
  });

  // Shkalani tortib surish
  let drag = null;
  ui.scale.addEventListener('pointerdown', e => { drag = { y: e.clientY, v0: S.ptr }; ui.scale.setPointerCapture(e.pointerId); ui.scale.style.cursor = 'grabbing'; });
  ui.scale.addEventListener('pointermove', e => { if (!drag) return; setPtr(drag.v0 + (e.clientY - drag.y) / scaleGeom().k, false); });
  const endDrag = () => { drag = null; ui.scale.style.cursor = 'grab'; };
  ui.scale.addEventListener('pointerup', endDrag);
  ui.scale.addEventListener('pointercancel', endDrag);

  /* ---------- Sinxronlash ---------- */
  function syncPtr() {
    ui.read.textContent = fmtRead(S.ptr / 60);
    ui.ptrOut.textContent = fmtRead(S.ptr / 60);
    if (+ui.ptr.value !== S.ptr) ui.ptr.value = S.ptr;
    syncScaleMsg(); kick();
  }
  function syncScaleMsg() {
    if (!S.obs) { setMsg(ui.scaleMsg, 'Quyosh tasviri hali yo‘q: “Tushni kuzatish”ni bosing.', ''); return; }
    if (S.obs.phase === 'transit') { setMsg(ui.scaleMsg, 'Tasvir devorlar orasidan o‘tmoqda (4 daqiqalik o‘tish tezlashtirilgan)…', ''); return; }
    if (S.obs.phase !== 'noon' || busy()) { setMsg(ui.scaleMsg, 'Tasvir meridiandan o‘tib ketmoqda.', ''); return; }
    const off = offMin();
    if (Math.abs(off) <= TOL) setMsg(ui.scaleMsg, 'Ko‘rsatkich tasvir markazida: o‘qish aniq.', 'ok');
    else if (Math.abs(off) > VIEW - 2) setMsg(ui.scaleMsg, `Tasvir ko‘rinmayapti: ko‘rsatkichni ${off < 0 ? 'oshiring (+)' : 'kamaytiring (−)'}.`, '');
    else setMsg(ui.scaleMsg, `Tasvir ko‘rinmoqda: ko‘rsatkichni ${off < 0 ? 'oshiring (+)' : 'kamaytiring (−)'} — ramka chiziqlari tasvir chetlariga teng masofada bo‘lsin.`, '');
  }
  function syncAll() {
    const b = busy();
    syncDateUI();
    ui.observe.disabled = b || (S.obs && S.obs.phase === 'noon');
    ui.observe.textContent = S.obs && S.obs.phase === 'noon' ? 'Tasvir meridianda' : 'Tushni kuzatish';
    ui.rec.disabled = !atNoon();
    ui.center.disabled = !atNoon() || !S.rows.length;
    ui.center.title = S.rows.length ? '' : 'Birinchi o‘lchovni qo‘lda bajaring: shundan keyin yordamchi ochiladi';
    el('uCenterHint').hidden = S.rows.length > 0;
    [ui.year, ui.month, ui.day, ui.prev, ui.next, ui.jumpY, ui.jumpYk, ...$$('[data-jump]', panels.tajriba)].forEach(x => { x.disabled = b; });
    ui.refr.setAttribute('aria-pressed', S.refr ? 'true' : 'false');
    ui.foot.textContent = S.obs ? (S.obs.phase === 'noon' ? 'Tasvir meridianda to‘xtatildi (simulyatsiya): bemalol o‘qing.' : 'Quyosh tasviri meridiandan o‘tmoqda.') : 'Sanani tanlang va “Tushni kuzatish”ni bosing.';
    syncPtr();
  }

  /* ---------- A vazifa ---------- */
  const inWin = (r, mA, dA, mB, dB) => (r.m > mA || (r.m === mA && r.d >= dA)) && (r.m < mB || (r.m === mB && r.d <= dB));
  const summerRows = () => S.rows.filter(r => inWin(r, 5, 20, 7, 20));
  const winterRows = () => S.rows.filter(r => r.m === 12 || r.m === 11 && r.d >= 20 || r.m === 1 && r.d <= 20);
  function taskA() {
    const su = summerRows(), wi = winterRows();
    if (!su.length || !wi.length) return { su, wi, ok: false };
    const rMax = su.reduce((a, r) => r.h > a.h ? r : a), rMin = wi.reduce((a, r) => r.h < a.h ? r : a);
    const hmax = rMax.h, hmin = rMin.h, eps = (hmax - hmin) / 2, phi = 90 - (hmax + hmin) / 2;
    const epsModel = sun(rMax.jd).eps0;
    return { su, wi, ok: true, rMax, rMin, hmax, hmin, eps, phi, epsModel, refr: rMax.refr || rMin.refr };
  }
  function renderCalcA() {
    const A = taskA();
    const list = (rs, best) => rs.length ? rs.map(r => `<span class="ub-tag${r === best ? ' on' : ''}">${r.d}-${MONTHS[r.m - 1]} ${r.y}: ${fmtRead(r.h)}</span>`).join(' ') : '<span class="muted">hali yo‘q</span>';
    let h = `<p class="small">Yozgi kuzatishlar: ${list(A.su, A.rMax)}</p><p class="small">Qishki kuzatishlar: ${list(A.wi, A.rMin)}</p>`;
    h += `<div class="eq">ε = (h<sub>max</sub> − h<sub>min</sub>) / 2</div><div class="eq">φ = 90° − (h<sub>max</sub> + h<sub>min</sub>) / 2</div>`;
    if (A.ok) {
      h += `<div class="eq">ε = (${fmtRead(A.hmax)} − ${fmtRead(A.hmin)}) / 2 = <b>${fmtDMS(A.eps)}</b></div>
        <div class="eq">φ = 90° − (${fmtRead(A.hmax)} + ${fmtRead(A.hmin)}) / 2 = <b>${fmtDMS(A.phi)}</b></div>
        <p class="small">ε ni solishtiring: Ulug‘bek natijasi ${fmtDMS(ULUG_EPS)}; simulyatsiya yilidagi (${A.rMax.y}) haqiqiy qiymat ${fmtDMS(A.epsModel)}, farqingiz ${fmtArcDiff(A.eps - A.epsModel)}; bugungi qiymat ≈ 23° 26′. Yer o‘qining og‘ishi asrlar davomida sekin kamayadi.</p>
        <p class="small">φ ni solishtiring: rasadxona kengligi (zamonaviy xarita bo‘yicha) ≈ ${fmtDMS(LAT)}, farqingiz ${fmt(Math.abs(A.phi - LAT) * 60, 1)}′.${A.refr ? ' Nur sinishi yoqilgan kuzatishlar bor: ufqqa yaqin Quyosh balandroq ko‘ringani uchun φ va ε biroz kichikroq chiqadi.' : ''}</p>
        <div class="btn-row"><button class="btn btn-sm" type="button" id="uSaveA" ${savedA(A) ? 'disabled' : ''}>${savedA(A) ? 'A natija saqlangan' : 'A natijani saqlash'}</button></div>`;
    } else {
      h += `<p class="small muted">Yozgi (iyun) va qishki (dekabr) Quyosh turishi atrofida o‘lchang. Eng katta va eng kichik tush balandligi shu yerda avtomatik tanlanadi.</p>`;
    }
    ui.calcA.innerHTML = h;
    const b = $('#uSaveA', ui.calcA);
    if (b) b.addEventListener('click', () => {
      if (savedA(A)) return;
      S.res.push({ id: Date.now() + Math.random(), type: 'A', hmax: A.hmax, hmin: A.hmin, phi: A.phi, eps: A.eps, epsModel: A.epsModel, year: A.rMax.y, refr: !!A.refr });
      store.set(KEY_RES, S.res); Sound.play('chime'); renderAll();
    });
  }

  /* ---------- B vazifa ---------- */
  function findEq(Y) {
    const p = phiStu();
    const rs = S.rows.filter(r => r.y === Y && (r.m === 3 || (r.m === 4 && r.d <= 5) || (r.m === 2 && r.d >= 25)));
    if (p === null) return { ok: false, rs, why: 'phi' };
    const ds = rs.map(r => ({ r, dl: (r.h - (90 - p)) * 60 }));
    for (let i = 0; i + 1 < ds.length; i++) {
      const a = ds[i], b = ds[i + 1];
      if (a.dl < 0 && b.dl >= 0 && b.r.jd - a.r.jd <= 1.5) {
        const f = -a.dl / (b.dl - a.dl), t = a.r.jd + (b.r.jd - a.r.jd) * f;
        const rate = (b.dl - a.dl) / (b.r.jd - a.r.jd);
        return { ok: true, rs, a, b, f, t, rate, hrs: (b.r.jd - a.r.jd) * 24 * f };
      }
    }
    let why = 'none';
    if (ds.length) why = ds.every(x => x.dl < 0) ? 'neg' : ds.every(x => x.dl >= 0) ? 'pos' : 'gap';
    return { ok: false, rs, ds, why };
  }
  function eqText(Y, E) {
    if (E.ok) {
      const c1 = E.a.r, c2 = E.b.r, local = 12 + E.hrs;
      const c = calOf(jdOf(c1.y, c1.m, c1.d) + (local >= 24 ? 1 : 0) + 0.5);
      return `<div class="eq">${Y}: δ₁ = ${fmtMin(E.a.dl)} (${c1.d}-mart tushi), δ₂ = ${fmtMin(E.b.dl)} (${c2.d}-mart tushi)</div>
        <div class="eq">t = t₁ + ${fmt((E.b.r.jd - E.a.r.jd) * 24, 2)} soat · ${fmt(-E.a.dl, 1)} / ${fmt(E.b.dl - E.a.dl, 1)} = t₁ + ${fmtHM(E.hrs)}</div>
        <p class="small">Tengkunlik: <b>${fmtDate(c.y, c.m, c.d)}, mahalliy quyosh vaqti bilan ≈ ${clock(local)}</b> (${c1.d}-mart tushidan ${fmtHM(E.hrs)} keyin).</p>`;
    }
    const hint = {
      phi: 'Avval A vazifada φ ni toping: δ = h − (90° − φ) shunga bog‘liq.',
      none: `${Y}-yil mart oyida kuzatish yo‘q. Shu yilning 19-martiga o‘ting.`,
      neg: 'Hamma δ hali manfiy: keyingi kunlarni o‘lchang.',
      pos: 'Hamma δ musbat: oldingi kunlarni o‘lchang.',
      gap: 'δ ishorasi o‘zgargan, lekin kunlar ketma-ket emas: oradagi kunni ham o‘lchang.'
    }[E.why];
    return `<p class="small"><b>${Y}-yil:</b> ${hint}</p>`;
  }
  function taskB() {
    const Y = S.bY, Yk = S.bY + S.k, E1 = findEq(Y), E2 = findEq(Yk);
    if (!(E1.ok && E2.ok)) return { Y, Yk, E1, E2, ok: false };
    const dt = E2.t - E1.t, T = dt / S.k, Tm = (eqModel(Yk) - eqModel(Y)) / S.k;
    if (!(S.k >= 1 && Number.isFinite(T) && T > 300 && T < 400)) return { Y, Yk, E1, E2, ok: false };
    return { Y, Yk, E1, E2, ok: true, dt, T, Tm };
  }
  const savedB = B => S.res.some(r => r.type === 'B' && r.Y === B.Y && r.k === S.k && Math.abs(r.T - B.T) < 1e-9);
  const savedA = A => S.res.some(r => r.type === 'A' && r.hmax === A.hmax && r.hmin === A.hmin && !!r.refr === !!A.refr);
  function renderCalcB() {
    const B = taskB();
    let h = '<div class="eq">t = t₁ + (t₂ − t₁) · (0 − δ₁) / (δ₂ − δ₁),   δ = h − (90° − φ)</div>' + eqText(B.Y, B.E1) + eqText(B.Yk, B.E2);
    if (B.ok) {
      const dTm = (B.T - MODERN_TROP) * 86400, dU = (B.T - ULUG_TROP) * 86400, dM = (B.T - B.Tm) * 86400;
      const rate = (B.E1.rate + B.E2.rate) / 2, shift = 1440 / rate; // 1′ xato necha daqiqaga siljitadi
      h += `<div class="eq">T = (t<sub>${B.Yk}</sub> − t<sub>${B.Y}</sub>) / k = ${fmt(B.dt, 4)} kun / ${S.k} = <b>${fmt(B.T, 5)} kun</b></div>
        <p class="small"><b>Yil uzunligi: ${fmtYearLen(B.T)}</b>. Zamonaviy tropik yil 365 kun 5 soat 48 daqiqa 45 soniya (farq ${fmtSecs(dTm)}); Ulug‘bek: 365 kun 5 soat 49 daqiqa 15 soniya (farq ${fmtSecs(dU)}); simulyatsiyada shu yillar uchun aniq oraliq ${fmtYearLen(B.Tm)} (farq ${fmtSecs(dM)}).</p>
        <p class="small ub-sens">Sezgirlik: δ kuniga ≈ ${fmt(rate, 1)}′ o‘zgaradi, shuning uchun h ni 1′ xato o‘qish bitta tengkunlikni ≈ ${fmt(shift, 0)} daqiqaga siljitadi. k = ${S.k} yilga bo‘linganda yil uzunligidagi xato ≈ ${fmt(shift / S.k, 1)} daqiqagacha kamayadi. φ dagi doimiy xato ikkala tengkunlikni bir xil siljitadi va ayirmada qisqarib ketadi.</p>
        <div class="btn-row"><button class="btn btn-sm" type="button" id="uSaveB" ${savedB(B) ? 'disabled' : ''}>${savedB(B) ? 'B natija saqlangan' : 'B natijani saqlash'}</button></div>`;
    } else if (B.E1.ok || B.E2.ok) {
      const E = B.E1.ok ? B.E1 : B.E2, shift = 1440 / E.rate;
      h += `<p class="small ub-sens">Sezgirlik: δ kuniga ≈ ${fmt(E.rate, 1)}′ o‘zgaradi: 1′ o‘qish xatosi tengkunlikni ≈ ${fmt(shift, 0)} daqiqaga siljitadi. Shuning uchun ikkinchi tengkunlik uzoqroq yilda (katta k) olinadi.</p>`;
    }
    ui.calcB.innerHTML = h;
    const b = $('#uSaveB', ui.calcB);
    if (b) b.addEventListener('click', () => {
      if (savedB(B) || !B.ok) return;
      S.res.push({ id: Date.now() + Math.random(), type: 'B', Y: B.Y, k: S.k, T: B.T, Tm: B.Tm, t1: B.E1.t, t2: B.E2.t });
      store.set(KEY_RES, S.res); Sound.play('chime'); renderAll();
    });
  }

  /* ---------- Jadvallar ---------- */
  function renderLog() {
    ui.log.innerHTML = S.rows.length ? S.rows.map((r, i) => {
      const dl = deltaOf(r);
      return `<tr><td>${i + 1}</td><td class="txt">${fmtDate(r.y, r.m, r.d)}</td><td>${fmtRead(r.h)}</td><td>${dl === null ? '—' : fmtDMS(dl, true)}</td><td class="txt">${r.refr ? 'bor' : 'yo‘q'}</td>
        <td><button class="del" data-del="${r.id}" aria-label="${i + 1}-yozuvni o‘chirish">×</button></td></tr>`;
    }).join('') : '<tr><td colspan="6" class="empty">Jurnal bo‘sh. Sanani tanlab, tushni kuzating va h ni yozing.</td></tr>';
  }
  function renderRes() {
    ui.res.innerHTML = S.res.length ? S.res.map((r, i) => {
      if (r.type === 'A') return `<tr><td>${i + 1}</td><td class="txt">Kenglik va ekliptika og‘ishi</td><td class="txt">h<sub>max</sub> = ${fmtRead(r.hmax)}, h<sub>min</sub> = ${fmtRead(r.hmin)}${r.refr ? ' (nur sinishi bilan)' : ''}</td>
        <td>φ = ${fmtDMS(r.phi)}<br>ε = ${fmtDMS(r.eps)}</td><td class="txt">ε: Ulug‘bek ${fmtDMS(ULUG_EPS)}, ${r.year}-yil modeli ${fmtDMS(r.epsModel)}<br>φ: haqiqiy ≈ ${fmtDMS(LAT)}</td>
        <td><button class="del" data-del="${r.id}" aria-label="${i + 1}-natijani o‘chirish">×</button></td></tr>`;
      return `<tr><td>${i + 1}</td><td class="txt">Yil uzunligi</td><td class="txt">${r.Y} → ${r.Y + r.k}-yil, k = ${r.k}</td>
        <td>${fmtYearLen(r.T)}</td><td class="txt">zamonaviydan ${fmtSecs((r.T - MODERN_TROP) * 86400)}, Ulug‘bekdan ${fmtSecs((r.T - ULUG_TROP) * 86400)}</td>
        <td><button class="del" data-del="${r.id}" aria-label="${i + 1}-natijani o‘chirish">×</button></td></tr>`;
    }).join('') : '<tr><td colspan="6" class="empty">Hali natija yo‘q. “A natijani saqlash” yoki “B natijani saqlash”ni bosing.</td></tr>';
    const A = S.res.filter(r => r.type === 'A').pop(), B = S.res.filter(r => r.type === 'B').pop();
    const cls = (v, g, w) => !Number.isFinite(v) ? '' : v < g ? 'good' : v < w ? 'warn' : 'bad';
    const eE = A ? Math.abs(A.eps - A.epsModel) * 60 : NaN, eP = A ? Math.abs(A.phi - LAT) * 60 : NaN, eT = B ? Math.abs(B.T - MODERN_TROP) * 1440 : NaN;
    ui.summary.innerHTML = `
      <div class="stat ${cls(eP, 1, 3)}"><div class="lbl">Kenglik φ</div><div class="val">${A ? fmtDMS(A.phi) : '—'}</div><div class="sub">${A ? 'haqiqiydan ' + fmt(eP, 1) + '′ farq' : 'A vazifa'}</div></div>
      <div class="stat ${cls(eE, 1, 3)}"><div class="lbl">Yer o‘qining og‘ishi ε</div><div class="val">${A ? fmtDMS(A.eps) : '—'}</div><div class="sub">Ulug‘bek: ${fmtDMS(ULUG_EPS)}</div></div>
      <div class="stat ${cls(eT, 2, 10)}"><div class="lbl">Yil uzunligi</div><div class="val">${B ? fmt(B.T, 4) : '—'}</div><div class="sub">${B ? 'kun · zamonaviydan ' + fmtSecs((B.T - MODERN_TROP) * 86400) : 'B vazifa, kun'}</div></div>
      <div class="stat"><div class="lbl">Jurnalda kuzatishlar</div><div class="val">${S.rows.length}</div><div class="sub">${new Set(S.rows.map(r => r.y)).size} xil yil</div></div>`;
  }
  ui.log.addEventListener('click', e => { const b = e.target.closest('[data-del]'); if (!b) return; S.rows = S.rows.filter(r => String(r.id) !== b.dataset.del); store.set(KEY, S.rows); renderAll(); });
  ui.res.addEventListener('click', e => { const b = e.target.closest('[data-del]'); if (!b) return; S.res = S.res.filter(r => String(r.id) !== b.dataset.del); store.set(KEY_RES, S.res); renderAll(); });
  confirmButton(el('uClearLog'), 'Jurnalni tozalash', 'Ha, tozalansin', () => { S.rows = []; store.set(KEY, S.rows); renderAll(); });
  confirmButton(el('uClearRes'), 'Natijalarni tozalash', 'Ha, tozalansin', () => { S.res = []; store.set(KEY_RES, S.res); renderAll(); });

  function updateSteps() {
    if (S.rows.length) steps.mark('first');
    const near = (m, a, b) => S.rows.filter(r => r.m === m && r.d >= a && r.d <= b).length >= 2;
    if (near(6, 16, 26)) steps.mark('summer');
    if (near(12, 16, 26)) steps.mark('winter');
    if (S.res.some(r => r.type === 'A')) steps.mark('taskA');
    for (let y = Y0; y <= Y1; y++) if (findEq(y).ok) { steps.mark('equinox'); break; }
    if (S.res.some(r => r.type === 'B')) steps.mark('taskB');
    if (S.res.some(r => r.type === 'B' && r.k >= 10 && Math.abs(r.T - MODERN_TROP) * 1440 < 2)) steps.mark('bonus');
  }
  function renderAll() { renderLog(); renderRes(); renderCalcA(); renderCalcB(); updateSteps(); syncAll(); syncChartText(); drawChart(); }

  /* ---------- Chizish yordamchilari ---------- */
  const cv = setupCanvas(el('uCanvas'), () => drawMain());

  function fonts() { FONT = getComputedStyle(document.body).fontFamily; MONO = css('font-mono') || 'monospace'; }

  /* ---------- Asosiy sahna: meridian kesimi ---------- */
  function geomMain() {
    const { w, h } = cv;
    const r = Math.min((w - 40) / 1.32, (h - 34) / 1.38);
    const ox = (w - 1.3 * r) / 2 + 0.98 * r, oy = 22 + 0.36 * r;
    return { w, h, r, ox, oy, gy: oy + 0.4 * r, P: a => ({ x: ox - r * Math.cos(a * D2R), y: oy + r * Math.sin(a * D2R) }) };
  }
  function drawMain() {
    const { ctx, w, h } = cv; if (!w) return;
    fonts();
    const g = geomMain(), p = pal(), { r, ox, oy, gy } = g, small = w < 560;
    ctx.clearRect(0, 0, w, h);
    // osmon
    const sky = ctx.createLinearGradient(0, 0, 0, gy); sky.addColorStop(0, p.skyTop); sky.addColorStop(1, p.skyBot);
    ctx.fillStyle = sky; ctx.fillRect(0, 0, w, gy + 1);
    // tuproq va xandaq
    const sg = ctx.createLinearGradient(0, gy, 0, h); sg.addColorStop(0, p.soil); sg.addColorStop(1, p.soilDeep);
    ctx.fillStyle = sg; ctx.fillRect(0, gy, w, h - gy);
    const aG = Math.asin(clamp((gy - oy) / r, -1, 1)) / D2R;   // yoy yer sathini kesadigan burchak

    ctx.arc(ox, oy, r - 32, Math.PI - 84 * D2R, Math.PI - aG * D2R, false); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = alpha(p.wallEdge, 0.5); ctx.lineWidth = 1; ctx.stroke();
    // bino (yer ustidagi qism)
    const bx0 = ox - 1.04 * r, bx1 = ox + 0.07 * r, by0 = oy - 0.1 * r;
    ctx.fillStyle = p.inside; ctx.fillRect(bx0, by0, bx1 - bx0, gy - by0);
    ctx.fillStyle = p.wall;
    const wt = Math.max(6, 0.035 * r);
    ctx.fillRect(bx0, by0, wt, gy - by0);                                  // shimoliy devor
    ctx.fillRect(bx1 - wt, by0, wt, oy - 7 - by0);                          // janubiy devor (tuynukgacha)
    ctx.fillRect(bx1 - wt, oy + 7, wt, gy - oy - 7);                        // tuynukdan pastda
    ctx.fillRect(bx0, by0, bx1 - bx0, wt);                                  // tom
    ctx.fillStyle = p.tile; ctx.fillRect(bx0, by0 - 8, bx1 - bx0, 8);       // koshinli hoshiya
    ctx.fillStyle = p.tileDot; for (let x = bx0 + 6; x < bx1 - 3; x += 12) { ctx.beginPath(); ctx.arc(x, by0 - 4, 1.6, 0, TAU); ctx.fill(); }
    // orqa devordagi ravoqlar (bezak) va qavatlar
    {
      const ix0 = bx0 + wt + 6, ix1 = bx1 - wt - 6, fl = [by0 + wt, by0 + wt + (gy - by0 - wt) / 3, by0 + wt + 2 * (gy - by0 - wt) / 3, gy];
      ctx.strokeStyle = alpha(p.wallEdge, C.dark ? 0.35 : 0.22); ctx.lineWidth = 1;
      for (let f = 1; f < 3; f++) { ctx.beginPath(); ctx.moveTo(ix0 - 6, fl[f]); ctx.lineTo(ix1 + 6, fl[f]); ctx.stroke(); }
      const aw = Math.max(14, 0.075 * r);
      for (let f = 0; f < 3; f++) {
        const yt = fl[f] + 6, yb = fl[f + 1] - 3, fh = yb - yt;
        if (fh < 12) continue;
        for (let x = ix0; x + aw <= ix1; x += aw * 1.45) {
          const sh = Math.min(aw * 0.55, fh * 0.45);
          ctx.beginPath(); ctx.moveTo(x, yb); ctx.lineTo(x, yt + sh); ctx.quadraticCurveTo(x, yt, x + aw / 2, yt); ctx.quadraticCurveTo(x + aw, yt, x + aw, yt + sh); ctx.lineTo(x + aw, yb); ctx.stroke();
        }
      }
    }
    ctx.strokeStyle = p.wallEdge; ctx.lineWidth = 1; ctx.strokeRect(bx0 + 0.5, by0 - 8 + 0.5, bx1 - bx0 - 1, gy - by0 + 8);
    ctx.beginPath(); ctx.moveTo(0, gy + 0.5); ctx.lineTo(w, gy + 0.5); ctx.strokeStyle = p.wallEdge; ctx.stroke();
    // yoy: marmar sirt (r − 18 … r + 2), bo‘linmalar shu sirtda
    const A0 = Math.PI - 18 * D2R, A1 = Math.PI - 82 * D2R;
    ctx.lineWidth = 20; ctx.strokeStyle = p.marble;
    ctx.beginPath(); ctx.arc(ox, oy, r - 8, A0, A1, true); ctx.stroke();
    ctx.lineWidth = 1.2; ctx.strokeStyle = p.wallEdge;
    ctx.beginPath(); ctx.arc(ox, oy, r + 2, A0, A1, true); ctx.stroke();
    ctx.beginPath(); ctx.arc(ox, oy, r - 18, A0, A1, true); ctx.stroke();
    ctx.strokeStyle = C.dark ? mix(C.hist, C.bg, 0.2) : C.hist;
    for (let a = 20; a <= 80; a++) {
      const L = a % 10 === 0 ? 15 : a % 5 === 0 ? 10 : 5, c = Math.cos(a * D2R), s = Math.sin(a * D2R);
      ctx.lineWidth = a % 5 === 0 ? 1.4 : 0.9;
      ctx.beginPath(); ctx.moveTo(ox - (r + 1) * c, oy + (r + 1) * s); ctx.lineTo(ox - (r + 1 - L) * c, oy + (r + 1 - L) * s); ctx.stroke();
    }
    ctx.font = '600 ' + (small ? 10.5 : 12) + 'px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let a = 20; a <= 80; a += 10) {
      const c = Math.cos(a * D2R), s = Math.sin(a * D2R), x = ox - (r - 34) * c, y = oy + (r - 34) * s;
      ctx.fillStyle = alpha(C.surface, 0.75); roundRect(ctx, x - 14, y - 9, 28, 18, 5); ctx.fill();
      ctx.fillStyle = C.ink; ctx.fillText(a + '°', x, y + 0.5);
    }
    // kuzatilgan qiymatlar (shu yil)
    S.rows.filter(rw => rw.y === S.y).slice(-24).forEach(rw => {
      const c = Math.cos(rw.h * D2R), s = Math.sin(rw.h * D2R);
      ctx.fillStyle = alpha(C.phys, 0.85); ctx.beginPath(); ctx.arc(ox - (r - 23) * c, oy + (r - 23) * s, 2.6, 0, TAU); ctx.fill();
    });
    // ko‘rsatkich
    {
      const a = S.ptr / 60, c = Math.cos(a * D2R), s = Math.sin(a * D2R), good = atNoon() && Math.abs(offMin()) <= TOL;
      const x = ox - (r + 3) * c, y = oy + (r + 3) * s, nx = -c, ny = s;   // tashqaridan yoyga qaragan uchburchak
      ctx.fillStyle = good ? C.good : C.gold; ctx.strokeStyle = alpha(C.dark ? C.bg : C.ink, 0.7); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + nx * 14 - ny * 7, y + ny * 14 + nx * 7); ctx.lineTo(x + nx * 14 + ny * 7, y + ny * 14 - nx * 7); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    // Quyosh va nur
    const o = S.obs || noonAlt(S.y, S.m, S.d, S.refr);
    const hh = o.h, sc = Math.cos(hh * D2R), ss = Math.sin(hh * D2R);
    const sunD = 0.33 * r, sx = ox + sunD * sc, sy = oy - sunD * ss, Pp = { x: ox - (r - 8) * sc, y: oy + (r - 8) * ss };
    const lit = S.obs ? (S.obs.phase === 'noon' ? 1 : 1 - Math.min(1, Math.abs(S.obs.x)) * 0.85) : 0;
    // gorizontal va h burchagi
    ctx.strokeStyle = alpha(C.ink, 0.45); ctx.setLineDash([5, 5]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(Math.min(w - 8, ox + 0.42 * r), oy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox, Math.max(6, oy - 0.36 * r)); ctx.stroke(); ctx.setLineDash([]);
    ctx.font = '11px ' + FONT; ctx.fillStyle = C['ink-2']; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    ctx.textAlign = 'right'; ctx.fillText('zenit', ox - 4, Math.max(16, oy - 0.36 * r + 12));
    if (S.obs) {
      ctx.strokeStyle = alpha(C.gold, 0.3 + 0.5 * lit); ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(Pp.x, Pp.y); ctx.stroke(); ctx.lineCap = 'butt';
      ctx.strokeStyle = alpha(C['lapis-ink'], 0.5 + 0.4 * lit); ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(Pp.x, Pp.y); ctx.stroke();
      glow(ctx, Pp.x, Pp.y, 18 + 10 * lit, 0.5 + 0.5 * lit);
    }
    ctx.strokeStyle = C.hist; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(ox, oy, 0.17 * r, -hh * D2R, 0); ctx.stroke();
    ctx.font = '600 13px ' + FONT; ctx.fillStyle = C.hist; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    const la = -hh * D2R / 2;
    ctx.fillText('h', ox + 0.2 * r * Math.cos(la) + 2, oy + 0.2 * r * Math.sin(la));
    glow(ctx, sx, sy, 30, C.dark ? 0.55 : 0.8);
    ctx.fillStyle = C.gold; ctx.beginPath(); ctx.arc(sx, sy, small ? 9 : 11, 0, TAU); ctx.fill();
    ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(ox, oy, 2.4, 0, TAU); ctx.fill();
    // yozuvlar

    pill(ctx, w, 'Tuynuk (yoy markazi)', ox + 10, oy + 16, { size: fs });
    pill(ctx, w, 'Yer sathi', w - 8, gy + 14, { align: 'right', size: fs - 0.5, color: C['ink-2'] });
    const mA = 62, mc = Math.cos(mA * D2R), ms = Math.sin(mA * D2R);

    pill(ctx, w, 'Meridian yoyi, R ≈ 40 m', ox - r * 0.5, by0 - 22, { align: 'center', size: fs, bold: true });
    ctx.font = '600 12px ' + FONT; ctx.fillStyle = C['ink-2']; ctx.textBaseline = 'bottom';

  /* ---------- Kattalashtirilgan shkala ---------- */
  function scaleGeom() {
    const { w, h } = cvS; const gut = 52, wall = 9;
    return { w, h, gut, wall, x0: gut + wall, x1: w - wall - 4, cy: h / 2, k: (h / 2 - 8) / VIEW };
  }
  function drawScale() {
    const { ctx, w, h } = cvS; if (!w) return;
    fonts();
    const p = pal(), g = scaleGeom(), { x0, x1, cy, k } = g, cx = (x0 + x1) / 2;
    ctx.clearRect(0, 0, w, h);
    // kanal (yoy sirti) va devorlar
    ctx.fillStyle = mix(p.chan, C.dark ? C.bg : C.ink, 0.25); roundRect(ctx, 0, 0, w, h, 10); ctx.fill();
    ctx.fillStyle = p.chan; ctx.fillRect(x0, 0, x1 - x0, h);
    ctx.fillStyle = mix(C.hist, p.chan, 0.45); ctx.fillRect(x0 - g.wall, 0, g.wall, h); ctx.fillRect(x1, 0, g.wall, h);
    // bo‘linmalar
    const P = S.ptr, lo = Math.ceil(P - VIEW - 1), hi = Math.floor(P + VIEW + 1);
    ctx.font = '10.5px ' + MONO; ctx.textBaseline = 'middle';
    for (let m = lo; m <= hi; m++) {

      if (deg) { ctx.strokeStyle = alpha(p.chanInk, 0.18); ctx.beginPath(); ctx.moveTo(x0 + L, y); ctx.lineTo(x1 - L, y); ctx.stroke(); }
      if (ten) {
        ctx.fillStyle = deg ? C.gold : alpha(p.chanInk, 0.85); ctx.textAlign = 'right';
        ctx.font = (deg ? '600 12px ' : '10.5px ') + MONO;
        ctx.fillText(deg ? Math.round(m / 60) + '°' : (((m % 60) + 60) % 60) + '′', g.gut - 6, y);
      }
    }

      const sy = cy - (S.obs.h * 60 - P) * k, rad = S.obs.sd * k, travel = (x1 - x0) / 2 + rad;
      const sx = cx + S.obs.x * travel;
      ctx.save(); ctx.beginPath(); ctx.rect(x0, 0, x1 - x0, h); ctx.clip();
      const gg = ctx.createRadialGradient(sx, sy, 0, sx, sy, rad * 1.18);

    ctx.strokeStyle = alpha(C.surface, 0.5); ctx.lineWidth = 3.4; ctx.beginPath(); ctx.moveTo(x0, cy); ctx.lineTo(x1, cy); ctx.stroke();
    ctx.strokeStyle = col; ctx.lineWidth = good ? 2 : 1.5; ctx.beginPath(); ctx.moveTo(x0, cy); ctx.lineTo(x1, cy); ctx.stroke();
    ctx.setLineDash([6, 4]); ctx.lineWidth = 1.3;
    [-BR, BR].forEach(b => { const y = cy - b * k; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke(); });
    ctx.setLineDash([]);
    ctx.fillStyle = col;
    [x0, x1].forEach((x, i) => { const s = i ? -1 : 1; ctx.beginPath(); ctx.moveTo(x, cy - 6); ctx.lineTo(x + s * 9, cy); ctx.lineTo(x, cy + 6); ctx.closePath(); ctx.fill(); });

      ctx.fillStyle = C.ink; ctx.font = '600 12px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(up ? '↑ tasvir yuqorida' : '↓ tasvir pastda', cx, ay + 0.5);

  /* ---------- Grafiklar ---------- */
  function axes(c, o) {
    const { ctx, w, h } = c;
    const m = { l: o.ml || 56, r: o.mr || 14, t: 16, b: 44 }, pw = w - m.l - m.r, ph = h - m.t - m.b;
    const X = v => m.l + (v - o.x0) / (o.x1 - o.x0) * pw, Y = v => m.t + ph - (v - o.y0) / (o.y1 - o.y0) * ph;
    ctx.font = '12px ' + FONT; ctx.lineWidth = 1; ctx.strokeStyle = C.line; ctx.fillStyle = C['ink-3'];
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    o.xt.forEach(([v, lab]) => { ctx.globalAlpha = 0.55; ctx.beginPath(); ctx.moveTo(X(v), m.t); ctx.lineTo(X(v), m.t + ph); ctx.stroke(); ctx.globalAlpha = 1; if (lab) ctx.fillText(lab, X(v), m.t + ph + 6); });
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';

      ctx.globalAlpha = v === 0 ? 1 : 0.55; ctx.beginPath(); ctx.moveTo(m.l, Y(v)); ctx.lineTo(m.l + pw, Y(v)); ctx.stroke(); ctx.globalAlpha = 1;
      ctx.fillText(o.yf(v), m.l - 8, Y(v));
    }
    ctx.strokeStyle = C['ink-3']; ctx.beginPath(); ctx.moveTo(m.l, m.t); ctx.lineTo(m.l, m.t + ph); ctx.lineTo(m.l + pw, m.t + ph); ctx.stroke();
    ctx.fillStyle = C['ink-2']; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.fillText(o.xLabel, m.l + pw, h - 4);
    ctx.save(); ctx.translate(14, m.t); ctx.rotate(-Math.PI / 2); ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillText(o.yLabel, 0, 0); ctx.restore();
    return { X, Y, m, pw, ph };
  }
  const doy = r => r.jd - jdOf(r.y, 1, 1) + 1;
  function drawChart() {
    const { ctx, w, h } = cvC; if (!w) return;
    fonts(); ctx.clearRect(0, 0, w, h);
    if (S.chart === 'h') drawChartH(ctx, w, h); else drawChartEq(ctx, w, h);
  }
  function drawChartH(ctx, w, h) {
    const narrow = w < 560;
    const mStart = [1, 32, 60, 91, 121, 152, 182, 213, 244, 274, 305, 335];
    const xt = mStart.map((d, i) => [d, (!narrow || i % 2 === 0) ? MON3[i] : '']).concat([[366, '']]);
    const A = axes(cvC, { x0: 1, x1: 366, xt, y0: 20, y1: 80, ys: 10, yf: v => v + '°', xLabel: 'Yil kuni', yLabel: 'Tush balandligi h' });
    const ph = phiStu(), resA = S.res.filter(r => r.type === 'A').pop();
    if (resA) {
      // model egri chizig‘i (A vazifadan keyin ko‘rsatiladi)
      ctx.strokeStyle = alpha(C['ink-3'], 0.8); ctx.setLineDash([4, 4]); ctx.lineWidth = 1.2; ctx.beginPath();
      for (let d = 1; d <= 365; d += 3) { const c = calOf(jdOf(S.y, 1, 1) + d - 1 + 0.5), v = noonAlt(c.y, c.m, c.d, false).h; d === 1 ? ctx.moveTo(A.X(d), A.Y(v)) : ctx.lineTo(A.X(d), A.Y(v)); }
      ctx.stroke(); ctx.setLineDash([]);
    }
    if (ph !== null) {
      const ye = 90 - ph;
      ctx.strokeStyle = C.chem; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(A.m.l, A.Y(ye)); ctx.lineTo(A.m.l + A.pw, A.Y(ye)); ctx.stroke();
      ctx.fillStyle = C.chem; ctx.font = '600 12px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      ctx.fillText(`90° − φ = ${fmtDMS(ye)} (osmon ekvatori)`, A.m.l + 8, A.Y(ye) - 4);
      if (resA) {
        ctx.strokeStyle = alpha(C.hist, 0.8); ctx.setLineDash([2, 4]);

    }
    S.rows.forEach(r => {

  function drawChartEq(ctx, w, h) {
    const x0 = 15, x1 = 27, Ys = [S.bY, S.bY + S.k], ph = phiStu();
    const xt = []; for (let d = x0; d <= x1; d++) xt.push([d, (w >= 560 || (d - x0) % 3 === 0) ? String(d) : '']);
    let ext = 60;
    if (ph !== null) S.rows.forEach(r => { if (r.m === 3 && r.d >= x0 && r.d < x1) ext = Math.max(ext, Math.abs((r.h - (90 - ph)) * 60) * 1.15); });
    const ys = niceStep(ext, 3); ext = Math.ceil(ext / ys) * ys;
    const A = axes(cvC, { x0, x1, y0: -ext, y1: ext, ys, xt, ml: 64, yf: v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v) + '′', xLabel: 'mart kuni (tush paytlari)', yLabel: 'δ, minut', mr: 20 });
    if (ph === null) {

      ctx.fillText('δ ni hisoblash uchun', A.m.l + A.pw / 2, A.m.t + A.ph / 2 - 34);

    }
    ctx.strokeStyle = C['ink-2']; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(A.m.l, A.Y(0)); ctx.lineTo(A.m.l + A.pw, A.Y(0)); ctx.stroke();
    const colOf = y => y === Ys[0] ? C.hist : y === Ys[1] ? C.phys : C.metal;
    const xs = r => r.jd - jdOf(r.y, 3, 0);
    S.rows.filter(r => r.m === 3).forEach(r => {
      const dl = (r.h - (90 - ph)) * 60, xv = xs(r); if (Math.abs(dl) > ext || xv < x0 || xv > x1) return;
      ctx.beginPath(); ctx.arc(A.X(xv), A.Y(dl), 4.5, 0, TAU); ctx.fillStyle = colOf(r.y); ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = C.surface; ctx.stroke();
    });
    Ys.forEach((Y, i) => {
      const E = findEq(Y); if (!E.ok) return;
      const xa = xs(E.a.r), xb = xs(E.b.r), xe = E.t - jdOf(Y, 3, 0);
      ctx.strokeStyle = colOf(Y); ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(A.X(xa), A.Y(E.a.dl)); ctx.lineTo(A.X(xb), A.Y(E.b.dl)); ctx.stroke();
      ctx.fillStyle = colOf(Y); ctx.beginPath(); ctx.moveTo(A.X(xe), A.Y(0) - 6); ctx.lineTo(A.X(xe) + 5, A.Y(0)); ctx.lineTo(A.X(xe), A.Y(0) + 6); ctx.lineTo(A.X(xe) - 5, A.Y(0)); ctx.closePath(); ctx.fill();
      // natija yozuvi grafikning chap yuqori burchagida (nuqtalar bilan to‘qnashmasligi uchun)
      const c1 = E.a.r, loc = 12 + E.hrs, c = calOf(jdOf(c1.y, c1.m, c1.d) + (loc >= 24 ? 1 : 0) + 0.5);
      ctx.font = '600 ' + (w < 560 ? 11 : 12) + 'px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText(`${Y}: ${c.d}-mart, ≈ ${clock(loc)}`, A.m.l + 8, A.m.t + 6 + i * 18);

  panels.tarix.innerHTML = `<div class="theory-grid">
    <div class="prose">
      <h2 style="margin-top:0">Mirzo Ulug‘bek va Samarqand rasadxonasi</h2>
      <p>Mirzo Ulug‘bek (1394–1449) — Samarqand hukmdori va buyuk astronom. Samarqanddagi rasadxona 1424–1429-yillarda qurilgan. Ulug‘bek vafotidan keyin, 1449-yildan so‘ng, rasadxona vayron qilingan. Uning qoldiqlarini 1908-yilda arxeolog V. L. Vyatkin topgan.</p>
      <p>Rasadxonada tuzilgan “Ziji Sultoniy” (“Ziji Ko‘ragoniy”) asarida taxminan 1 018 yulduzni o‘z ichiga olgan katalog bor (1437).</p>

      <h2>Faxriy sekstant qanday ishlagan</h2>
      <figure class="ub-fig">${svgSextant()}<figcaption>Tuynukdan o‘tgan Quyosh nuri darajalangan yoyga tasvir tushiradi. Yoy markazi tuynukda bo‘lgani uchun tasvir tushgan joydagi shkala ko‘rsatkichi Quyosh balandligi h ga teng.</figcaption></figure>
      <p>Faxriy sekstant meridian bo‘ylab joylashtirilgan ulkan yoy bo‘lgan: radiusi qariyb 40 m, pastki qismi chuqur xandaqda. Shkalada 1° taxminan 70 sm ga to‘g‘ri kelgan, shuning uchun minutlarni (1′ ≈ 11,7 mm) ham o‘qish mumkin bo‘lgan.</p>
      <p>Yoyning markazidagi tuynukdan o‘tgan Quyosh nuri darajalangan yoyda tasvir hosil qilgan. Tasvir ikki devor orasidan taxminan 4 daqiqada o‘tgan: shu vaqt ichida uning markazi qaysi bo‘linmaga to‘g‘ri kelishini belgilash kerak bo‘lgan. Simulyatsiyada bu o‘tish tezlashtirilgan va tasvir tush paytida (meridianda) to‘xtatiladi, o‘qish ramkasi esa tasvir markazini topishni osonlashtiradi.</p>

      <p>Tush paytida Quyosh meridianda bo‘ladi va uning balandligi h = 90° − φ + δ. Bu yerda φ — joyning geografik kengligi, δ — Quyoshning og‘ishi, ya’ni deklinatsiyasi (osmon ekvatoridan burchak masofasi). δ yil davomida −ε dan +ε gacha o‘zgaradi, ε — Yer o‘qining og‘ishi (ekliptikaning og‘ishi).</p>

      <p>Quyosh turishi kunlarida tush balandligi juda sekin o‘zgaradi: bir necha kun ketma-ket o‘lchab, eng katta va eng kichik qiymatni olish yetarli.</p>

      <h2>Yil uzunligi: kun-tun tengliklari orasidagi vaqt</h2>
      <p>Bahorgi kun-tun tengligi (tengkunlik) paytida Quyosh osmon ekvatorini kesib o‘tadi: δ = 0. Uning atrofida δ kuniga taxminan 24′ ga o‘zgaradi. Ketma-ket ikki tushda δ₁ &lt; 0 va δ₂ &gt; 0 bo‘lsa, tengkunlik momenti chiziqli interpolatsiya bilan topiladi:</p>
      <div class="eq">t = t₁ + (t₂ − t₁) · (0 − δ₁) / (δ₂ − δ₁)</div>
      <p>Y-yil va (Y + k)-yil tengkunliklari orasidagi vaqtni k ga bo‘lsak, yil uzunligi chiqadi. h ni 1′ xato o‘qish bitta tengkunlikni taxminan 1 soatga siljitadi, lekin k yilga bo‘linganda bu xato k marta kamayadi. φ dagi doimiy xato esa ikkala tengkunlikni bir xil siljitadi va ayirmada qisqarib ketadi.</p>
      <p class="note">Bahorgi tengkunliklar orasidagi oraliq o‘rtacha tropik yildan bir necha o‘n soniyaga farq qilishi mumkin, chunki Yer orbitasi elliptik. Bir yillik oraliq esa Yer o‘qining kichik tebranishi (nutatsiya) tufayli bir-ikki daqiqaga o‘zgarib turadi: ko‘p yillik o‘rtacha barqarorroq.</p>

      <h2>Tropik yil va yulduz yili</h2>

      <div class="table-wrap"><table class="kv-table" style="min-width:480px">

      <p class="small muted">Og‘ish xatosi zamonaviy usulda o‘sha davr uchun qayta hisoblangan qiymatga nisbatan. Zamonaviy tropik yil: 365 kun 5 soat 48 daqiqa 45 soniya.</p>

      <h2>Nur sinishi va taqvim haqida</h2>
      <p>Atmosfera nurni sindiradi va Quyosh biroz balandroq ko‘rinadi: 27° balandlikda taxminan 2′, 74° da taxminan 0,3′. Shuning uchun nur sinishi hisobga olinmasa, φ va ε taxminan 1′ ga kichik chiqadi. Simulyatsiyada bu ta’sirni yoqib-o‘chirish mumkin.</p>
      <p class="note">Simulyatsiyada Quyosh holati zamonaviy formulalar bilan (J. Meeus usuli) hisoblanadi. Sanalar proleptik Grigoriy taqvimida berilgan, ya’ni bugungi taqvim o‘tmishga davom ettirilgan. Vaqt mahalliy quyosh vaqti bilan ko‘rsatiladi. Rasadxona 1449-yilgacha ishlagani uchun kuzatishlar 1437–1449-yillar bilan cheklangan.</p>
    </div>
    <div class="formulas">
      <div class="formula"><span>h = 90° − φ + δ</span><span class="cap">Tush paytidagi Quyosh balandligi</span></div>
      <div class="formula"><span>ε = <span class="frac"><span>h<sub>max</sub> − h<sub>min</sub></span><span>2</span></span></span><span class="cap">Yer o‘qining og‘ishi</span></div>
      <div class="formula"><span>φ = 90° − <span class="frac"><span>h<sub>max</sub> + h<sub>min</sub></span><span>2</span></span></span><span class="cap">Geografik kenglik</span></div>
      <div class="formula"><span>δ = h − (90° − φ)</span><span class="cap">Quyoshning og‘ishi (deklinatsiya)</span></div>
