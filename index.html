    const dv = Math.acos(1 / (1 + e)), T = { x: Ox + R * Math.sin(dv), y: Oy - R * Math.cos(dv) };
    const a = 0.2, pts = [];

    const L = 380, fx = Sx + Math.cos(dv) * L, fy = Sy + Math.sin(dv) * L;

    const p1 = [T.x - q * u1[0], T.y - q * u1[1]], p2 = [p1[0] + q * u2[0], p1[1] + q * u2[1]], p3 = [T.x + q * u2[0], T.y + q * u2[1]];

      <path d="M${f(T.x)} ${f(T.y)}L${f(fx)} ${f(fy)}" stroke="var(--hist)" stroke-width="1.6" stroke-dasharray="5 5" opacity=".6"/>
      <path d="M${f(p1[0])} ${f(p1[1])}L${f(p2[0])} ${f(p2[1])}L${f(p3[0])} ${f(p3[1])}" fill="none" stroke="var(--ink-2)" stroke-width="1.3"/>
      <path d="M${Sx + 56} ${f(Sy)} A56 56 0 0 1 ${f(Sx + 56 * Math.cos(dv))} ${f(Sy + 56 * Math.sin(dv))}" fill="none" stroke="var(--hist)" stroke-width="2"/>
      <path d="M${Ox} ${Oy - 34} A34 34 0 0 1 ${f(Ox + 34 * Math.sin(dv))} ${f(Oy - 34 * Math.cos(dv))}" fill="none" stroke="var(--hist)" stroke-width="2"/>
      <circle cx="${Ox}" cy="${Oy}" r="3.5" fill="var(--ink)"/><circle cx="${Sx}" cy="${f(Sy)}" r="4" fill="var(--hist)"/><circle cx="${f(T.x)}" cy="${f(T.y)}" r="3.5" fill="var(--ink)"/>
      <g font-weight="700">
        <text x="${f(Sx + 70 * Math.cos(dv / 2))}" y="${f(Sy + 70 * Math.sin(dv / 2) + 5)}" fill="var(--hist)">δ</text>
        <text x="${f(Ox + 46 * Math.sin(dv / 2) - 3)}" y="${f(Oy - 46 * Math.cos(dv / 2) + 4)}" fill="var(--hist)">δ</text>
        <text x="${Sx - 10}" y="${f(Sy - 8)}" text-anchor="end" fill="var(--ink)">S</text>
        <text x="${f(T.x + 10)}" y="${f(T.y - 8)}" fill="var(--ink)">T</text>
        <text x="${Ox + 10}" y="${Oy + 5}" fill="var(--ink)">O</text>
        <text x="${f((Ox + T.x) / 2 + 12)}" y="${f((Oy + T.y) / 2 + 12)}" fill="var(--ink)">R</text>

  panels.tarix.innerHTML = `<div class="theory-grid">
    <div class="prose">
      <h2 style="margin-top:0">Abu Rayhon Beruniy</h2>
      <p>Abu Rayhon Beruniy (973–1048) — qomusiy olim: astronom, matematik va geograf. U Xorazmdagi Kat shahrida (hozirgi Qoraqalpog‘iston Respublikasidagi Beruniy shahri hududi) tug‘ilgan, Xorazmda va G‘aznada ishlagan.</p>
      <p>Taxminan 1020-yillarda Beruniy Nandana qal’asida (hozirgi Pokistondagi Pind Dadan Xon tumani) Yer radiusini yangi usul bilan o‘lchadi. Unga ikki uzoq shahar orasidagi masofa kerak bo‘lmadi: bitta tepalik, usturlob va geometriya yetarli bo‘ldi. Usul ikki qadamdan iborat.</p>

      <h2>1-qadam. Tepalik balandligini tekislikdan o‘lchash</h2>
      <figure class="br-fig">${svgPlain()}<figcaption>A va B nuqtalardan cho‘qqi S ga qaralgan balandlik burchaklari α va β. C — cho‘qqi ostidagi nuqta.</figcaption></figure>
      <p>Tepalikka chiqmasdan uning balandligini topish mumkin. Kuzatuvchi tekislikdagi A nuqtadan usturlob alidadasini (ko‘zlash chizg‘ichini) cho‘qqiga qaratib, balandlik burchagi α ni o‘lchaydi. So‘ng tepalikdan uzoqlashib, A dan masofasi ma’lum d bo‘lgan B nuqtadan β burchakni o‘lchaydi. A dan C gacha masofa x noma’lum, lekin ikkita to‘g‘ri burchakli uchburchakdan:</p>
      <div class="eq">tg α = h / x,   tg β = h / (x + d)</div>
      <p>Birinchisidan x = h / tg α, ikkinchisidan x + d = h / tg β. Ayirsak, d = h · (1/tg β − 1/tg α), bundan:</p>

      <p>δ juda kichik burchak, shuning uchun 1 − cos δ ≈ δ²/2 (δ radianda) va R ≈ 2h/δ². Beruniy cho‘qqidan δ = 34′ ni o‘lchagan.</p>
      <p class="note">Usturlob halqasidan osib qo‘yiladi va og‘irlik kuchi ta’sirida tik turadi. Shuning uchun uning gorizontal diametri gorizontal yo‘nalishni ko‘rsatadi va ufqning pastga og‘ishini shu chiziqdan o‘lchash mumkin. Nishonga alidadaning ikki uchidagi ko‘zlash teshikchalari orqali qaralgan: XI asrda teleskop bo‘lmagan. Simulyatsiyadagi kattalashtirilgan “ko‘rish trubkasi” faqat o‘lchashni qulay qilish uchun qo‘shilgan.</p>

      <h2>Beruniy natijasi</h2>
      <p>Beruniy hisobida Yer radiusi <b>12 803 337 tirsak</b> chiqdi. Tirsakning uzunligiga qarab bu taxminan 6 300–6 400 km ga teng; zamonaviy qayta hisoblardan biri taxminan 6 323 km beradi. Bugungi o‘rtacha radius — 6 371 km.</p>

      <h2>Nega natija farq qilishi mumkin: nur sinishi</h2>
      <p>Havo zichligi balandlik ortishi bilan kamaygani uchun ufqdan kelayotgan nur atmosferada to‘g‘ri chiziq bo‘ylab emas, Yer tomonga biroz egilib tarqaladi. Natijada ufq haqiqiy o‘rnidan yuqoriroq ko‘rinadi va ko‘rinma og‘ish kichrayadi: δ′ ≈ δ · √(1 − k), bunda k ≈ 0,13. Masalan, 310 m balandlikdan geometrik og‘ish 33,9′ bo‘lsa, ko‘rinma og‘ish taxminan 31,6′ ga tushadi.</p>
      <p>R ~ 1/δ² bo‘lgani uchun natija taxminan 1/(1 − k) ≈ 1,15 marta, ya’ni 15% ga katta chiqadi. Beruniy nur sinishini hisobga olmagan, bu usulning aniqligini cheklaydi.</p>

      <h2>Eratosfen usuli bilan solishtirish</h2>
      <div class="table-wrap"><table class="kv-table" style="min-width:520px">
        <thead><tr><th></th><th>Eratosfen</th><th>Beruniy</th></tr></thead>

      </table></div>
      <p class="note">Simulyatsiyada tepalik balandligi 310 m olingan: R = 6 371 km bo‘lsa, bunday balandlikdan ufq nur sinishisiz ≈ 34′ ga og‘adi — bu Beruniy o‘lchagan burchakka mos keladi. Beruniy o‘lchagan tepalikning haqiqiy balandligi bu yerda keltirilmagan.</p>
    </div>
    <div class="formulas">

    const yy = Math.max(y, L.coneTopY), h = L.yb - yy, r1 = L.Rb, rr = rAt(yy);
    let v = Math.PI / 3 * h * (r1 * r1 + r1 * rr + rr * rr);
    if (y < L.coneTopY) v += Math.PI * L.rn * L.rn * (L.coneTopY - y);
    return v;
  }
  function yForFrac(L, f) {
    const tot = volTo(L, L.spoutY); let lo = L.spoutY, hi = L.yb;
    for (let i = 0; i < 28; i++) { const mid = (lo + hi) / 2; if (volTo(L, mid) / tot > f) lo = mid; else hi = mid; }
    return (lo + hi) / 2;
  }
  function levelY() {
    if (A.level <= 0) return null;
    let y = A.level >= 1 ? G.L.spoutY : yForFrac(G.L, A.level);
    if (A.surge0 > 0) y -= A.surge0 * Math.exp(-(now - A.surgeT0) / A.surgeTau);
    return y;
  }
  const specSize = k => clamp(11 + 6 * Math.cbrt(volOf(k)), 14, 28);
  const cupWater = m => Math.pow(clamp(m / 60, 0, 1), 0.55);

  /* ---------- Tarozi ---------- */
  function beamA() {
    if (B.load) {
      if (REDUCED) return 0;
      const t = now - B.t0, a0 = 0.17;
      if (t < 0.3) return a0 * ease(t / 0.3);
      const u = t - 0.3; return a0 * Math.exp(-u / 0.42) * Math.cos(TAU * u / 0.85);
    }
    const u = now - B.relT0; return REDUCED || u > 2 ? 0 : B.relA * Math.exp(-u / 0.12);
  }
  const settled = () => !!B.load && (REDUCED || now - B.t0 >= 1.7);
  function load(kind, mass) { B.load = kind; B.t0 = now; B.mass = mass; B.reading = r2(mass); Sound.play('clack'); }
  function unload() { if (!B.load) return; B.relA = beamA(); B.relT0 = now; B.load = null; }
  function panPos(side) {
    const b = G.L.bal, r = -beamA();
    const hx = b.px + side * b.beamL * Math.cos(r), hy = b.py + side * b.beamL * Math.sin(r);
    return { hx, hy, x: hx, y: hy + b.hang };
  }
  function weightSet(m) {
    const big = [], small = [];
    let r = Math.floor(m + 1e-6);
    [100, 50, 20, 20, 10, 5, 2, 2, 1].forEach(g => { if (r >= g) { big.push(g); r -= g; } });
    let f = Math.round((m - Math.floor(m + 1e-6)) * 100);
    [50, 20, 20, 10, 5, 2, 2, 1].forEach(g => { if (f >= g) { small.push(g); f -= g; } });
    return { big, small };
  }

  /* ---------- Ob'ektlar joylashuvi ---------- */
  function anchor(o, name) {
    const L = G.L;
    if (name === 'pan') { const p = panPos(-1); return { x: p.x, y: p.y + 5 }; }
    if (o === spec) {
      if (name === 'above') return { x: L.vx, y: L.neckTopY - 22 };
      if (name === 'vessel') return { x: L.vx, y: L.yb };
      return { x: L.specX, y: L.specY };
    }
    return { x: L.cupX, y: L.tableY - 5 };
  }
  function specPos() {
    if (spec.fall) return { x: G.L.vx, y: spec.fall.y };
    const a = spec.anim;
    if (a) {
      const e = ease(clamp((now - a.t0) / Math.max(1e-6, a.dur), 0, 1)), to = anchor(spec, a.to);
      return { x: a.from.x + (to.x - a.from.x) * e, y: a.from.y + (to.y - a.from.y) * e - a.arc * 4 * e * (1 - e) };
    }
    return anchor(spec, spec.at);
  }
  function moveSpec(to, dur, arc) {
    spec.anim = { from: specPos(), to, t0: now, dur: REDUCED ? 0 : dur, arc: arc || 60 };
    return until(() => !spec.anim);
  }
  function moveCup(to) { // kosacha: so'nib yo'qoladi va yangi joyda paydo bo'ladi
    cup.anim = { from: cup.at, to, t0: now, dur: REDUCED ? 0 : 0.6 };
    return until(() => !cup.anim);
  }
  function updateAnims() {
    if (spec.anim && now - spec.anim.t0 >= spec.anim.dur) { spec.at = spec.anim.to; spec.anim = null; }
    if (cup.anim && now - cup.anim.t0 >= cup.anim.dur) { cup.at = cup.anim.to; cup.appear = now; cup.anim = null; }
  }

  /* ---------- Suv: to'ldirish, siqib chiqarish, tomchilar ---------- */
  function updateFill() {
    if (!A.fill) return;
    const u = A.fill.dur ? (now - A.fill.t0) / A.fill.dur : 1;
    A.level = clamp(u, 0, 1);
    if (u >= 1) { A.level = 1; A.fill = null; }
  }
  function splashNow() {
    const L = G.L, V = volOf(S.key);
    Sound.play('drop', { pitch: clamp(1.15 - V / 140, 0.75, 1.15) });
    const dur = REDUCED ? 0 : clamp(1.0 + V * 0.04, 1.2, 3.4);
    const trap = rnd(0.18, 0.42);
    A.flow = { t0: now, dur, total: Math.max(0, V * RHO_W + A.noise - trap), trap, got: 0, rate: 1 };
    A.surge0 = clamp(3 + V * 0.22, 3, 14); A.surgeT0 = now; A.surgeTau = Math.max(0.12, dur / 4.6);
    A.lupa = true;
    if (!REDUCED) for (let i = 0; i < 10; i++) splash.push({ x: L.vx + rnd(-9, 9), y: L.spoutY - 2, vx: rnd(-45, 45), vy: rnd(-250, -110), y0: L.spoutY });
    if (dur > 0) Sound.play('pour', { dur, vol: 0.5 });
  }
  function updateFall() {
    const f = spec.fall; if (!f) return;
    const L = G.L;
    if (REDUCED) { splashNow(); spec.fall = null; spec.at = 'vessel'; return; }
    if (f.phase === 0) {
      const t = now - f.t0; f.y = f.y0 + 0.5 * 1400 * t * t;
      const yw = levelY();
      if (yw !== null && f.y >= yw + 2) { f.phase = 1; f.t1 = now; f.ys = f.y; splashNow(); }
      else if (f.y >= L.yb) { f.y = L.yb; spec.fall = null; spec.at = 'vessel'; }
    } else {
      const u = clamp((now - f.t1) / 0.6, 0, 1);
      f.y = f.ys + (L.yb - f.ys) * (1 - Math.pow(1 - u, 2));
      if (u >= 1) { spec.fall = null; spec.at = 'vessel'; }
    }
  }
  function updateFlow() {
    const f = A.flow; if (!f) return;
    const u = f.dur ? (now - f.t0) / f.dur : 1, N = 1 - Math.exp(-4.6);

    const g = f.total * (1 - Math.exp(-4.6 * u)) / N;
    A.collected += g - f.got; f.got = g; f.rate = Math.exp(-4.6 * u);
  }
  function cupAtSpout() { return cup.at === 'spout' && !cup.anim; }
  function cupWaterY() { const L = G.L; return L.tableY - 5 - 3 - (L.cupH - 6) * cupWater(A.collected); }
  function spawnDrop(amt, delay) { const L = G.L; drops.push({ t0: now + (REDUCED ? 0 : delay), x: L.tip.x, y: L.tip.y + 2, vx: rnd(4, 14), vy: 0, amt }); }
  function updateParticles(dt) {
    const L = G.L;
    for (let i = drops.length - 1; i >= 0; i--) {
      const d = drops[i]; if (now < d.t0) continue;
      d.vy += 900 * dt; d.x += d.vx * dt; d.y += d.vy * dt;
      const inCup = cupAtSpout() && Math.abs(d.x - L.cupX) < L.cupW / 2 - 4;
      const yEnd = inCup ? cupWaterY() : L.tableY - 6;
      if (REDUCED || d.y >= yEnd) {
        drops.splice(i, 1);
        if (inCup && d.amt > 0) {
          A.collected += d.amt; Sound.play('drop', { vol: 0.3, pitch: 1.7 });
          if (A.dropped && A.trapped <= 0 && !drops.some(x => x.amt > 0)) steps.mark('tap');
        }
      }
    }
    for (let i = splash.length - 1; i >= 0; i--) {
      const p = splash[i]; p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      p.x = clamp(p.x, L.vx - L.rn + 2, L.vx + L.rn - 2);
      if (p.vy > 0 && p.y >= p.y0) splash.splice(i, 1);

  }

  /* ---------- Harakatlar ---------- */
  function say(t) { ui.say.textContent = t; }
  function setBusy(b) { S.busy = b; syncUI(); }
  async function run(fn) {
    if (S.busy) return;
    setBusy(true);
    try { await fn(); } finally { setBusy(false); }
  }
  function nextAct() {
    if (A.rd.m === null) return ['weighS', 'Namunani tortish'];
    if (!A.filled) return ['fill', 'Idishni to‘ldirish'];
    if (A.rd.m1 === null) return ['weighC', 'Bo‘sh kosachani tortish'];
    if (!A.dropped) return ['drop', 'Namunani tushirish'];
    if (A.rd.m2 === null) return ['weighW', 'Suvli kosachani tortish'];
    return ['record', 'Jadvalga yozish'];
  }
  const ACTS = {
    async weighS() {
      say('Namuna tarozining chap pallasiga qo‘yildi. O‘ng pallaga tarozi toshlari qo‘yilmoqda…');
      await moveSpec('pan', 0.7, 80);
      load('spec', massOf(S.key));
      await until(settled);
      A.rd.m = B.reading; steps.mark('weigh');
      say(`Tarozi muvozanatda: namuna massasi m = ${fmt(A.rd.m, 2)} g. Endi idishni suv bilan to‘ldiring.`);
    },
    async fill() {
      if (spec.at === 'pan') { unload(); await moveSpec('table', 0.6, 70); }
      A.noise = rnd(-0.02, 0.02);
      const dur = REDUCED ? 0 : 2.0;
      A.fill = { t0: now, dur };
      if (dur) Sound.play('pour', { dur });
      say('Idishga suv quyilmoqda…');
      await until(() => !A.fill);
      A.overflowUntil = now + (REDUCED ? 0 : 0.9);
      if (!REDUCED) { spawnDrop(0, 0.1); spawnDrop(0, 0.4); spawnDrop(0, 0.75); }
      await until(() => now >= A.overflowUntil && !drops.length);
      A.filled = true;
      say('Idish naycha sathigacha to‘ldi: ortiqcha suv laganga tomchilab tushdi, oqim to‘xtaguncha kutildi va naycha chertib quritildi. Endi bo‘sh kosachani torting.');
    },
    async weighC() {
      if (spec.at === 'pan') { unload(); await moveSpec('table', 0.6, 70); }
      A.collected = 0; cup.at = 'pan'; cup.appear = now;
      await sleep(0.35);
      load('cup', S.cupMass);
      await until(settled);
      A.rd.m1 = B.reading; steps.mark('fill');
      say(`Bo‘sh kosacha: m₁ = ${fmt(A.rd.m1, 2)} g. Endi namunani idishga tushiring, kosacha naycha tagiga qo‘yiladi.`);
    },
    async drop() {
      unload();
      if (cup.at !== 'spout') await moveCup('spout');
      say('Namuna idishning tor bo‘ynidan ehtiyotlik bilan tushirilmoqda…');
      await moveSpec('above', 0.75, 90);
      await sleep(0.15);
      spec.fall = { t0: now, y0: anchor(spec, 'above').y, y: anchor(spec, 'above').y, phase: 0 };
      await until(() => !spec.fall);
      await until(() => !A.flow);
      A.dropped = true; steps.mark('drop');
      say('Siqib chiqarilgan suv naychadan kosachaga oqib tushdi. Lupaga qarang: naycha ichida va uchida suv qolgan.');
    },
    async weighW() {
      await until(() => !drops.some(d => d.amt > 0));
      A.lost = A.trapped;
      await moveCup('pan');
      load('cup', S.cupMass + A.collected);
      await until(settled);
      A.rd.m2 = B.reading;
      say(`Suvli kosacha: m₂ = ${fmt(A.rd.m2, 2)} g, kosachaga tushgan suv ${fmt(r2(A.rd.m2 - A.rd.m1), 2)} g. Natijani jadvalga yozing.`);
    }
  };
  ui.act.addEventListener('click', () => {
    const [a] = nextAct();
    if (a === 'record') { record(); return; }
    run(ACTS[a]);
  });
  function tapEnabled() { return A.filled && !A.flow && !S.busy && A.rd.m2 === null; }
  function doTap() {
    if (!tapEnabled()) return;
    Sound.play('tick'); A.shakeT0 = now;
    if (A.trapped <= 0) { say(A.dropped ? 'Naycha bo‘sh: undan boshqa tomchi tushmadi.' : 'Naychani chertdingiz, lekin unda hozir suv yo‘q.'); return; }
    const first = A.taps === 0, rel = first ? A.trapped * rnd(0.8, 0.92) : A.trapped;
    A.trapped = first ? A.trapped - rel : 0; A.taps++; if (cupAtSpout()) A.tapsCup++;
    const n = clamp(Math.round(rel / 0.07), 1, 5);
    for (let i = 0; i < n; i++) spawnDrop(rel / n, 0.05 + i * 0.13);
    const where = cupAtSpout() ? 'kosachaga' : 'laganga (kosacha naycha tagida emas)';
    say(A.trapped > 0 ? `Naychadan bir necha tomchi ${where} tushdi. Naycha uchida hali kichik tomchi bor: yana bir marta cherting.` : `Naycha bo‘shadi: qolgan suv ${where} tushdi.`);
  }
  ui.tap.addEventListener('click', doTap);

  function record() {
    const r = A.rd;
    if (r.m === null || r.m1 === null || r.m2 === null) { ui.msg.className = 'msg err'; ui.msg.textContent = 'Avval namunani, bo‘sh kosachani va suvli kosachani torting.'; return; }
    const msuv = r2(r.m2 - r.m1);
    if (!(msuv > 0)) { ui.msg.className = 'msg err'; ui.msg.textContent = 'Kosachaga suv tushmagan: tajribani qaytadan boshlang.'; return; }
    const V = msuv / RHO_W, rho = r.m / V, d = r.m / msuv;
    const ref = S.key === 'toj' ? null : SAMPLES[S.key].rho;
    const err = ref ? Math.abs(rho - ref) / ref * 100 : null;
    const full = !(A.lost > 0.001), tapped = full || A.tapsCup > 0;
    rows.push({ id: Date.now() + Math.random(), s: S.key, crown: S.key === 'toj' ? crown.id : null, m: r.m, m1: r.m1, m2: r.m2, msuv, V, rho, d, ref, err, tapped, full });
    store.set(RKEY, rows);
    steps.mark('record');
    let t = `Yozildi: V = ${fmt(V, 2)} sm³, ρ = ${fmt(rho, 2)} g/sm³` + (ref ? `, xatolik ${fmt(err, 1)}%.` : '.');
    const warn = !full && (err === null || err > 1.5);
    if (warn) t += tapped ? ' Naycha uchida tomchi qolib ketgan edi: uni ham kosachaga tushirish uchun naychani yana bir marta chertish kerak edi.' : ' Naychada suv qolib ketgan edi, shuning uchun hajm kichik, zichlik esa katta chiqdi. Keyingi safar naychani cherting.';
    ui.msg.className = 'msg ' + (warn ? 'err' : 'ok'); ui.msg.textContent = t;
    resetA(); renderRows(); renderCrown(); syncUI();
    say('Idish bo‘shatildi, namuna va kosacha olindi. Keyingi o‘lchashni boshlang yoki boshqa namuna tanlang.');
  }
  ui.rec.addEventListener('click', record);

  /* ---------- Namuna tanlash ---------- */
  function renderSample() {
    const s = SAMPLES[S.key], c = s.col;
    ui.sw.style.background = `linear-gradient(135deg, ${c[2]}, ${c[1]} 48%, ${c[0]})`;
    ui.name.textContent = s.name; ui.info.textContent = s.info;
    ui.ref.textContent = S.key === 'toj' ? 'noma’lum' : (s.approx ? '≈ ' : '') + fmt(s.rho, 2) + ' g/sm³';
    ui.sel.value = S.key;
  }
  function selectSample(k, quiet) {
    S.key = k; resetA(); renderSample(); syncUI();
    if (!quiet) say(`Namuna: ${SAMPLES[k].name}. Uni tarozida torting.`);
  }
  ui.sel.addEventListener('change', () => { if (!S.busy) selectSample(ui.sel.value); else ui.sel.value = S.key; });
  ui.nw.addEventListener('click', () => {
    if (S.busy || S.key === 'toj') return;
    newMass(S.key); resetA(); syncUI(); ui.msg.textContent = '';
    say(`Yangi ${SAMPLES[S.key].name.toLowerCase()} bo‘lagi olindi: uning massasi boshqacha. Tajribani boshidan boshlang.`);
  });
  ui.reset.addEventListener('click', () => { if (S.busy) return; resetA(); syncUI(); say('Tajriba qaytadan boshlandi: idish bo‘sh, namuna stol ustida.'); });

  function syncUI() {
    const [, label] = nextAct();
    ui.act.textContent = label; ui.act.disabled = S.busy;
    ui.tap.disabled = !tapEnabled();
    ui.sel.disabled = S.busy; ui.reset.disabled = S.busy; ui.nw.disabled = S.busy || S.key === 'toj';
    const r = A.rd, g = v => v === null ? '—' : fmt(v, 2) + ' g';
    ui.M.textContent = g(r.m); ui.M1.textContent = g(r.m1); ui.M2.textContent = g(r.m2);
    if (r.m !== null && r.m1 !== null && r.m2 !== null && r.m2 - r.m1 > 0) {
      const ms = r2(r.m2 - r.m1), V = ms / RHO_W;
      ui.Ms.textContent = fmt(ms, 2) + ' g'; ui.V.textContent = fmt(V, 2) + ' sm³'; ui.Rho.textContent = fmt(r.m / V, 2) + ' g/sm³';
    } else { ui.Ms.textContent = '—'; ui.V.textContent = '—'; ui.Rho.textContent = '—'; }
    ui.rec.disabled = S.busy || r.m2 === null;
    ui.cPick.disabled = S.busy || S.key === 'toj';
  }
  let lcdText = '';
  function lcd() {
    const t = B.load ? (settled() ? fmt(B.reading, 2) + ' g' : '· · ·') : '0,00 g';
    if (t !== lcdText) { lcdText = t; ui.lcd.textContent = t; }
  }

  /* ---------- Chizish ---------- */
  const cv = setupCanvas(ui.canvas, () => draw());
  const cvC = setupCanvas(ui.chart, () => drawChart());
  refreshTok();

  function brassH(ctx, x0, x1) {
    const g = ctx.createLinearGradient(x0, 0, x1, 0);
    g.addColorStop(0, T.brassD); g.addColorStop(0.28, T.brass); g.addColorStop(0.42, T.brassL); g.addColorStop(0.62, T.brass); g.addColorStop(1, T.brassD);
    return g;
  }
  function brassV(ctx, y0, y1) {
    const g = ctx.createLinearGradient(0, y0, 0, y1);
    g.addColorStop(0, T.brassL); g.addColorStop(0.45, T.brass); g.addColorStop(1, T.brassD);
    return g;
  }
  function polyS(ctx, x, yb, s, pts) { ctx.beginPath(); pts.forEach((p, i) => { const X = x + p[0] * s, Y = yb + p[1] * s; if (i) ctx.lineTo(X, Y); else ctx.moveTo(X, Y); }); ctx.closePath(); }
  function drawSpec(ctx, key, x, yb, s) {
    const c = SAMPLES[key].col, sh = SAMPLES[key].shape;
    const lin = (x0, y0, x1, y1) => { const g = ctx.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, c[2]); g.addColorStop(0.45, c[1]); g.addColorStop(1, c[0]); return g; };
    const facets = segs => { ctx.save(); ctx.globalAlpha *= 0.55; ctx.strokeStyle = c[2]; ctx.lineWidth = 0.8; ctx.beginPath(); segs.forEach(sg => { ctx.moveTo(x + sg[0] * s, yb + sg[1] * s); for (let i = 2; i < sg.length; i += 2) ctx.lineTo(x + sg[i] * s, yb + sg[i + 1] * s); }); ctx.stroke(); ctx.restore(); };
    ctx.save(); ctx.lineJoin = 'round'; ctx.lineWidth = 1;
    if (sh === 'ingot') {
      polyS(ctx, x, yb, s, [[-0.575, 0], [0.575, 0], [0.4, -0.6], [-0.4, -0.6]]);
      ctx.fillStyle = lin(x - 0.5 * s, yb - 0.6 * s, x + 0.35 * s, yb); ctx.fill(); ctx.strokeStyle = c[0]; ctx.stroke();
      facets([[-0.37, -0.56, 0.37, -0.56]]);
    } else if (sh === 'ruby') {
      polyS(ctx, x, yb, s, [[-0.42, 0], [0.42, 0], [0.54, -0.5], [0.36, -0.95], [-0.36, -0.95], [-0.54, -0.5]]);
      ctx.fillStyle = lin(x - 0.5 * s, yb - s, x + 0.5 * s, yb); ctx.fill(); ctx.strokeStyle = c[0]; ctx.stroke();
      facets([[-0.36, -0.95, 0, -0.58, 0.36, -0.95], [-0.54, -0.5, 0, -0.58, 0.54, -0.5], [0, -0.58, 0, 0]]);
    } else if (sh === 'prism') {
      polyS(ctx, x, yb, s, [[-0.31, 0], [0.31, 0], [0.31, -0.8], [0.19, -0.95], [-0.19, -0.95], [-0.31, -0.8]]);
      ctx.fillStyle = lin(x - 0.3 * s, yb - s, x + 0.3 * s, yb); ctx.fill(); ctx.strokeStyle = c[0]; ctx.stroke();
      facets([[-0.1, -0.02, -0.1, -0.93], [0.1, -0.02, 0.1, -0.93]]);
    } else if (sh === 'quartz') {
      polyS(ctx, x, yb, s, [[-0.27, 0], [0.27, 0], [0.27, -0.6], [0, -1], [-0.27, -0.6]]);
      ctx.globalAlpha *= 0.85; ctx.fillStyle = lin(x - 0.3 * s, yb - s, x + 0.3 * s, yb); ctx.fill(); ctx.globalAlpha /= 0.85;
      ctx.strokeStyle = c[0]; ctx.stroke();
      ctx.save(); ctx.strokeStyle = c[0]; ctx.globalAlpha *= 0.6; ctx.lineWidth = 0.8; ctx.beginPath();
      ctx.moveTo(x - 0.27 * s, yb - 0.6 * s); ctx.lineTo(x, yb - 0.68 * s); ctx.lineTo(x + 0.27 * s, yb - 0.6 * s); ctx.moveTo(x, yb - 0.68 * s); ctx.lineTo(x, yb); ctx.stroke(); ctx.restore();
    } else if (sh === 'pearl') {
      const r = s * 0.42, cy = yb - r;
      const g = ctx.createRadialGradient(x - r * 0.35, cy - r * 0.4, r * 0.1, x, cy, r);

    keys.forEach((k, i) => {

      ctx.strokeStyle = P.line; ctx.globalAlpha = 0.6; ctx.beginPath(); ctx.moveTo(m.l, yc + 0.5); ctx.lineTo(m.l + pw, yc + 0.5); ctx.stroke(); ctx.globalAlpha = 1;

        ctx.fillStyle = P['ink-3']; ctx.font = '11px ' + font; ctx.textAlign = 'center';

      <p>Naycha tor bo‘yinga o‘rnatilgani uchun o‘lchash aniqroq bo‘ladi: tor bo‘yinda suv sathining kichik o‘zgarishiga juda kichik hajm to‘g‘ri keladi, shuning uchun idish har safar deyarli bir xil hajmgacha to‘ladi.</p>

      <h2>Zichlik va nisbiy zichlik</h2>
      <p>Moddaning <b>zichligi</b> uning hajm birligidagi massasidir: ρ = m / V. Suvning zichligi 1 g/sm³ bo‘lgani uchun 1 g suv 1 sm³ hajmni egallaydi: kosachaga tushgan suvning grammlardagi massasi son jihatdan jism hajmiga (sm³ da) teng.</p>
      <p>Beruniy o‘lchagan kattalik bugungi fizikada <b>nisbiy zichlik</b> deyiladi: jism massasining shu hajmdagi suv massasiga nisbati, d = m / m<sub>suv</sub>. Bu o‘lchamsiz son va u g/sm³ da ifodalangan zichlikka son jihatdan teng. Tarixiy adabiyotda Beruniyning bu nisbati “solishtirma og‘irlik” deb ataladi. Fizika darsligidagi solishtirma og‘irlik esa boshqa kattalik: og‘irlikning hajmga nisbati P/V, birligi N/m³.</p>
      <p class="note">Birliklar: 1 g/sm³ = 1000 kg/m³. Masalan, oltinning zichligi 19,32 g/sm³ = 19 320 kg/m³.</p>
      <h2>Arximed va oltin toj</h2>
      <p>Suyuqlikka to‘liq botirilgan jism o‘z hajmiga teng hajmdagi suyuqlikni siqib chiqaradi. <b>Arximed qonuniga</b> ko‘ra, bunday jismga siqib chiqarilgan suyuqlik og‘irligiga teng itarib chiqaruvchi kuch (Arximed kuchi) ta’sir qiladi. Beruniy idishi ham siqib chiqarilgan suv hodisasiga asoslangan.</p>
      <p>Rivoyatga ko‘ra, Sirakuza hukmdori Giyeron II Arximeddan zargar yasagan toj sof oltindanmi yoki unga kumush qo‘shilganmi, shuni tojni buzmasdan aniqlashni so‘ragan. Arximed vannaga tushganda suv ko‘tarilganini ko‘rib, jism hajmini siqib chiqarilgan suv orqali o‘lchash mumkinligini tushungan va “Evrika!” (“Topdim!”) deb xitob qilgan.</p>
      <h2>Qotishmadagi oltin ulushini topish</h2>
      <p>Oltin va kumush qotishmasida hajmlar qo‘shiladi: V = V<sub>Au</sub> + V<sub>Ag</sub>. Massasi m bo‘lgan qotishmada oltinning massa ulushi x bo‘lsa, m/ρ = x·m/ρ<sub>Au</sub> + (1 − x)·m/ρ<sub>Ag</sub>. Ikkala tomonni m ga bo‘lsak, “Formulalar” ustunidagi tenglama hosil bo‘ladi.</p>
      <p>Zichlikni oltin va kumush zichliklari orasida oddiy proporsiya bilan bo‘lish xato natija beradi. Masalan, ρ = 15,0 g/sm³ bo‘lsa, to‘g‘ri hisob x ≈ 66% beradi, “oddiy proporsiya” esa 51%.</p>
      <p>Zargarlikda oltin miqdori karatda ham ifodalanadi: sof oltin 24 karat, 75% oltinli qotishma 18 karat.</p>
      <h2>Beruniy idishi va piknometr</h2>
      <p>Beruniy idishi bugungi <b>piknometr</b>ning (zichlik shishachasining) ajdodi hisoblanadi. Piknometr — aniq hajmli shisha idish, tiqinida ingichka kapillyar teshik bor. Idish to‘ldirilib tiqin bilan yopilganda ortiqcha suyuqlik kapillyardan chiqib ketadi, shuning uchun idish har safar bir xil hajmgacha to‘ladi. Beruniy idishidagi naycha ham xuddi shu vazifani bajargan.</p>
      <h2>Xatolik manbalari</h2>
      <ul>
        <li>Naychada qolib ketgan suv: hajm kichik, zichlik katta chiqadi.</li>
        <li>Jism sirtiga yopishgan havo pufakchalari qo‘shimcha suv siqib chiqaradi: zichlik kichik chiqadi.</li>
        <li>Kichik namuna oz suv siqib chiqaradi, shuning uchun tarozining 0,01 g aniqligi ham sezilarli nisbiy xatolik beradi.</li>
        <li>Suv harorati: 20 °C da suvning zichligi 0,998 g/sm³, ya’ni 1 dan biroz kichik.</li>
      </ul>
      <p class="note">Simulyatsiyada suv zichligi 1,00 g/sm³ deb olingan. Idishni to‘ldirishdagi kichik farq (±0,02 g) va naychada qoladigan suv (0,2–0,4 g) hisobga olingan, havo pufakchalari hisobga olinmagan.</p>
    </div>
    <div class="formulas">
      <div class="formula"><span>ρ = <span class="frac"><span>m</span><span>V</span></span></span><span class="cap">Zichlik: hajm birligidagi massa</span></div>
      <div class="formula"><span>m<sub>suv</sub> = m₂ − m₁</span><span class="cap">Kosachaga oqib tushgan suv massasi</span></div>
      <div class="formula"><span>V = <span class="frac"><span>m<sub>suv</sub></span><span>ρ<sub>suv</sub></span></span></span><span class="cap">Jism hajmi siqib chiqarilgan suv hajmiga teng</span></div>
      <div class="formula"><span>d = <span class="frac"><span>m</span><span>m<sub>suv</sub></span></span></span><span class="cap">Nisbiy zichlik, o‘lchamsiz (Beruniy nisbati, tarixda “solishtirma og‘irlik”)</span></div>
      <div class="formula"><span><span class="frac"><span>1</span><span>ρ</span></span> = <span class="frac"><span>x</span><span>ρ<sub>Au</sub></span></span> + <span class="frac"><span>1 − x</span><span>ρ<sub>Ag</sub></span></span></span><span class="cap">Oltin–kumush qotishmasi; x — oltinning massa ulushi</span></div>

  const C = {
    sol: 'cucl2', c: 0.5, V: 0.05, I: 1.0, on: false, speed: 60, auto: 600, micro: true,
    rows: store.get('el-elec-rows', []), pred: { cucl2: { k: '', a: '', saved: false }, ki: { k: '', a: '', saved: false } }, showEq: false,
    log: [], seen: new Set(), lastScale: null
  };
  if (!Array.isArray(C.rows)) C.rows = [];
  function fresh(note) {
    Object.assign(C, {
      t: 0, Q: 0, totalT: 0, totalQ: 0, nCu: 0, nCl2: 0, nH2: 0, nO2: 0, nI2: 0, nOH: 0,
      gasK: 0, gasA: 0, overK: false, overA: false, m1: null, m2: null, lastScale: null,
      cath0: Math.round((14.6 + Math.random() * 0.8) * 1000) / 1000,
      phenol: false, starch: false, paper: null, paperT: 0,
      eta: 0.985 + Math.random() * 0.012
    });
    C.pred.cucl2.evald = C.pred.ki.evald = false;
    C.seen = new Set(); bubbles.length = 0; initMicro();
    if (note) addLog(`Yangi eritma: ${SOL[C.sol].name}, c = ${fmt(C.c, 2)} mol/l, 50 ml. Grafit elektrodlar tozalandi.`);
  }
  const cuConc = () => Math.max(0, C.c * C.V - C.nCu) / C.V;

  /* ---------- Bosqichlar ---------- */
  const steps = makeStepper(el('cSteps'), el('cNext'), [
    { id: 'theory', html: '<button class="linkish" data-goto="nazariya">Nazariya</button> bilan tanishing: katod va anoddagi jarayonlar qoidasi.' },
    { id: 'predict', html: 'Bashorat qiling: CuCl₂ elektrolizida katod va anodda nima ajraladi?' },
    { id: 'm1', html: 'CuCl₂ bilan ishlang: tok o‘tkazishdan oldin katodni tarozida torting (m₁).' },
    { id: 'run', html: 'Tokni ulang (masalan, I = 1 A, 10 daqiqa). Katod va anodni kuzating.' },
    { id: 'paper', html: 'Anodga ho‘llangan yod-kraxmalli qog‘oz tuting: xlor ajralayotganini isbotlang.' },
    { id: 'm2', html: 'Tok uzilgach katodni qayta torting (m₂) va natijani jadvalga yozing.' },
    { id: 'faraday', html: 'Faradey qonunini tekshiring: boshqa I yoki t bilan yana 2 marta o‘lchang (jami 3 qator).' },
    { id: 'ki', html: 'KI eritmasini tanlang, katod tomoniga fenolftalein, anod tomoniga kraxmal qo‘shib elektroliz qiling.' },
    { id: 'F', bonus: true, html: 'Qo‘shimcha: grafikdan Faradey doimiysini 2% aniqlikda toping.' }
  ]);
  root.addEventListener('click', e => { const b = e.target.closest('[data-goto]'); if (b) { showTab(b.dataset.goto); window.scrollTo({ top: 0, behavior: REDUCED ? 'auto' : 'smooth' }); } });

  /* ---------- Kuzatish daftari ---------- */
  function addLog(text) {
    C.log.unshift({ t: C.totalT || 0, text });
    if (C.log.length > 14) C.log.length = 14;
    ui.log.innerHTML = C.log.map(x => `<li><span class="mono">${fmtTime(x.t)}</span><span>${x.text}</span></li>`).join('');
  }
  function once(key, text) { if (!C.seen.has(key)) { C.seen.add(key); addLog(text); } }

  /* ---------- Kimyo hisoblari ---------- */
  function addGas(side, n) {
    const v = n * VM;
    if (side === 'K') { C.gasK += v; if (C.gasK > 100) { C.gasK = 100; C.overK = true; } }
    else { C.gasA += v; if (C.gasA > 100) { C.gasA = 100; C.overA = true; } }
  }
  function advance(dt) {
    if (!C.on || dt <= 0) return;
    let stopAfter = false;
    if (C.auto > 0) { const rem = C.auto - C.t; if (rem <= 1e-9) { setPower(false); return; } if (dt >= rem) { dt = rem; stopAfter = true; } }
    const dq = C.I * dt, ne = dq / F;
    C.t += dt; C.totalT += dt; C.Q += dq; C.totalQ += dq;
    if (C.sol === 'cucl2') {
      const av = Math.max(0, C.c * C.V - C.nCu);
      if (av >= ne / 2) C.nCu += ne / 2;
      else { C.nCu += av; const rest = ne - 2 * av; C.nH2 += rest / 2; C.nOH += rest; addGas('K', rest / 2); }
      const avCl = Math.max(0, 2 * C.c * C.V - 2 * C.nCl2);
      if (avCl >= ne) { C.nCl2 += ne / 2; addGas('A', ne / 2); }
      else { C.nCl2 += avCl / 2; addGas('A', avCl / 2); const rest = ne - avCl; C.nO2 += rest / 4; addGas('A', rest / 4); }
    } else {
      C.nH2 += ne / 2; C.nOH += ne; addGas('K', ne / 2);
      const avI = Math.max(0, C.c * C.V - 2 * C.nI2);
      if (avI >= ne) C.nI2 += ne / 2;
      else { C.nI2 += avI / 2; const rest = ne - avI; C.nO2 += rest / 4; addGas('A', rest / 4); }
    }
    observe();
    if (stopAfter) { setPower(false); addLog(`Taymer: tok avtomatik uzildi. t = ${fmtTime(C.t)}, Q = ${fmtGroup(C.Q, 0)} Kl.`); }
  }
  function observe() {
    const pr = C.pred[C.sol];
    if (pr.saved && !pr.evald && C.totalQ >= 30) { pr.evald = true; renderPredict(); }
    if (C.sol === 'cucl2') {
      if (C.nCu * M_CU > 0.004) once('cu', 'Katod sirtida qizil-qo‘ng‘ir mis qatlami hosil bo‘ldi.');
      if (C.nCl2 * VM > 0.6) once('cl2', 'Anodda gaz pufakchalari ajralmoqda. Yig‘ilgan gaz sarg‘ish-yashil rangli, o‘tkir hidli: bu xlor.');
      if (cuConc() < C.c * 0.8) once('fade', 'Eritmaning rangi ochlashdi: eritmada Cu²⁺ ionlari kamaymoqda.');
      if (cuConc() < 1e-4) once('dep', 'Cu²⁺ ionlari tugadi: endi katodda vodorod ajralmoqda.');
      if (C.Q >= 300) steps.mark('run');
    } else {
      if (C.nH2 * VM > 0.4) once('h2', 'Katodda rangsiz gaz (vodorod) pufakchalari ajralmoqda.');
      if (C.nI2 > 2e-5) once('i2', C.starch ? 'Anod atrofida eritma to‘q ko‘k rangga kirdi: yod kraxmal bilan reaksiyaga kirdi.' : 'Anod atrofida eritma sariq-qo‘ng‘ir tusga kirdi: yod ajralmoqda.');
      if (C.phenol && C.nOH > 1e-5) once('ph', 'Katod atrofida fenolftalein pushti rangga kirdi: muhit ishqoriy, OH⁻ ionlari hosil bo‘lmoqda.');
      if (C.starch && C.nI2 > 2e-5) once('st', 'Kraxmal to‘q ko‘k rangga kirdi: anodda yod ajralgani isbotlandi.');
      if (C.phenol && C.starch && C.totalQ >= 60) steps.mark('ki');
    }
  }
  function psuTone() { if (C.on) Sound.tone('psu', { freq: 100, type: 'sawtooth', gain: 0.01 + 0.006 * C.I, lowpass: 380 }); else Sound.stop('psu'); }
  let lastBubbleSound = 0;
  function setPower(on) {
    if (on !== C.on) Sound.play('clack');
    C.on = on;
    psuTone();
    ui.power.setAttribute('aria-pressed', on ? 'true' : 'false');
    ui.power.textContent = on ? 'Tokni uzish' : 'Tokni ulash';
    ui.weigh.disabled = on;
    if (on) C.m2 = null; // tok qayta ulandi: m₂ qayta o'lchanishi kerak
  }
  ui.power.addEventListener('click', () => {
    if (!C.on) {
      if (C.auto > 0 && C.t >= C.auto - 1e-9) { ui.msg.className = 'msg err'; ui.msg.textContent = 'Taymer vaqti tugagan. Natijani jadvalga yozing yoki taymerni o‘zgartiring.'; return; }
      if (C.sol === 'cucl2' && C.m1 === null) { ui.msg.className = 'msg'; ui.msg.textContent = 'Eslatma: tokdan oldin katodni tortmadingiz (m₁). Faradey qonunini tekshirish uchun m₁ kerak.'; }
      setPower(true);
      once('on-' + C.sol, `Tok ulandi: I = ${fmt(C.I, 2)} A.`);
    } else { setPower(false); addLog(`Tok uzildi. t = ${fmtTime(C.t)}, Q = ${fmtGroup(C.Q, 0)} Kl.`); }
  });

  /* ---------- Tortish va jadval ---------- */
  // eta: elektrodni quritish va yuvishdagi kichik yo'qotishlar (haqiqiy tajribadagidek 0,3–1,5% xatolik)
  function measureMass() { return Math.round((C.cath0 + C.nCu * M_CU * C.eta + (Math.random() - 0.5) * 0.0008) * 1000) / 1000; }
  ui.weigh.addEventListener('click', () => {
    if (C.on) { ui.msg.className = 'msg err'; ui.msg.textContent = 'Avval tokni uzing: elektrodni tok o‘tayotganda olib bo‘lmaydi.'; return; }
    const m = measureMass(); C.lastScale = m; Sound.play('beep');
    if (C.m1 === null || C.Q === 0) {
      if (C.m1 === null && C.Q > 0) { C.t = 0; C.Q = 0; C.gasK = 0; C.gasA = 0; C.overK = C.overA = false; ui.msg.className = 'msg'; ui.msg.textContent = 'm₁ yozildi. Oldingi tok vaqti hisobga olinmaydi, o‘lchash shu yerdan boshlanadi.'; }
      else { ui.msg.className = 'msg ok'; ui.msg.textContent = `m₁ = ${fmt(m, 3)} g. Endi tokni ulang.`; }
      C.m1 = m; C.m2 = null;
      if (C.sol === 'cucl2') steps.mark('m1');
    } else {
      C.m2 = m; ui.msg.className = 'msg ok'; ui.msg.textContent = `m₂ = ${fmt(m, 3)} g, Δm = ${fmt(m - C.m1, 3)} g. “Jadvalga yozish”ni bosing.`;
    }
    syncPanel();
  });
  ui.rec.addEventListener('click', () => {
    if (C.on) { ui.msg.className = 'msg err'; ui.msg.textContent = 'Avval tokni uzing.'; return; }
    if (!(C.Q > 0)) { ui.msg.className = 'msg err'; ui.msg.textContent = 'Hali tok o‘tkazilmadi: tokni ulang va bir necha daqiqa kuting.'; return; }
    const Qt = C.Q, t = C.t, Iavg = Qt / t;
    const VKt = VM * Qt / (2 * F);
    const VK = C.overK ? null : Math.round(C.gasK * 2) / 2, VA = C.overA ? null : Math.round(C.gasA * 2) / 2;
    let row;
    if (C.sol === 'cucl2') {
      if (C.m1 === null || C.m2 === null) { ui.msg.className = 'msg err'; ui.msg.textContent = C.m1 === null ? 'm₁ o‘lchanmagan. Tokdan oldin katodni torting.' : 'm₂ o‘lchanmagan: tokni uzib, katodni qayta torting.'; return; }
      const dm = C.m2 - C.m1, mF = M_CU * Qt / (2 * F);
      row = { sol: 'cucl2', c: C.c, I: Iavg, t, Q: Qt, dm, mF, err: Math.abs(dm - mF) / mF * 100, VK, VA };
      C.m1 = C.m2; C.m2 = null;
    } else {
      row = { sol: 'ki', c: C.c, I: Iavg, t, Q: Qt, dm: null, mF: null, err: VK === null ? null : Math.abs(VK - VKt) / VKt * 100, VK, VA };
    }
    row.id = Date.now() + Math.random(); Sound.play('chime');
    C.rows.push(row); store.set('el-elec-rows', C.rows);
    C.t = 0; C.Q = 0; C.gasK = 0; C.gasA = 0; C.overK = C.overA = false;
    ui.msg.className = 'msg ok'; ui.msg.textContent = 'Jadvalga yozildi. Shprislar bo‘shatildi. Keyingi o‘lchash uchun m₁ = oldingi m₂.';
    renderRows(); syncPanel();
  });

  function renderRows() {
    ui.rows.innerHTML = C.rows.length ? C.rows.map((r, i) => `<tr>
      <td>${i + 1}</td><td class="txt">${SOL[r.sol].name}, ${fmt(r.c, 2)} mol/l</td><td>${fmt(r.I, 2)}</td><td>${fmtTime(r.t)}</td><td>${fmtGroup(r.Q, 0)}</td>
      <td>${r.dm === null ? '—' : fmt(r.dm, 3)}</td><td>${r.mF === null ? '—' : fmt(r.mF, 3)}</td>
      <td><b>${r.err === null ? '—' : fmt(r.err, 1)}</b></td><td>${r.VK === null ? '100+' : fmt(r.VK, 1)}</td><td>${r.VA === null ? '100+' : fmt(r.VA, 1)}</td>
      <td><button class="del" data-del="${r.id}" aria-label="${i + 1}-qatorni o‘chirish">×</button></td></tr>`).join('')
      : `<tr><td colspan="11" class="empty">Hali o‘lchash yo‘q. Katodni torting, tokni ulang, so‘ng qayta tortib “Jadvalga yozish”ni bosing.</td></tr>`;
    const cu = C.rows.filter(r => r.sol === 'cucl2');
    if (cu.length) steps.mark('m2');
    if (cu.length >= 3) steps.mark('faraday');
    const fit = fitF(cu);
    if (fit.ok && Math.abs(fit.F - F) / F < 0.02 && cu.length >= 3) steps.mark('F');
    const avgErr = cu.length ? cu.reduce((a, r) => a + r.err, 0) / cu.length : NaN;
    const eF = fit.ok ? Math.abs(fit.F - F) / F * 100 : NaN;
    const cls = !Number.isFinite(eF) ? '' : eF < 2 ? 'good' : eF < 5 ? 'warn' : 'bad';
    ui.summary.innerHTML = `
      <div class="stat"><div class="lbl">CuCl₂ o‘lchashlari</div><div class="val">${cu.length}</div><div class="sub">o‘rtacha xatolik ${Number.isFinite(avgErr) ? fmt(avgErr, 1) + '%' : '—'}</div></div>
      <div class="stat"><div class="lbl">Elektrokimyoviy ekvivalent, k</div><div class="val">${fit.ok ? fmt(fit.k * 1000, 4) : '—'}</div><div class="sub">mg/Kl</div></div>
      <div class="stat ${cls}"><div class="lbl">Tajribadan F = M/(2k)</div><div class="val">${fit.ok ? fmtGroup(fit.F, 0) : '—'}</div><div class="sub">${fit.ok ? 'Kl/mol, xatolik ' + fmt(eF, 1) + '%' : 'kamida 2 ta CuCl₂ o‘lchashi kerak'}</div></div>
      <div class="stat"><div class="lbl">Jadval qiymati F</div><div class="val">${fmtGroup(F, 0)}</div><div class="sub">Kl/mol</div></div>`;
    drawChart();
  }
  function fitF(rows) {
    if (rows.length < 2) return { ok: false };
    let sxy = 0, sxx = 0; rows.forEach(r => { sxy += r.Q * r.dm; sxx += r.Q * r.Q; });
    const k = sxy / sxx; if (!(k > 0)) return { ok: false };
    return { ok: true, k, F: M_CU / (2 * k) };
  }
  ui.rows.addEventListener('click', e => { const b = e.target.closest('[data-del]'); if (!b) return; C.rows = C.rows.filter(r => String(r.id) !== b.dataset.del); store.set('el-elec-rows', C.rows); renderRows(); });
  confirmButton(el('cClear'), 'Jadvalni tozalash', 'Ha, tozalansin', () => { C.rows = []; store.set('el-elec-rows', C.rows); renderRows(); });

  /* ---------- Bashorat va tenglamalar ---------- */
  function renderPredict() {
    const p = C.pred[C.sol], sol = SOL[C.sol];
    const right = PRED_RIGHT[C.sol];
    const done = p.saved && C.totalQ >= 30;
    const name = (side, v) => (PRED_OPTS[side].find(o => o[0] === v) || ['', '—'])[1];
    ui.predict.innerHTML = `
      <p class="small muted">${sol.name} (${sol.full}) eritmasi elektrolizi. Tokni ulashdan oldin taxmin qiling:</p>
      <label>Katodda (−) nima ajraladi?<select id="pk" ${p.saved ? 'disabled' : ''}>${PRED_OPTS.k.map(o => `<option value="${o[0]}" ${o[0] === p.k ? 'selected' : ''}>${o[1]}</option>`).join('')}</select></label>
      <label>Anodda (+) nima ajraladi?<select id="pa" ${p.saved ? 'disabled' : ''}>${PRED_OPTS.a.map(o => `<option value="${o[0]}" ${o[0] === p.a ? 'selected' : ''}>${o[1]}</option>`).join('')}</select></label>
      ${p.saved ? '' : '<div><button class="btn btn-sm" id="pSave">Bashoratni saqlash</button></div>'}
      ${p.saved && !done ? '<p class="msg">Bashorat saqlandi. Endi tokni ulab, natijani kuzating.</p>' : ''}
      ${done ? `<p class="msg ${p.k === right.k ? 'ok' : 'err'}">Katod: ${p.k === right.k ? 'to‘g‘ri' : 'noto‘g‘ri, aslida ' + name('k', right.k)}.</p>
               <p class="msg ${p.a === right.a ? 'ok' : 'err'}" style="margin-top:0">Anod: ${p.a === right.a ? 'to‘g‘ri' : 'noto‘g‘ri, aslida ' + name('a', right.a)}.</p>` : ''}`;
    const save = $('#pSave', ui.predict);
    if (save) save.addEventListener('click', () => {
      p.k = $('#pk', ui.predict).value; p.a = $('#pa', ui.predict).value;
      if (!p.k || !p.a) { ui.testMsg.className = 'msg err'; ui.testMsg.textContent = ''; save.textContent = 'Ikkala javobni tanlang'; return; }
      p.saved = true; C.showEq = true; steps.mark('predict'); renderPredict(); renderEq();
    });
  }
  function renderEq() {
    const e = EQ[C.sol];
    if (!C.showEq && !C.pred[C.sol].saved) {
      ui.eq.innerHTML = `<p class="small muted">Elektrod tenglamalari bashoratdan keyin ochiladi.</p><button class="btn-ghost btn-sm" id="eqShow" style="margin-top:8px">Hozir ko‘rsatish</button>`;
      $('#eqShow', ui.eq).addEventListener('click', () => { C.showEq = true; renderEq(); });
      return;
    }
    ui.eq.innerHTML = `<div class="eq-panel">
      <div class="eq-row"><span class="who k">Katod (−)</span><span class="eq">${e.k}</span></div>
      <div class="eq-row"><span class="who a">Anod (+)</span><span class="eq">${e.a}</span></div>
      <div class="eq-row"><span class="who">Umumiy</span><span class="eq">${e.s}</span></div>
      <p class="small muted">${C.sol === 'cucl2' ? 'Mis faolligi past metall: Cu²⁺ ionlari katodda qaytariladi. Cl⁻ kislorodsiz kislota qoldig‘i: anodda oksidlanadi.' : 'Kaliy faol metall: K⁺ qaytarilmaydi, uning o‘rniga suv qaytariladi va OH⁻ hosil bo‘ladi. I⁻ ionlari anodda yodgacha oksidlanadi.'}</p>
    </div>`;
  }

  /* ---------- Sinovlar ---------- */
  function renderTests() {
    ui.tests.innerHTML = C.sol === 'cucl2'
      ? `<button class="btn-ghost btn-sm" id="tPaper">Anodga yod-kraxmalli qog‘oz tutish</button><button class="btn-ghost btn-sm" id="tSyr">Shprislarni bo‘shatish</button>`
      : `<button class="btn-ghost btn-sm ${C.phenol ? 'on' : ''}" id="tPh" ${C.phenol ? 'disabled' : ''}>Katod tomoniga fenolftalein</button><button class="btn-ghost btn-sm ${C.starch ? 'on' : ''}" id="tSt" ${C.starch ? 'disabled' : ''}>Anod tomoniga kraxmal</button><button class="btn-ghost btn-sm" id="tSyr">Shprislarni bo‘shatish</button>`;
    const on = (id, fn) => { const b = $('#' + id, ui.tests); if (b) b.addEventListener('click', fn); };
    on('tPaper', () => {
      const blue = C.nCl2 * VM > 0.3;
      C.paper = blue ? 'blue' : 'white'; C.paperT = performance.now();
      ui.testMsg.className = 'msg ' + (blue ? 'ok' : '');
      ui.testMsg.textContent = blue ? 'Qog‘oz ko‘kardi: Cl₂ + 2KI → 2KCl + I₂, yod kraxmalni ko‘k rangga bo‘yaydi.' : 'Qog‘oz o‘zgarmadi: anodda hali xlor ajralmagan. Tokni ulang.';
      addLog(blue ? 'Yod-kraxmalli qog‘oz ko‘kardi: anodda xlor ajralgani tasdiqlandi.' : 'Yod-kraxmalli qog‘oz o‘zgarmadi: hali xlor yo‘q.');
      if (blue) { steps.mark('paper'); Sound.play('chime', { pitch: 1.2 }); }
    });
    on('tPh', () => { C.phenol = true; Sound.play('drop'); addLog(C.nOH > 1e-5 ? 'Fenolftalein qo‘shildi: katod atrofi darhol pushti rangga kirdi.' : 'Fenolftalein qo‘shildi: eritma rangsiz qoldi, muhit neytral.'); renderTests(); observe(); });
    on('tSt', () => { C.starch = true; Sound.play('drop'); addLog(C.nI2 > 2e-5 ? 'Kraxmal qo‘shildi: anod atrofi to‘q ko‘k rangga kirdi.' : 'Kraxmal qo‘shildi: hali yod yo‘q, rang o‘zgarmadi.'); renderTests(); observe(); });
    on('tSyr', () => { if (C.Q > 0) { ui.testMsg.className = 'msg err'; ui.testMsg.textContent = 'O‘lchash davomida shprislarni bo‘shatib bo‘lmaydi: avval natijani jadvalga yozing.'; return; } C.gasK = 0; C.gasA = 0; C.overK = C.overA = false; ui.testMsg.className = 'msg'; ui.testMsg.textContent = 'Shprislar bo‘shatildi. Gaz hajmi hozirgi o‘lchash uchun qaytadan yig‘iladi.'; });
  }

  /* ---------- Boshqaruv ---------- */
  function syncPanel() {
    $$('button', ui.sol).forEach(b => b.setAttribute('aria-pressed', b.dataset.v === C.sol ? 'true' : 'false'));
    ui.concV.textContent = fmt(C.c, 2) + ' mol/l';
    ui.IV.textContent = fmt(C.I, 2) + ' A';
    ui.m1.textContent = C.m1 === null ? '—' : fmt(C.m1, 3) + ' g';
    ui.m2.textContent = C.m2 === null ? '—' : fmt(C.m2, 3) + ' g';
    ui.scale.textContent = C.lastScale === null ? '—,——— g' : fmt(C.lastScale, 3) + ' g';
    const legend = C.sol === 'cucl2'
      ? [['#3b82c4', 'Cu²⁺ mis ioni'], ['#3fae5a', 'Cl⁻ xlorid ioni'], ['#c0703a', 'Cu mis atomi'], ['#9dbd3a', 'Cl₂ xlor molekulasi']]
      : [['#8b5cf6', 'K⁺ kaliy ioni'], ['#d4952a', 'I⁻ yodid ioni'], ['#9cc3e6', 'H₂O suv'], ['#e04f9a', 'OH⁻ gidroksid ioni'], ['#7a4a12', 'I₂ yod'], ['#cfd8e3', 'H₂ vodorod']];
    ui.legend.innerHTML = legend.map(([c, t]) => `<span><i style="background:${c}"></i>${t}</span>`).join('');
  }
  ui.sol.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.dataset.v === C.sol) return;
    if (C.on) setPower(false);
    C.sol = b.dataset.v; C.showEq = C.pred[C.sol].saved; fresh(true);
    syncPanel(); renderPredict(); renderEq(); renderTests();
    ui.warn.hidden = true;
  });
  ui.conc.addEventListener('input', () => { C.c = parseFloat(ui.conc.value); syncPanel(); });
  ui.conc.addEventListener('change', () => { if (C.on) setPower(false); fresh(true); syncPanel(); });
  ui.fresh.addEventListener('click', () => { if (C.on) setPower(false); fresh(true); syncPanel(); renderTests(); ui.warn.hidden = true; ui.msg.textContent = ''; });
  ui.I.addEventListener('input', () => { C.I = parseFloat(ui.I.value); syncPanel(); psuTone(); });

  const el = id => $('#' + id, panels.tajriba);

    next: el('iNext'), mode: el('iMode'), flip: el('iFlip'), pause: el('iPause'), cap: el('iCap'), hint: el('iHint'), scopeNote: el('iScopeNote'),

  /* ---------- Holat ---------- */
  const S = {

    x: -0.20, target: -0.20, xv: 0, vel: 0, eps: 0, phi: 0, simT: 0,
    auto: { ph: 'in', t: 0 },

    lamp: 0, needle: { th: 0, om: 0 }, pinT: 0,
    pass: { active: false, peak: 0, quiet: 0, id: 0, epoch: 0, x: 0, v: 0, sign: 0 },
    lastPass: null, lastRecId: -1, passSeq: 0, epoch: 1,
    hist: [], histT: -1, scopeY: 0.02,
    cap: { key: '', hold: 0 }, moved: false, dragging: false, grabOff: 0,
    speeds: new Set(), turns: new Set(), wirePh: 0, chart: 'mag',
    rows: store.get('el-induksiya-rows', [])
  };
  if (!Array.isArray(S.rows)) S.rows = [];
  S.rows = S.rows.filter(r => r && (r.mode === 'mag' || r.mode === 'gen') && MAG[r.mag] && NS.includes(r.N) && Number.isFinite(r.eps));
  const genSlow = () => S.f <= 1 ? 1 : S.f / Math.min(S.f, 1 + 0.02 * (S.f - 1));

  /* ---------- Bosqichlar ---------- */
  const steps = makeStepper(el('iSteps'), ui.next, [
    { id: 'theory', html: '<button class="linkish" data-goto="nazariya">Nazariya</button> bilan tanishing: magnit oqimi, Faradey qonuni va Lens qoidasi.' },
    { id: 'push', html: 'Magnitni N qutbi bilan g‘altakka tez kiriting (sichqoncha yoki barmoq bilan suring) va galvanometr strelkasining og‘ishini kuzating.' },
    { id: 'pull', html: 'Magnitni g‘altakdan tortib chiqaring: strelka teskari tomonga og‘adi.' },
    { id: 'flip', html: '“Magnitni aylantirish” tugmasini bosing va magnitni S qutbi bilan kiriting: og‘ish yo‘nalishini solishtiring.' },
    { id: 'speed', html: '“Avto” rejimini yoqing va magnit tezligi v ni o‘zgartiring: tezlik ortsa, EYuK ham ortadi.' },
    { id: 'turns', html: 'O‘ramlar sonini o‘zgartiring (100, 200, 400) va EYuK qanday o‘zgarishini kuzating.' },
    { id: 'record', html: '“Avto” rejimida turli v va N bilan kamida 3 ta o‘lchashni jadvalga yozing va ε<sub>max</sub> – N·v grafigini tahlil qiling.' },
    { id: 'gen', bonus: true, html: 'Qo‘shimcha: “Generator” rejimida f = 50 Hz o‘rnating, lampochkaning yonishini va ε(t) sinusoidasini kuzating.' }
  ]);
  root.addEventListener('click', e => { const b = e.target.closest('[data-goto]'); if (b) { showTab(b.dataset.goto); window.scrollTo({ top: 0, behavior: REDUCED ? 'auto' : 'smooth' }); } });

  /* ---------- Fizika: magnit harakati ---------- */
  function bump() {
    S.epoch++; S.lastPass = null;
    Object.assign(S.pass, { active: true, epoch: -1, quiet: 0, peak: 0 }); // davom etayotgan o'tish o'lchashga kirmaydi
    S.gen.rev = 0; S.gen.meas = null;
  }
  function autoMove(h) {
    const a = S.auto;
    if (a.ph === 'in') { S.x += S.v * h; if (S.x >= 0) { S.x = 0; a.ph = 'holdIn'; a.t = 0; } }
    else if (a.ph === 'out') { S.x -= S.v * h; if (S.x <= -S.xMax) { S.x = -S.xMax; a.ph = 'holdOut'; a.t = 0; } }
    else { a.t += h; if (a.t >= HOLD) a.ph = a.ph === 'holdIn' ? 'out' : 'in'; }
  }
  function stepMag(dt) {
    const n = Math.max(1, Math.ceil(dt / 0.002)), h = dt / n;
    const B = MAG[S.mag].B, c = S.N * S.pol * B * S_COIL;
    for (let i = 0; i < n; i++) {
      const x0 = S.x;
      if (S.mode === 'auto') autoMove(h);
      else { const wf = 26; S.xv += (wf * wf * (S.target - S.x) - 2 * wf * S.xv) * h; S.x += S.xv * h; }
      if (Math.abs(S.x) > S.xMax) { S.x = clamp(S.x, -S.xMax, S.xMax); S.xv = 0; }
      const vi = (S.x - x0) / h;
      const e = -c * (fProf(S.x) - fProf(x0)) / h; // ε = −N·ΔΦ₁/Δt
      if (S.mode === 'auto') { S.eps = e; S.vel = vi; }
      else { const a = 1 - Math.exp(-h / 0.012); S.eps += (e - S.eps) * a; S.vel += (vi - S.vel) * a; }
      S.simT += h;
      trackPass(h);
      if (S.simT - S.histT >= 0.005) { S.hist.push({ t: S.simT, e: S.eps }); S.histT = S.simT; }
    }
    S.phi = S.pol * B * S_COIL * fProf(S.x);
  }
  function trackPass(h) {
    const P = S.pass, ae = Math.abs(S.eps);
    if (ae > THR) {
      if (!P.active) Object.assign(P, { active: true, peak: 0, quiet: 0, id: ++S.passSeq, epoch: S.epoch });
      P.quiet = 0;
      if (ae > P.peak) { P.peak = ae; P.sign = Math.sign(S.eps); P.x = S.x; P.v = S.vel; }
    } else if (P.active) {
      P.quiet += h;
      if (P.quiet >= 0.12) { P.active = false; endPass(); }
    }
  }
  function endPass() {
    const P = S.pass;
    if (P.epoch !== S.epoch) return;
    const p = {
      id: P.id, epoch: P.epoch, peak: P.peak, meas: P.peak * (1 + 0.004 * gauss()), sign: P.sign, x: P.x, v: P.v,
      approach: P.x * P.v < 0, mode: S.mode, N: S.N, mag: S.mag, pol: S.pol, vSet: S.v
    };
    p.facing = (p.x < 0) === (p.pol > 0) ? 'N' : 'S';
    S.lastPass = p;
    if (p.peak / Rtot(p.N) >= 1e-4) {
      if (p.approach && p.facing === 'N') steps.mark('push');
      if (!p.approach && p.facing === 'N') steps.mark('pull');
      if (p.approach && p.facing === 'S') steps.mark('flip');
    }
    if (p.peak >= 1e-3) {
      if (p.mode === 'auto') { S.speeds.add(Math.round(p.vSet * 100)); if (S.speeds.size >= 2) steps.mark('speed'); }
      S.turns.add(p.N); if (S.turns.size >= 2) steps.mark('turns');
    }
  }

  /* ---------- Fizika: generator ---------- */
  function stepGen(dt) {
    const dts = dt / genSlow(), w = TAU * S.f;
    const Bm = GEN_K * MAG[S.mag].B, amp = S.N * Bm * S_COIL * w;
    const n = Math.max(1, Math.ceil(dts / 0.002)), h = dts / n;
    for (let i = 0; i < n; i++) {
      S.gen.th += w * h;
      if (S.gen.th >= TAU) { S.gen.th -= TAU; if (++S.gen.rev >= 1 && S.gen.meas === null) S.gen.meas = amp * (1 + 0.004 * gauss()); }
      S.eps = S.pol * amp * Math.sin(S.gen.th); // Φ₁ = B·S·cos ωt → ε = N·B·S·ω·sin ωt
      S.lamp += ((S.eps / LAMP_V) ** 2 - S.lamp) * (1 - Math.exp(-h / 0.04)); // cho'g'lanma ip issiqlik inertsiyasi
      S.simT += h;
    }
    S.phi = S.pol * Bm * S_COIL * Math.cos(S.gen.th);
    S.vel = 0;
    S.hist.push({ t: S.simT, e: S.eps });
    if (S.f === 50) { S.gen.t50 += dt; if (S.gen.t50 > 2) steps.mark('gen'); }
  }

  /* ---------- Galvanometr strelkasi ---------- */
  function stepNeedle(dt) {
    const nd = S.needle;
    const I = S.mode === 'gen' ? 0 : S.eps / Rtot(S.N);
    const u = clamp(I / (S.range * 1e-3), -1.18, 1.18);
    const wn = TAU * 2.2, z = 0.62, n = Math.max(1, Math.ceil(dt / 0.004)), h = dt / n;
    for (let i = 0; i < n; i++) {
      nd.om += (wn * wn * (u - nd.th) - 2 * z * wn * nd.om) * h;
      nd.th += nd.om * h;
      if (Math.abs(nd.th) > STOP) {
        const sg = Math.sign(nd.th); nd.th = sg * STOP;
        if (sg * nd.om > 2.5 && performance.now() - S.pinT > 350) { S.pinT = performance.now(); Sound.play('tick', { vol: 0.55 }); }
        if (sg * nd.om > 0) nd.om = -nd.om * 0.25;
      }
    }
  }

  /* ---------- Chizish: geometriya ---------- */
  const cv = setupCanvas(ui.canvas, () => draw());
  const sc = setupCanvas(el('iScope'), () => drawScope());
  const cvC = setupCanvas(el('iChart'), () => drawChart());
  function geom() {
    const { w, h } = cv;
    const narrow = w < 560;
    const xMax = narrow ? 0.20 : 0.32;
    const s = (w - 28) / (2 * xMax + MAG_LEN);
    const cx = Math.round(w / 2), ay = Math.round(h * (narrow ? 0.30 : 0.33));
    const cl = COIL_LEN * s, R = clamp(0.042 * s, 24, 46), ri = R * 0.72, mh = R * 0.72 * 0.6, ml = MAG_LEN * s;
    const gR = clamp(Math.min(w * 0.27, (h - ay - R) * 0.6), 56, 112);
    const gcy = h - 34, gtop = gcy - gR - 26, gbw = gR * 2 + 44, gbx = cx - gbw / 2;
    return { w, h, narrow, xMax, s, cx, ay, cl, R, ri, mh, ml, gR, gcx: cx, gcy, gtop, gbw, gbx, gbot: gcy + 22 };
  }
  const magX = g => g.cx + S.x * g.s;
  const rotorX = g => g.cx - g.cl / 2 - 20 - g.ml / 2;

  /* ---------- Chizish: sahna ---------- */
  function draw() {
    const { ctx, w, h } = cv; const P = Palette.c; if (!w) return;
    const g = geom();
    const font = getComputedStyle(document.body).fontFamily;
    const mono = getComputedStyle(document.documentElement).getPropertyValue('--font-mono');
    const gen = S.mode === 'gen';
    const I = S.eps / Rtot(S.N);
    const showI = Math.abs(S.eps) > THR;
    const q = gen ? clamp(Math.abs(S.eps) / 1.0, 0, 1) : clamp(Math.abs(I) / 4e-4, 0, 1);
    const alphaI = showI ? 0.3 + 0.7 * q : 0;
    ctx.clearRect(0, 0, w, h);

    // o'q chizig'i
    ctx.save(); ctx.strokeStyle = P['ink-3']; ctx.globalAlpha = 0.5; ctx.setLineDash([4, 6]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(gen ? rotorX(g) : 8, g.ay + 0.5); ctx.lineTo(gen ? g.cx : w - 8, g.ay + 0.5); ctx.stroke(); ctx.restore();

    // simlar
    const x0 = g.cx - g.cl / 2, x1 = g.cx + g.cl / 2;
    const lx = x0 + 4, rx = x1 - 4, yb = g.ay + g.R, wy = Math.round((yb + g.gtop) / 2);
    const tL = { x: g.gbx + 22, y: g.gtop }, tR = { x: g.gbx + g.gbw - 22, y: g.gtop };
    const wireR = [[rx, yb], [rx, wy], [tR.x, wy], [tR.x, tR.y]];
    const wireL = [[tL.x, tL.y], [tL.x, wy], [lx, wy], [lx, yb]];
    const stroke = pts => { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke(); };
    ctx.lineJoin = 'round'; ctx.strokeStyle = P['ink-2']; ctx.lineWidth = 2.2; stroke(wireR); stroke(wireL);
    if (showI) {
      ctx.globalAlpha = alphaI; ctx.fillStyle = P.warn;
      chevrons(ctx, wireR, S.wirePh, Math.sign(S.eps)); chevrons(ctx, wireL, S.wirePh, Math.sign(S.eps));
      ctx.globalAlpha = 1;
    }

    // g'altak: orqa qatlam
    const nVis = Math.max(6, Math.min(S.N / 10, Math.floor(g.cl / 2.3))), p = g.cl / nVis;
    const top = g.ay - g.R, bot = g.ay + g.R;
    ctx.fillStyle = P['surface-2']; ctx.fillRect(x0, top, g.cl, 2 * g.R);
    ctx.fillStyle = Palette.dark ? 'rgba(0,0,0,0.28)' : 'rgba(16,28,46,0.07)'; ctx.fillRect(x0, g.ay - g.ri, g.cl, 2 * g.ri);
    ctx.strokeStyle = P.copper; ctx.globalAlpha = 0.42; ctx.lineWidth = Math.max(0.8, Math.min(1.6, p * 0.5));
    ctx.beginPath();

    ctx.stroke(); ctx.globalAlpha = 1;

    // g'altak: old qatlam

    ctx.beginPath();

    ctx.fillStyle = sh; ctx.fillRect(x0, top, g.cl, 2 * g.R);
    ctx.fillStyle = P['ink-3']; ctx.globalAlpha = 0.85;
    roundRect(ctx, x0 - 5, top - 5, 5, 2 * g.R + 10, 2); ctx.fill();
    roundRect(ctx, x1, top - 5, 5, 2 * g.R + 10, 2); ctx.fill();
    ctx.globalAlpha = 1;
    // uchlaridagi chiqish simlari (mis)
    ctx.strokeStyle = P.copper; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(lx, bot - 3); ctx.lineTo(lx, bot + 4); ctx.moveTo(rx, bot - 3); ctx.lineTo(rx, bot + 4); ctx.stroke();

    // o'ramlardagi induksion tok yo'nalishi
    if (showI) {
      const dn = S.eps > 0; // ε > 0: B_ind +x yo'nalishda, old o'ramlarda tok pastga
      const xs = g.cl > 60 ? [g.cx - g.cl / 4, g.cx + g.cl / 4] : [g.cx];
      ctx.globalAlpha = alphaI;
      xs.forEach(x => vArrow(ctx, x, g.ay - g.R * 0.62, g.ay + g.R * 0.62, dn, P));
      ctx.globalAlpha = 1;
    }
    // g'altakda hosil bo'lgan qutblar (Lens qoidasi)
    const by = top - 16, off = g.narrow ? 12 : 0;
    ctx.font = '600 12px ' + font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = P['ink-2']; ctx.fillText('N = ' + S.N, g.cx, by);
    if (showI) {
      const leftN = S.eps < 0; // dΦ/dt > 0 → B_ind −x → chap uchi N
      ctx.globalAlpha = alphaI;
      badge(ctx, x0 - off, by, leftN ? 'N' : 'S', font); badge(ctx, x1 + off, by, leftN ? 'S' : 'N', font);
      ctx.globalAlpha = 1;
    }

    // Lens kuchi (magnitga ta'sir)
    if (!gen && showI && Math.abs(S.vel) > 0.01) {
      const mx = magX(g), dir = -Math.sign(S.vel), len = 16 + 30 * q, y = top - (g.narrow ? 34 : 40);
      ctx.globalAlpha = alphaI; ctx.strokeStyle = P.ink; ctx.fillStyle = P.ink; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(mx, y); ctx.lineTo(mx + dir * len, y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(mx + dir * (len + 7), y); ctx.lineTo(mx + dir * len, y - 4.5); ctx.lineTo(mx + dir * len, y + 4.5); ctx.closePath(); ctx.fill();
      ctx.font = 'italic 600 13px ' + font; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText('F', mx + dir * len * 0.5, y - 4);
      ctx.globalAlpha = 1;
    }

    // asbob: galvanometr yoki lampochka
    if (gen) drawLamp(ctx, g, font, mono, P);
    else drawGalv(ctx, g, font, mono, P);
    [tL, tR].forEach(t => { ctx.beginPath(); ctx.arc(t.x, t.y, 5, 0, TAU); ctx.fillStyle = P.metal; ctx.fill(); ctx.beginPath(); ctx.arc(t.x, t.y, 2, 0, TAU); ctx.fillStyle = P.surface; ctx.fill(); });

    // ma'lumot
    if (!g.narrow) {
      ctx.font = '12px ' + mono; ctx.fillStyle = P['ink-3']; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText(gen ? `N = ${S.N} · S = 12,6 sm² · R = ${fmt(R_TURN * S.N, 0)} Om (g‘altak)` : `N = ${S.N} · S = 12,6 sm² · R = ${fmt(Rtot(S.N), 0)} Om`, 12, 10);
      if (gen) subText(ctx, [['B', 0], ['m', 1], [` = ${fmt(GEN_K * MAG[S.mag].B, 3)} Tl · f = ${S.f} Hz`, 0]], 12, 27, 12, mono);
      else ctx.fillText(`B₀ = ${fmt(MAG[S.mag].B, 2)} Tl (${MAG[S.mag].name.toLowerCase()} magnit)`, 12, 27);

      if (bx - ax > 30) {
        ctx.save(); ctx.strokeStyle = P.phys; ctx.fillStyle = P.phys; ctx.lineWidth = 1.6; ctx.setLineDash([5, 4]);
        ctx.lineDashOffset = REDUCED ? 0 : -(performance.now() / 60) % 9;

  /* ---------- Nazariya ---------- */
  panels.nazariya.innerHTML = `<div class="theory-grid">

      <p>1831-yilda ingliz fizigi <b>Maykl Faradey</b> yopiq konturni kesib o‘tuvchi magnit oqimi o‘zgarganda konturda elektr toki hosil bo‘lishini aniqladi. Bu hodisa <b>elektromagnit induksiya</b>, hosil bo‘lgan tok esa <b>induksion tok</b> deyiladi.</p>
      <p>Induksion tok magnit maydon borligidan emas, balki <b>magnit oqimining o‘zgarishidan</b> paydo bo‘ladi. Magnit g‘altak ichida qo‘zg‘almay tursa, maydon kuchli bo‘lsa ham, tok bo‘lmaydi.</p>
      <h2>Magnit oqimi</h2>
      <p>Yuzi S bo‘lgan sirtni kesib o‘tuvchi magnit oqimi Φ = B·S·cos α ga teng. Bu yerda B – magnit induksiyasi, α – B vektori bilan sirt normali orasidagi burchak. Magnit oqimining birligi veber: 1 Wb = 1 Tl·m².</p>
      <p>Magnit oqimini uch usulda o‘zgartirish mumkin: B ni (magnitni yaqinlashtirib yoki uzoqlashtirib), S ni yoki α ni (magnitni yoki konturni aylantirib).</p>
      <h2>Faradey qonuni</h2>

      <h2>Lens qoidasi</h2>

          <tr><td>S qutb yaqinlashadi</td><td>ortadi</td><td>S qutb</td><td>itaradi</td></tr>
          <tr><td>S qutb uzoqlashadi</td><td>kamayadi</td><td>N qutb</td><td>tortadi</td></tr>
        </tbody>
      </table></div>
      <p class="note">Lens qoidasi energiyaning saqlanish qonuniga mos: magnitni g‘altakka kiritish uchun ham, chiqarish uchun ham ish bajarish kerak. Shu ish induksion tok energiyasiga aylanadi.</p>
      <h2>Kerakli jihozlar</h2>

        <li>G‘altaklar: 100, 200 va 400 o‘ramli (ichki diametri 4 sm, ko‘ndalang kesim yuzi S = 12,6 sm²)</li>

      <div class="formula"><span>I = <span class="frac"><span>ε</span><span>R<sub>g</sub> + R<sub>G</sub></span></span></span><span class="cap">Zanjirdagi induksion tok (Om qonuni)</span></div>
      <div class="formula"><span>ε<sub>max</sub> = N·B·S·ω</span><span class="cap">Generator EYuK amplitudasi</span></div>
      <div class="formula"><span>ω = 2πf</span><span class="cap">Burchak tezlik (siklik chastota), rad/s</span></div>

  root.addEventListener('click', e => { const b = e.target.closest('[data-goto]'); if (b) { showTab(b.dataset.goto); window.scrollTo({ top: 0, behavior: REDUCED ? 'auto' : 'smooth' }); } });

  /* ---------- Chizish ---------- */
  const cv = setupCanvas(el('pCanvas'), () => draw());

  function geom() {

  function bobPos() { const { px, py, s } = geom(); const L = Lval() * s; return { x: px + L * Math.sin(S.th), y: py + L * Math.cos(S.th) }; }
  function draw() {
    const { ctx, w, h } = cv; const P = Palette.c; if (!w) return;
    ctx.clearRect(0, 0, w, h);

    // shtativ

    ctx.fillRect(standX, py - 10, px - standX + 8, 6);
    roundRect(ctx, standX - 7, py - 15, 14, 16, 3); ctx.fill();
    ctx.fillStyle = P.ink; ctx.beginPath(); ctx.arc(px, py - 4, 4, 0, TAU); ctx.fill();

    const rx = px - 46;
    ctx.globalAlpha = held ? 1 : 0.28;
    ctx.fillStyle = P.dark ? '#2a2412' : '#fbf3cf';
    ctx.strokeStyle = P.dark ? '#6b5d22' : '#d8c36a';

    ctx.strokeStyle = P['ink-2']; ctx.fillStyle = P['ink-2']; ctx.lineWidth = 1;

      if (c % 20 === 0) ctx.fillText(String(c), rx - 22, y);

    ctx.textAlign = 'right'; ctx.fillText('sm', rx - 22, py + 2.0 * s + 14);

      ctx.strokeStyle = P.phys; ctx.setLineDash([3, 3]);

      const lt = 'l = ' + fmt(Lval(), 3) + ' m';

      ctx.fillStyle = P.phys; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillText(lt, rx - 26, yr);

      ctx.fillStyle = P['ink-2']; ctx.font = '11px ' + font; ctx.textAlign = 'center'; ctx.textBaseline = 'top';

  }
  function drawChart() {

  /* ---------- Jadval va hisoblar ---------- */
  function currentRows() { return S.rows.filter(r => r.planet === S.planet && (S.planet !== 'x' || r.gx === S.xg)); }
  function fitK(rows) {

    S.rows.push({ id: Date.now() + Math.random(), planet: sn.planet, gx: sn.gx, l, a: sn.a, N, t, T, g, src });

    } else {

  function renderSummary() {

    const eps = gt && rows.length ? Math.abs(avg - gt) / gt * 100 : NaN;

      <div class="stat"><div class="lbl">g o‘rtacha (${pl.name})</div><div class="val">${fmt(avg, 2)}</div><div class="sub">${rows.length} ta o‘lchash, m/s²</div></div>

    if (S.planet === 'x') {

  function updateSteps() {

  /* ---------- Boshqaruv ---------- */
  function syncControls() {

NAV_OF.titrlash = 'kimyo';
Pages.titrlash = app => {
  const KW = 1e-14;        // suvning ion ko'paytmasi, 25 °C
  const DROP = 0.05;       // 1 tomchi, ml
  const CAP = 50;          // byuretka sig'imi, ml
  const LOCAL = 1.0;       // tomchi tushgan joydagi aralashish hajmi, ml (mahalliy rang uchun)
  const FLOW = { sekin: 2, tez: 16 }; // tomchi/s: 0,1 va 0,8 ml/s
  const ACID = {
    hcl: { name: 'HCl', full: 'xlorid kislota', kind: 'kuchli', Ka: 0 },
    ac: { name: 'CH₃COOH', full: 'sirka kislota', kind: 'kuchsiz', Ka: 1.8e-5 }
  };
  const IND = {
    ff: { name: 'fenolftalein', Name: 'Fenolftalein', lo: 8.2, hi: 10.0, from: 'rangsiz', mid: 'och pushti', to: 'to‘q pushti (malina)' },
    mo: { name: 'metiloranj', Name: 'Metiloranj', lo: 3.1, hi: 4.4, from: 'qizil', mid: 'to‘q sariq', to: 'sariq' },
    bb: { name: 'bromtimol ko‘k', Name: 'Bromtimol ko‘k', lo: 6.0, hi: 7.6, from: 'sariq', mid: 'yashil', to: 'ko‘k' }
  };
  const IND_KEYS = ['ff', 'mo', 'bb'];
  const STOPS = { mo: [[206, 38, 48], [236, 116, 28], [236, 186, 30]], bb: [[220, 190, 40], [62, 150, 84], [36, 98, 204]] };

  /* ---------- Kimyo: aniq pH ---------- */
  // nA, nB — mmol, V — ml (mmol/ml = mol/l)
  function pHof(acid, nA, nB, V) {
    if (!(V > 0)) return 7;
    const Ka = ACID[acid].Ka;
    if (!Ka) {
      const d = (nA - nB) / V;
      if (d >= 0) return -Math.log10((d + Math.sqrt(d * d + 4 * KW)) / 2);
      const oh = (-d + Math.sqrt(d * d + 4 * KW)) / 2;
      return 14 + Math.log10(oh); // pH = −lg(Kw/[OH⁻])
    }
    // zaryad balansi: [H⁺] + [Na⁺] = Ka·Ct/(Ka + [H⁺]) + Kw/[H⁺]; lg[H⁺] bo'yicha bisektsiya
    const Ct = nA / V, Na = nB / V;
    let lo = -15, hi = 1;
    for (let i = 0; i < 56; i++) {
      const m = (lo + hi) / 2, h = Math.pow(10, m);
      if (h + Na - Ka * Ct / (Ka + h) - KW / h > 0) hi = m; else lo = m;
    }
    return -(lo + hi) / 2;
  }
  const phCurve = (acid, Ca, Va, Cb, Vb) => pHof(acid, Ca * Va, Cb * Vb, Va + Vb);

  /* ---------- Indikator rangi ---------- */
  function indFrac(k, pH) { const d = IND[k], mid = (d.lo + d.hi) / 2, s = Math.log10(9) / ((d.hi - d.lo) / 2); return 1 / (1 + Math.pow(10, (mid - pH) * s)); }
  function indRGBA(k, f) {
    if (k === 'ff') return [210, 24, 118, 0.8 * f];
    const st = STOPS[k], t = f < 0.5 ? f * 2 : (f - 0.5) * 2, A = st[f < 0.5 ? 0 : 1], B = st[f < 0.5 ? 1 : 2];

  /* ---------- Jadval va xulosa ---------- */
  function renderRows() {
    ui.rows.innerHTML = S.rows.length ? S.rows.map((r, i) => `<tr>
      <td>${i + 1}</td><td class="txt">${ACID[r.acid].name}${r.xid ? ' (noma’lum)' : ''}</td><td class="txt"><i class="tt-sw" style="${swatchBg(rgba(indRGBA(r.ind, indFrac(r.ind, r.ph)), 1))}"></i>${IND[r.ind].name}</td>
      <td>${fmt(r.Va, 2)}</td><td>${fmt(r.Cb, 2)}</td><td>${fmt(r.V, 2)}</td><td>${fmt(r.ph, 2)}</td><td><b>${fmt(r.C, 4)}</b></td>
      <td>${r.rev ? fmt(r.Ct, 4) : '?'}</td><td><b>${r.rev ? sgn(r.err) : '?'}</b></td>
      <td><button class="del" data-del="${r.id}" aria-label="${i + 1}-qatorni o‘chirish">×</button></td></tr>`).join('')
      : `<tr><td colspan="11" class="empty">Hali natija yo‘q. NaOH qo‘shing va indikator rangi o‘zgarganda “Rang o‘zgardi: hajmni yozish”ni bosing.</td></tr>`;
    // joriy namuna (kislota, konsentratsiya, indikator) bo'yicha parallel natijalar
    const cur = S.rows.filter(r => sampleKey(r) === sampleKeyNow());
    const n = cur.length, avg = a => a.reduce((s, x) => s + x, 0) / a.length;
    const aV = n ? avg(cur.map(r => r.V)) : NaN, aC = n ? avg(cur.map(r => r.C)) : NaN;
    const spread = n > 1 ? Math.max(...cur.map(r => r.V)) - Math.min(...cur.map(r => r.V)) : NaN;
    const hidden = S.mode === 'x' && !S.x.rev;
    const err = n ? (aC - Ctrue()) / Ctrue() * 100 : NaN;
    const cls = hidden || !Number.isFinite(err) ? '' : Math.abs(err) <= 1 ? 'good' : Math.abs(err) <= 5 ? 'warn' : 'bad';
    ui.summary.innerHTML = `
      <div class="stat"><div class="lbl">Parallel titrlashlar</div><div class="val">${n}</div><div class="sub">${ACID[S.acid].name} + ${IND[S.ind].name}${n > 1 ? `, V farqi ${fmt(spread, 2)} ml` : ''}</div></div>
      <div class="stat"><div class="lbl">O‘rtacha V(NaOH)</div><div class="val">${n ? fmt(aV, 2) : '—'}</div><div class="sub">ml</div></div>
      <div class="stat"><div class="lbl">O‘rtacha C(kislota)</div><div class="val">${n ? fmt(aC, 4) : '—'}</div><div class="sub">mol/l, haqiqiy: ${hidden ? '?' : fmt(Ctrue(), 4)}</div></div>
      <div class="stat ${cls}"><div class="lbl">Nisbiy xatolik</div><div class="val">${!n ? '—' : hidden ? '?' : sgn(err) + '%'}</div><div class="sub">${hidden ? 'javobni tekshirgach ochiladi' : 'o‘rtacha C bo‘yicha'}</div></div>`;
    renderXCheck(aC);
    renderMatrix();
    updateSteps();
  }
  ui.rows.addEventListener('click', e => {

  function renderMatrix() {
    const vis = S.rows.filter(r => r.rev);
    const cell = (a, k) => {
      const rs = vis.filter(r => r.acid === a && r.ind === k);
      if (!rs.length) return '<td class="none">—</td>';
      const e = rs.reduce((s, r) => s + r.err, 0) / rs.length, ae = Math.abs(e);
      return `<td class="${ae <= 1 ? 'good' : ae <= 5 ? 'warn' : 'bad'}">${sgn(e)}<span class="n">(${rs.length})</span></td>`;
    };
    ui.matrix.innerHTML = `<thead><tr><th>Indikator</th>${Object.keys(ACID).map(a => `<th>${ACID[a].name} (${ACID[a].kind})</th>`).join('')}</tr></thead>
      <tbody>${IND_KEYS.map(k => `<tr><td><i class="tt-sw" style="${swatchBg(rgba(indRGBA(k, 1)))}"></i>${IND[k].Name} <span class="muted small tt-rg">pH ${fmt(IND[k].lo, 1)}–${fmt(IND[k].hi, 1)}</span></td>${Object.keys(ACID).map(a => cell(a, k)).join('')}</tr>`).join('')}</tbody>`;
    const am = vis.filter(r => r.acid === 'ac' && r.ind === 'mo');
    const af = vis.filter(r => r.acid === 'ac' && r.ind === 'ff');

      const e = am.reduce((s, r) => s + r.err, 0) / am.length;
      bad = true;
      note = `<b>Sirka kislota + metiloranj: o‘rtacha xatolik ${sgn(e)}%.</b> Metiloranj pH 3,1–4,4 da rang o‘zgartiradi. Sirka kislota kuchsiz bo‘lgani uchun eritma bu oraliqdan kislotaning uchdan bir qismi ham neytrallanmasdan o‘tib ketadi: indikator juda erta sariq bo‘ladi, sarflangan NaOH hajmi va topilgan konsentratsiya juda kam chiqadi. Kuchsiz kislotaning ekvivalentlik nuqtasi pH ≈ 8,7 da (ishqoriy muhit): o‘tish oralig‘i 8,2–10,0 bo‘lgan fenolftalein mos keladi.`
        + (af.length ? ` Fenolftalein bilan xatolik: ${sgn(af.reduce((s, r) => s + r.err, 0) / af.length)}%.` : ' Endi shu kislotani fenolftalein bilan titrlab solishtiring.');
    } else {
      note = 'Qoida: indikatorning o‘tish oralig‘i titrlash egri chizig‘idagi pH sakrashi ichida bo‘lishi kerak. Kuchli kislotada sakrash keng (taxminan pH 4–10), shuning uchun uchala indikator ham yaraydi. Sirka kislotani metiloranj va fenolftalein bilan titrlab, xatoliklarni solishtiring.';
    }
    ui.matrixNote.className = 'tt-note' + (bad ? ' bad' : '');
    ui.matrixNote.innerHTML = note;
  }

  function renderXCheck(avgC) {
    if (S.mode !== 'x') { ui.xCheck.innerHTML = ''; return; }
    ui.xCheck.innerHTML = `<div class="divider"></div>
      <h3 class="tt-h">Noma’lum namuna: javobni tekshirish</h3>
      <div class="btn-row tt-x"><label class="inline-label" for="tXAns">C(${ACID[S.acid].name}) =</label><input type="text" inputmode="decimal" id="tXAns" placeholder="${Number.isFinite(avgC) ? fmt(avgC, 4) : '0,0000'}" autocomplete="off"><span class="muted small">mol/l</span>
      <button class="btn btn-sm" id="tXBtn">Javobni tekshirish</button><button class="btn-ghost btn-sm" id="tXShow">Javobni ko‘rsatish</button></div>
      <p class="msg ${S.x.rev ? 'ok' : ''}" id="tXMsg">${S.x.rev ? `Bu namunaning haqiqiy konsentratsiyasi: ${fmt(S.x.c, 4)} mol/l.` : 'Bir nechta parallel titrlash o‘rtachasini 4 xona aniqlikda kiriting (bo‘sh qoldirilsa, o‘rtacha qiymat olinadi).'}</p>`;
    const m = $('#tXMsg', ui.xCheck);
    const reveal = () => {
      S.x.rev = true; store.set('el-titrlash-x', S.x);

    };
    $('#tXBtn', ui.xCheck).addEventListener('click', () => {
      if (S.x.rev) { m.className = 'msg err'; m.textContent = `Bu namunaning javobi allaqachon ko‘rsatilgan (${fmt(S.x.c, 4)} mol/l). Qo‘shimcha topshiriq uchun “Boshqa noma’lum namuna”ni oling va uni o‘zingiz aniqlang.`; Sound.play('error'); return; }
      const raw = $('#tXAns', ui.xCheck).value.trim();
      const v = raw ? parseNum(raw) : avgC;
      if (!(v > 0)) { m.className = 'msg err'; m.textContent = 'Avval titrlang yoki konsentratsiyani kiriting.'; return; }
      const e = Math.abs(v - S.x.c) / S.x.c * 100;
      if (e <= 2) {
        Sound.play('chime'); steps.mark('unknown'); reveal(); renderRows();
        const mm = $('#tXMsg', ui.xCheck); mm.className = 'msg ok';
        mm.textContent = `To‘g‘ri! Haqiqiy konsentratsiya ${fmt(S.x.c, 4)} mol/l, sizning javobingiz ${fmt(v, 4)} mol/l, farq ${fmt(e, 1)}%.`;

      }
      Sound.play('error');
      const usedMo = S.rows.some(r => r.xid === S.x.id && r.acid === 'ac' && r.ind === 'mo');
      m.className = 'msg err';
      m.textContent = `Hali aniq emas: farq ${fmt(e, 1)}% (2% dan katta). ` + (usedMo
        ? 'Sirka kislota uchun metiloranj mos emas: fenolftalein bilan titrlang.'
        : 'Oxirgi nuqtaga yaqinlashganda NaOH ni tomchilab qo‘shing va bir nechta parallel titrlash o‘rtachasini oling. Hisobni tekshiring: C = C(NaOH)·V(NaOH)/V(kislota).');
    });
    $('#tXShow', ui.xCheck).addEventListener('click', () => { reveal(); renderRows(); });
  }

  function updateSteps() {
    if (S.rows.length) steps.mark('record');
    const cnt = {}; S.rows.forEach(r => { const k = sampleKey(r); cnt[k] = (cnt[k] || 0) + 1; });
    if (Object.values(cnt).some(c => c >= 3)) steps.mark('parallel');
    const has = (a, k) => S.rows.some(r => r.acid === a && r.ind === k);
    if (has('ac', 'mo') && has('ac', 'ff')) steps.mark('weak');
  }

  /* ---------- Ko'rsatkichlar va kuzatish ---------- */
  let lcdPrev = '', obsPrev = '';
  function lcd(force) {
    const f = indFrac(S.ind, S.phMix), c = rgba(indRGBA(S.ind, f), alphaK());
    const cells = [
      ['Qo‘shilgan NaOH', fmt(vIn(), 2) + ' ml'], ['Byuretka ko‘rsatkichi', fmt(reading(), 2) + ' ml'], ['pH (pH-metr)', fmt(S.phMix, 2)],
      ['Eritma rangi', `<span class="tt-colval"><i style="${swatchBg(c)}"></i>${colorName(S.ind, f)}</span>`],
      ['Kolbadagi hajm', fmt(S.Va + vIn(), 2) + ' ml'], ['n(NaOH)', fmt(S.Cb * vIn(), 3) + ' mmol']
    ];
    const html = cells.map(([l, v]) => `<div class="lcd-cell"><span class="lbl">${l}</span><span class="val">${v}</span></div>`).join('');
    if (force || html !== lcdPrev) { ui.lcd.innerHTML = html; lcdPrev = html; }
  }
  function obs(force) {
    const f = indFrac(S.ind, S.phMix), name = colorName(S.ind, f), d = IND[S.ind], V = vIn(), df = Math.abs(f - S.f0);
    let t;
    if (S.empty) t = '<b>Byuretka bo‘sh.</b> Uni 0,00 belgisigacha to‘ldiring: umumiy sarf hisobga olinadi.';
    else if (V === 0) t = `Kolbada ${ACID[S.acid].name} eritmasi va ${d.name}: eritma <b>${name}</b>. Jo‘mrakni oching yoki rasmdagi jo‘mrakni bosib, 1 tomchi qo‘shing.`;
    else if (S.t - S.lastFlash < 1.6 && df < 0.4) t = `Tomchi tushgan joyda <b>${colorName(S.ind, S.lastFlashF)}</b> dog‘ paydo bo‘lib, ${S.stir ? 'aralashtirilganda' : 'asta-sekin'} yo‘qolmoqda: indikator rangi o‘zgaradigan nuqta yaqin. NaOH ni tomchilab qo‘shing.`;
    else if (df >= 0.5) t = `Butun eritma <b>${name}</b> rangga kirdi.` + (S.recorded ? ' Natija yozildi.' : ' Rang yo‘qolmasa, hajmni yozing.') + (S.ind === 'ff' && S.phMix > 11 ? ' Rang juda to‘q: ishqor ortiqcha qo‘shilgan bo‘lishi mumkin.' : '');
    else if (df >= 0.15) t = `Rang o‘zgara boshladi: eritma <b>${name}</b>. Indikator o‘tish oralig‘ida (pH ${fmt(d.lo, 1)}–${fmt(d.hi, 1)}).`;
    else if (!S.stir) t = '<b>Aralashtirgich o‘chiq:</b> NaOH eritmaga sekin tarqaladi, rang va pH kechikib o‘zgaradi. Magnit aralashtirgichni yoqing.';
    else t = `NaOH qo‘shilmoqda: pH = ${fmt(S.phMix, 2)}, eritma hali <b>${name}</b>.`;
